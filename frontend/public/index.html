<!DOCTYPE html>
<html lang="en">
  <head>    
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />

    <!--
      🐛 <title> 이 아예 없었다. 그래서 자바스크립트가 실행되기 전(그리고 제목을 세우지
      않는 화면에서) 탭에 URL 이 그대로 보였다. Header 가 그리던 <title> 은 <body> 안이라
      React 18 에서는 무시된다 — 화면별 제목은 hook/useDocumentTitle 이 세운다.
      여기 값은 첫 페인트 전까지의 기본값이다.
    -->
    <title>ysyproject</title>
    <meta name="description" content="ysyproject — 온라인 쇼핑몰" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <!--
      외부 CSS · 스크립트를 두지 않는다 — index.html 이 받는 것은 이 출처의 번들뿐이다(indexHtml.test.js 가 지킨다).

      🔒 예전에는 채팅 아이콘 셋(fa-times · fa-plus · fa-angle-down)을 위해 Font Awesome 5.8.2 의 all.min.css 를
         cdnjs 에서 무결성 해시(SRI) 없이 받았다 — CDN 이 오염되면 우리 화면에 남의 CSS(속성 선택자로 입력값을 빼내는
         CSS 포함)가 들어오고, 그 CSS 가 받는 웹폰트는 SRI 로도 지킬 수 없었다. 같은 Font Awesome 5 아이콘을
         react-icons/fa(SVG, 이미 쓰던 의존성)로 그린다 — 외부 도메인 0, 아이콘 셋을 위한 CSS · 웹폰트 수백 KB 도 없다.
      [JA] 外部 CSS・スクリプトを置かない。以前はチャットのアイコン 3 つのために Font Awesome を CDN から SRI なしで
           読んでいた。同じアイコンを react-icons/fa(SVG)で描く — 外部ドメイン 0。
    -->
</head>
<body>
    <div id="root"></div>
    <div id="modal"></div>
</body>
</html>
