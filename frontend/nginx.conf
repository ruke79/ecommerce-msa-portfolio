# 프론트엔드 정적 서빙 + API/SSE/WebSocket 프록시.
#
# ⚠️ 이 파일은 nginx 이미지의 **템플릿**으로 마운트된다(/etc/nginx/templates/default.conf.template).
#    공식 엔트리포인트가 기동 시 envsubst 로 ${GATEWAY_URL} 등을 치환한다.
#    Dockerfile 이 NGINX_ENVSUBST_FILTER 로 치환 대상을 제한하므로 nginx 자체 변수
#    ($host, $remote_addr 등)는 건드리지 않는다 — 필터가 없으면 그것들까지 빈 문자열이 된다.
#
# ⚠️ 아래 프록시 블록(/api/, /sse/, /ws/)은 **현재 운영 배포에서 실행되지 않는다.**
#
#    cloudflared 가 `/*-service/` 경로를 게이트웨이로 **직접** 보내므로 그 요청은 nginx 에
#    닿지 않는다. 프론트엔드가 실제로 부르는 주소도 `/user-service/api/...` 형태다
#    (util/api.js) — 여기 적힌 `/api/` 와 맞지 않는다.
#
#    틀린 설정은 아니고, cloudflared 없이 nginx 하나로 띄우는 구성에서는 그대로 쓰인다.
#    지워 버리면 그 구성이 사라지므로 남겨 둔다. 다만 **적어 두지 않으면** 다음 사람이
#    "SSE 는 nginx 가 프록시한다"고 믿고, SSE 가 끊길 때 여기부터 뒤지게 된다.
#    실제로 SSE 버퍼링을 봐야 할 곳은 cloudflared 와 게이트웨이다.
#
# 비-루트 사용자로 실행하기 위해 1024 이상 포트(8080)를 사용합니다.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ── 보안 헤더(docs/57 §19) ─────────────────────────────────────────────
    #
    # 🔒 예전에는 하나도 없었다 — 결제 · 계정 · 관리자 화면을 남의 사이트가 투명한 iframe 에 넣어 누르게 하는 클릭재킹이
    #    가능했다(2026-10-22 점검, manuscripts 보안 Q33). 한 겹씩:
    #   · X-Frame-Options DENY + CSP frame-ancestors 'none' — 어떤 사이트도 이 화면을 프레임에 넣지 못한다(옛 · 새 브라우저 둘 다)
    #   · CSP 전체는 **강제**(2026-10-25 — 그 전 사흘은 Report-Only). 결제 SDK(PortOne v1 · v2, PayPal)와 MUI · emotion 의
    #     인라인 스타일이 있어 처음에는 보고만 했다(Q26: '나중에 넣는 CSP 는 report-only 로 위반부터 모은다'). 운영에서 카드 ·
    #     PayPal · 무통장을 한 바퀴 돌려 콘솔 위반 0 을 확인하고 바꿨다. script-src 에 'unsafe-inline' 을 넣지 않는다.
    #     ⚠️ 새 외부 스크립트 · 결제창 · API 출처를 쓰게 되면 이 정책에 먼저 더한다 — 빠지면 그 기능이 조용히 막힌다(콘솔에만 보인다).
    #     포트원은 숨긴 채(HIDDEN_METHODS) 바꿨다 — 다시 열 때 결제창까지 한 번 돌려 콘솔을 본다.
    #   · nosniff · Referrer-Policy(다른 출처에는 출처만 — 재설정 링크의 ?token= 이 새지 않는다) · Permissions-Policy
    #   · HSTS 1년 — includeSubDomains 는 붙이지 않는다(다른 하위 도메인을 이 설정이 묶지 않게). HTTP(실습)에서는 브라우저가 무시한다
    #
    # ⚠️ nginx 는 location 안에 add_header 가 **하나라도** 있으면 server 의 add_header 를 물려받지 않는다. 그래서 add_header 를
    #    쓰는 location(/healthz · /static/ · /index.html)에도 같은 줄을 둔다 — nginxHeaders.test.js 가 빠진 곳을 찾는다.
    # [JA] セキュリティヘッダー。以前は一つもなくクリックジャッキングが可能だった。CSP は 3 日間 Report-Only で違反を集め、
    #      0 件を確かめて強制にした(2026-10-25)。新しい外部オリジンは先にこのポリシーへ足す。nginx は location に add_header が一つでもあると server の分を継承しない — 各 location にも同じ行を置く。
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.iamport.kr https://cdn.portone.io https://www.paypal.com https://*.paypal.com https://*.paypalobjects.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.paypal.com https://*.portone.io https://*.iamport.kr; frame-src https://*.paypal.com https://*.portone.io https://*.iamport.kr; form-action 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 🔒 소스맵은 내보내지 않는다.
    #
    # 빌드는 hidden-source-map 이라 번들에 `//# sourceMappingURL=` 주석이 없다 — 브라우저는
    # 맵을 찾지 않는다. 하지만 **파일은 dist/ 에 그대로 있다.** 주석이 없을 뿐이므로
    # `/main.bundle.js.map` 을 직접 찍으면 원본 소스가 주석까지 통째로 내려간다.
    # 이 저장소의 주석에는 어떤 공격 경로를 어떻게 막았는지가 적혀 있다.
    #
    # 맵 자체를 안 만들면(devtool:false) 나중에 스택트레이스를 풀 방법이 사라지므로,
    # 만들되 **서빙만 막는다.** 오류 추적 도구에는 빌드 산출물로 따로 올리면 된다.
    location ~ \.map$ {
        access_log off;
        return 404;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.iamport.kr https://cdn.portone.io https://www.paypal.com https://*.paypal.com https://*.paypalobjects.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.paypal.com https://*.portone.io https://*.iamport.kr; frame-src https://*.paypal.com https://*.portone.io https://*.iamport.kr; form-action 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # ── SSE (Server-Sent Events) ─────────────────────────────────────────────
    #
    # 알림 스트림이 이 경로를 탄다(frontend/src/util/Notification.js 의 EventSource).
    #
    # SSE 가 프록시를 통과하지 못하는 실패는 진단이 어렵다 — 연결은 맺어지고 HTTP 200 이 오고
    # 오류도 없는데 이벤트만 도착하지 않는다. 애플리케이션을 아무리 뒤져도 원인이 안 나온다.
    #
    # ⚠️ 무엇이 실제로 SSE 를 죽이는지 **직접 측정했다**(ops/18-test-nginx-sse.sh).
    #    흔히 "proxy_buffering 이 범인"이라고들 하는데, nginx 1.27 + 소량 청크 조합에서는
    #    그것만으로는 지연이 생기지 않았다:
    #
    #      proxy_buffering on 만          → 첫 이벤트 0.02초 (지연 없음)
    #      HTTP/1.0 (nginx 기본)          → 첫 이벤트 0.01초 (지연 없음)
    #      gzip 을 text/event-stream 에 적용 → **12초 내 한 건도 도착하지 않음**
    #
    #    즉 이 환경에서 확실한 범인은 **gzip**(⑤)이다. 나머지는 상황에 따라 문제가 되므로
    #    (버퍼가 커서 채워지길 기다리는 경우, 프록시 계층이 더 있는 경우, 타임아웃 만료 등)
    #    방어적으로 함께 꺼 두지만, "이것만 켜면 반드시 깨진다"고 단정하지는 않는다.
    location /sse/ {
        proxy_pass ${GATEWAY_URL};

        # ① 응답 버퍼링을 끈다.
        #    측정상 이것만으로 지연이 생기지는 않았지만, 버퍼 크기·업스트림 청크 크기·프록시
        #    단수에 따라 달라진다. 스트리밍 구간에서 버퍼링을 켤 이유가 없으므로 끈다.
        proxy_buffering off;
        proxy_request_buffering off;

        # ② 캐시 금지. 스트림을 캐시하려 들면 같은 이유로 막히고, 최악의 경우 한 사용자의
        #    이벤트가 다른 사용자에게 전달될 수 있다.
        proxy_cache off;

        # ③ HTTP/1.1 로 붙고 Connection 헤더를 비운다.
        #    nginx 는 업스트림에 기본적으로 HTTP/1.0 + 'Connection: close' 로 붙는다.
        #    측정상 이 조합에서도 스트리밍은 됐지만(업스트림이 연결 종료로 프레이밍),
        #    keep-alive 를 쓰지 못해 연결이 매번 새로 열리고 업스트림이 청크 인코딩을
        #    쓸 수 없다. 스트리밍 구간에서는 1.1 이 맞다.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # ④ 타임아웃을 늘린다. SSE 연결은 몇 시간씩 열려 있는데 기본 read timeout 은 60초다.
        #    이벤트가 뜸한 시간대에 1분마다 끊기고 브라우저가 재연결을 반복하게 된다
        #    (프론트의 재연결 시도 상한은 5회다 — 그 뒤엔 알림이 아예 끊긴다).
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # ⑤ gzip 을 끈다. **측정상 이것이 실제 범인이었다** — 압축은 블록을 채워야 출력이
        #    나오므로 스트리밍과 근본적으로 상극이다. 대조 실험에서 gzip 을 text/event-stream
        #    에 적용하자 12초 동안 이벤트가 한 건도 도착하지 않았다.
        #
        #    이 server 블록 위쪽에 `gzip on` 이 있다는 점이 중요하다. 지금은 gzip_types 에
        #    text/event-stream 이 없어 SSE 에는 적용되지 않지만, 누군가 타입을 추가하거나
        #    `gzip_types *` 로 바꾸는 순간 알림이 통째로 멈춘다. 여기서 명시적으로 꺼
        #    그 사고를 구조적으로 막는다.
        gzip off;

        # ⑥ 업스트림이 보낸 프레이밍을 그대로 흘린다.
        chunked_transfer_encoding off;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept            $http_accept;
        proxy_set_header Authorization     $http_authorization;
    }

    # ── 일반 API 프록시 ───────────────────────────────────────────────────────
    # SSE 가 아닌 경로는 버퍼링을 켠 채 둔다 — 느린 클라이언트가 업스트림 워커를 붙잡는 것을
    # nginx 가 대신 흡수해 주므로, 여기서 끄면 오히려 백엔드가 손해다.
    location /api/ {
        proxy_pass ${GATEWAY_URL};
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
        proxy_read_timeout 60s;
    }

    # ── WebSocket (채팅 STOMP) ────────────────────────────────────────────────
    # SSE 와 요구사항이 겹치지만 하나가 다르다: Upgrade 핸드셰이크를 통과시켜야 한다.
    # SSE 쪽처럼 Connection 을 비우면 업그레이드가 실패한다.
    location /ws/ {
        proxy_pass ${GATEWAY_URL};
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ── 캐시 정책 ──────────────────────────────────────────────────────────
    #
    # ⚠️ 예전에는 캐시 헤더가 **하나도 없었다.** 그러면 브라우저가 Last-Modified 를 근거로
    #    *휴리스틱 캐싱*을 적용해, `index.html` 을 재검증 없이 디스크 캐시에서 꺼낸다.
    #    그 index.html 에 적힌 `main.<해시>.js` 도 옛 파일이므로, **배포를 해도 돌아온
    #    사용자는 계속 예전 번들을 돌린다.** 개발자도구에 `200 OK (from disk cache)` 로
    #    보이는데, 서버는 새 파일을 잘 서빙하고 있어서 어디가 잘못됐는지 알기 어렵다.
    #
    # CRA 빌드의 파일명에는 내용 해시가 들어간다. 그래서 정책이 둘로 갈린다:
    #   · 해시가 붙은 정적 자산 → 영원히 캐시해도 안전하다(내용이 바뀌면 이름이 바뀐다)
    #   · index.html → **절대 캐시하지 않는다.** 어느 해시를 가리킬지 정하는 유일한 파일이다.
    #
    # no-cache 는 "캐시하지 말라"가 아니라 "쓰기 전에 반드시 재검증하라"는 뜻이다.
    # ETag 가 같으면 304 로 끝나므로 비용은 헤더 한 번이다.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.iamport.kr https://cdn.portone.io https://www.paypal.com https://*.paypal.com https://*.paypalobjects.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.paypal.com https://*.portone.io https://*.iamport.kr; frame-src https://*.paypal.com https://*.portone.io https://*.iamport.kr; form-action 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    # React Router(client-side routing) 지원: 없는 경로는 index.html로 폴백
    location / {
        try_files $uri /index.html;
    }

    # `location = /index.html` 는 위 폴백보다 우선한다(정확 일치가 접두사 일치를 이긴다).
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.iamport.kr https://cdn.portone.io https://www.paypal.com https://*.paypal.com https://*.paypalobjects.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.paypal.com https://*.portone.io https://*.iamport.kr; frame-src https://*.paypal.com https://*.portone.io https://*.iamport.kr; form-action 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
