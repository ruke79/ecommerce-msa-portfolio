plugins	{
	// id 'java'
	// id 'org.springframework.boot' version '3.4.1'
	// id 'io.spring.dependency-management' version '1.1.7'	
}

// Lombok 설정 (Querydsl과 함께 사용 시 필수)
configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
	
	implementation 'org.springframework.boot:spring-boot-starter-batch'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	//implementation 'org.springframework.boot:spring-boot-starter-web'
	//implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'   // 버전은 Boot BOM 이 정한다(고정하면 Boot 를 올려도 따라가지 않는다)

	
	
	implementation 'org.springframework.cloud:spring-cloud-starter'
	implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'
	implementation 'org.springframework.cloud:spring-cloud-starter-config'
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
	
	implementation 'org.springframework.kafka:spring-kafka'
	// S3 만 쓴다 — 예전에는 SDK 전체(aws-java-sdk, 서비스 수백 개)를 넣었다
	implementation 'com.amazonaws:aws-java-sdk-s3:1.12.797'


	  // JPA와 Elasticsearch를 함께 사용하는 경우, 전이적 의존성으로 인한 충돌 방지
    implementation('org.springframework.boot:spring-boot-starter-data-elasticsearch') {
        // 반응형 Elasticsearch 의존성을 명시적으로 제외
        exclude group: 'org.springframework.data', module: 'spring-data-elasticsearch-reactive'
        // Reactive 프로그래밍에 사용되는 Reactor 라이브러리도 필요하지 않다면 제외할 수 있습니다.
        // exclude group: 'io.projectreactor', module: 'reactor-core'
    }
		

	implementation project(':common')
	testImplementation(testFixtures(project(':common')))

	// 재고 예약 gRPC 서버(docs/66). 계약 · 생성 스텁은 common 에 있고(compileOnly), 런타임은 쓰는 서비스가 얹는다.
	// grpc-netty-shaded — Netty 를 자기 안에 숨겨 가진다(Spring 의 Netty · Reactor 와 버전이 부딪히지 않게).
	implementation platform("io.grpc:grpc-bom:${grpcVersion}")
	implementation 'io.grpc:grpc-netty-shaded'
	implementation 'io.grpc:grpc-protobuf'
	implementation 'io.grpc:grpc-stub'
	implementation "com.google.protobuf:protobuf-java:${protobufVersion}"
	testImplementation 'io.grpc:grpc-inprocess'


	runtimeOnly 'org.postgresql:postgresql'
	// 스키마 마이그레이션: 파티셔닝 등 Hibernate ddl-auto가 만들 수 없는 DDL은 Flyway가 소유한다 (docs/09 P0)
	implementation 'org.flywaydb:flyway-core'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	// OpenAPI 문서: /v3/api-docs, /swagger-ui.html
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'	
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	//runtimeOnly 'com.mysql:mysql-connector-j'

	// QueryDSL start	
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    implementation 'com.querydsl:querydsl-core:5.0.0'
    
    // Q-클래스 생성을 위한 annotationProcessor 의존성
    annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
    
    // JPA 엔티티를 인식시키기 위한 의존성
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
	// QueryDSL end

	testImplementation 'org.springframework.kafka:spring-kafka-test'

}

tasks.named('test') {
	useJUnitPlatform()
}

// Q-클래스 생성 경로 설정
def generated = 'src/main/generated'

// 빌드 시 Q-클래스 디렉토리 삭제
clean {
    delete file(generated)
}

// Q-클래스 생성 디렉토리 지정
tasks.withType(JavaCompile) {
    options.annotationProcessorGeneratedSourcesDirectory = file(generated)
}

// 생성된 Q-클래스 경로를 소스 경로에 추가
sourceSets {
    main.java.srcDirs += [ generated ]
}