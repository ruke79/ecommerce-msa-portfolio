// saga-projection — 주문 결제 사가의 읽기 모델을 Kafka Streams 로 만든다(docs/38 §1.17).
//
// DB 가 없다. 상태는 Streams 의 로컬 저장소(RocksDB) + 변경 로그 토픽이고, 그래서 이 모듈만이
// 이 저장소에서 유일하게 exactly-once(processing.guarantee=exactly_once_v2)를 실제로 누린다 —
// 입력 오프셋·상태 변경 로그·출력이 한 Kafka 트랜잭션이다. DB 를 쓰는 15개 리스너는 그럴 수 없다.
// [JA] saga-projection — 注文決済サガの読み取りモデルを Kafka Streams で作る(docs/38 §1.17)。
//      DB がない。状態は Streams のローカルストア(RocksDB) + 変更ログトピックで、だからこのモジュールだけが
//      このリポジトリで唯一 exactly-once(processing.guarantee=exactly_once_v2)を実際に享受する —
//      入力オフセット・状態変更ログ・出力が一つの Kafka トランザクションである。DB を使う 15 個のリスナーはそうはいかない。

dependencies {

	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.cloud:spring-cloud-starter'
	implementation 'org.springframework.cloud:spring-cloud-starter-bootstrap'
	implementation 'org.springframework.cloud:spring-cloud-starter-config'
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
	implementation 'org.springframework.kafka:spring-kafka'
	// 버전은 Spring Boot BOM 이 kafka-clients 와 맞춰 관리한다(3.8.x).
	// [JA] バージョンは Spring Boot BOM が kafka-clients と合わせて管理する(3.8.x)。
	implementation 'org.apache.kafka:kafka-streams'

	implementation project(':common')

	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

	// 브로커 없이 토폴로지를 돌린다 — 입력 레코드를 밀어 넣고 상태 저장소·출력 토픽을 본다.
	// [JA] ブローカーなしでトポロジーを回す — 入力レコードを押し込み、状態ストア・出力トピックを見る。
	testImplementation 'org.apache.kafka:kafka-streams-test-utils'
}
