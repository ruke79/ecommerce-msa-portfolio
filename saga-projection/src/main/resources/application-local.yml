server:
  port: 8190

  ssl:
      key-store: ${LOCAL_KEY_STORE_PATH}
      key-store-type: PKCS12
      key-store-password: ${LOCAL_KEY_STORE_PASSWORD}
      key-password: ${LOCAL_KEY_PASSWORD}

# Kafka 접속 설정은 common/application-common.yml 이 소유한다(docs/18).

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    non-secure-port-enabled : false
    secure-port-enabled : true
    secure-port : 8190

spring:
  application:
    name: saga-projection

  config:
      import: "classpath:application-common.yml, optional:classpath:kafka-secrets.properties"

# 이 서비스에는 datasource 가 없다 — 상태는 Kafka Streams 의 로컬 저장소와 변경 로그 토픽이다.
# 그래서 B-32(커넥션 풀 총합)·B-33(베이스라인 마이그레이션) 가드레일의 대상이 아니다.

saga-projection:
  # Kafka Streams application.id = 소비자 그룹 id = 내부 토픽 접두사. 바꾸면 새 앱으로 취급되어
  # 입력을 처음부터 다시 접는다(그게 원하는 것일 때가 있다 — 프로젝션 재구축).
  application-id: ${SAGA_APPLICATION_ID:saga-projection}
  # 이 인스턴스가 대화형 조회(interactive query)에서 자기를 식별하는 host:port. 파드마다 달라야
  # 하므로 k8s 는 POD_IP 를 넣는다. 같은 값을 두 파드가 쓰면 "내가 활성 호스트" 판단이 틀려
  # 남의 키를 빈 값으로 답한다.
  application-server: ${SAGA_APPLICATION_SERVER:localhost:8190}
  # RocksDB 상태 디렉터리. 파드 재시작 사이에 남아 있으면 변경 로그 재생을 건너뛴다(빠른 기동).
  # 없어도 된다 — 변경 로그에서 복구한다.
  state-dir: ${SAGA_STATE_DIR:./state}
  # 대기(standby) 복제본 수. 레플리카 ≤ standby+1 이면 모든 파드가 모든 키를 로컬에서 답할 수 있다.
  standby-replicas: ${SAGA_STANDBY_REPLICAS:1}
  topics:
    order: order
    payment: payment
    state: order-saga-state
    # 주문 상태 변경(order-service 아웃박스 → 릴레이) → 주문 진행 타임라인(docs/76). 출력은 컴팩션이어야 한다 — ops/02 가 만든다(B-38).
    order-status: order-status
    timeline: order-timeline

management:
  endpoint:
    health:
      group:
        # Streams 가 RUNNING 이 아니면 트래픽을 받지 않는다 — 조회 API 가 503 만 낼 상태다.
        readiness:
          include: readinessState, kafkaStreams

logging:
  level:
    root: info
    com.project.saga_projection: ${LOG_LEVEL_APP:info}
    # 리밸런스·상태 전이는 info 로 충분하다. Streams 내부의 debug 는 한 줄이 아니라 초당 수백 줄이다.
    org.apache.kafka.streams: info
  file:
    path: ./logs
    name: ${logging.file.path}/saga_projection.json   # JSON 한 줄씩 — common 의 logback-spring.xml 이 쓴다(docs/51)
  # 출력 패턴은 common 의 logback-spring.xml 이 정한다 — 메시지·예외를 %mask 로 감싸 민감정보를 가린다.
  # 여기 logging.pattern 을 두어도 쓰이지 않는다(가드 B-57).
