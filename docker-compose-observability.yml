# 관측성 스택: Prometheus(메트릭 수집) + Grafana(대시보드) + OpenTelemetry Collector · Jaeger(분산 추적)
#             + Loki(로그 저장) + Alloy(로그 수집) — docs/51 §4, docs/63
#
# 배경(docs/03, docs/10): 서비스들은 /actuator/prometheus 와 traceId 를 노출만 하고 있었고
# 수집기가 없어 장애 탐지 수단 자체가 없었다. 이 스택이 그 공백을 메운다.
#
# 실행:   docker compose -f docker-compose-observability.yml up -d
# 접속:   Prometheus http://localhost:9090 · Grafana http://localhost:3001 (admin / admin)
#         Jaeger http://localhost:16686 · Loki http://localhost:3100 · Alloy http://localhost:12345
#         (Jaeger 는 루프백에만 연다 — 서버에서는 ssh -L 16686:localhost:16686 으로 본다)
#
# 서비스 쪽 설정은 이미 되어 있음:
#  - 메트릭: application-common.yml 의 actuator 노출
#  - 추적:   Micrometer Tracing(OpenTelemetry 브리지) + OTLP/HTTP →  otel-collector:4318 → Jaeger · span_metrics
#            (OTEL_EXPORTER_OTLP_TRACES_ENDPOINT, 기본 http://localhost:4318/v1/traces). OpenTelemetry 데모의 구성이다.
#  - 로그:   common 의 logback-spring.xml 이 <모듈>/logs/*.json 에 JSON 한 줄씩(마스킹 뒤) 쓴다.
#            서비스를 모듈 디렉터리에서 띄우면(./gradlew :order-service:bootRun) 그 파일을 Alloy 가 읽는다.
#            Grafana → Explore → Loki 에서 {service="order-service"} 로 찾고, 줄의 traceId 를 누르면
#            Jaeger 의 그 요청으로, Jaeger 의 스팬에서 "Logs for this span" 을 누르면 그 요청의 로그로 간다.
#            지연 그래프의 점(exemplar)을 누르면 그 지연을 만든 추적으로 간다.
#
# k8s 환경에서는 이 compose 대신 kube-prometheus-stack(Helm) + OTel Collector(Helm) 사용을 권장 (k8s/README).
# [JA] 観測スタック: Prometheus(メトリクス収集) + Grafana(ダッシュボード) + OpenTelemetry Collector・Jaeger(分散トレース) + Loki(ログ保存) + Alloy(ログ収集) — docs/51 §4、docs/63
#      背景(docs/03、docs/10): サービスは /actuator/prometheus と traceId を公開しているだけで、収集器がなく障害検知の手段そのものがなかった。このスタックがその空白を埋める。
#      実行・接続先は上の韓国語の通り(Jaeger はループバックにだけ開く — サーバーでは ssh -L 16686:localhost:16686 で見る)。
#      サービス側の設定は済んでいる: メトリクスは application-common.yml の actuator 公開、トレースは Micrometer Tracing(OpenTelemetry ブリッジ) + OTLP/HTTP → otel-collector:4318 → Jaeger・span_metrics
#      (OTEL_EXPORTER_OTLP_TRACES_ENDPOINT、既定 http://localhost:4318/v1/traces。OpenTelemetry デモの構成)、
#      ログは common の logback-spring.xml が <モジュール>/logs/*.json に JSON 一行ずつ(マスキング後)書く。サービスをモジュールディレクトリから起動すると(./gradlew :order-service:bootRun)そのファイルを Alloy が読む。
#      Grafana → Explore → Loki で {service="order-service"} で探し、行の traceId を押すと Jaeger のそのリクエストへ、Jaeger のスパンで "Logs for this span" を押すとそのリクエストのログへ行く。
#      遅延グラフの点(exemplar)を押すとその遅延を生んだトレースへ行く。
#      k8s 環境ではこの compose の代わりに kube-prometheus-stack(Helm) + OTel Collector(Helm) の使用を推奨(k8s/README)。
services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      # 지표의 점 → 그 추적(exemplar). Spring 의 http_server_requests 와 span_metrics 가 trace_id 를 싣는다.
      # [JA] 指標の点 → そのトレース(exemplar)。Spring の http_server_requests と span_metrics が trace_id を載せる。
      - --enable-feature=exemplar-storage
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 리눅스에서 호스트의 서비스 스크레이프용 ／ [JA] Linux でホストのサービスをスクレイプするため
    mem_limit: 512m

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      # 로컬 편의로 기본값 admin(포트는 127.0.0.1 에만 연다). 🔒 운영은 docker-compose-observability.oci.yml 이 observability/secrets/
      # 의 파일(GF_SECURITY_ADMIN_PASSWORD__FILE)로 덮는다 — 그 파일이 없으면 뜨지 않는다. [JA] ローカルは既定 admin。本番は oci が
      # observability/secrets/ のファイルで上書きする。
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      # 🔒 운영자만 본다(ssh -L) — 공개 포트가 아니다. 다른 컨테이너는 compose 망의 grafana 로 닿는다(공개 포트를 쓰지 않는다).
      #    예전에는 0.0.0.0 이라 VCN 방화벽(22번만) 한 겹에만 기댔다 — Jaeger · Collector 헬스처럼 루프백에 묶는다(보안 점검 2026-11-21).
      # [JA] 運用者だけ(ssh -L)。公開ポートではない。他コンテナは compose 網で届く — Jaeger と同じくループバックに。
      - "127.0.0.1:3001:3000"    # 프론트엔드(3000)와 충돌 방지 ／ [JA] フロントエンド(3000)との衝突防止
    depends_on:
      - prometheus
    mem_limit: 512m

  alertmanager:
    # 0.28 이상 — discord_configs 의 webhook_url_file(비밀을 파일로)이 0.28 에서 생겼다(observability/alertmanager.yml).
    # [JA] 0.28 以上 — discord_configs の webhook_url_file(秘密をファイルで)は 0.28 で入った(observability/alertmanager.yml)。
    image: prom/alertmanager:v0.28.1
    container_name: alertmanager
    restart: unless-stopped
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # 웹훅 URL 은 설정이 아니라 **비밀**이다(URL 을 아는 사람은 누구나 그 채널에 쓸 수 있다).
      # 그래서 커밋되지 않는 파일로 마운트한다. 만드는 법: sudo ./ops/17-configure-alert-receivers.sh
      # ⚠️ 파일이 없어도 Alertmanager 는 **뜬다** — 알림을 보낼 때마다 실패할 뿐이다. 디렉터리가 없으면 Docker 가 빈 디렉터리를
      #    root 소유로 만든다. 🐛 운영이 2026-09-24 부터 10-20 까지 그 상태였다(경보 전달 0건, 재기동 뒤 153/153 실패).
      #    ./ops/05 가 파일과 전달 실패를 점검한다.
      # [JA] Webhook URL は設定ではなく**秘密**である(URL を知る人は誰でもそのチャンネルに書ける)。
      #      そのためコミットされないファイルとしてマウントする。作り方: sudo ./ops/17-configure-alert-receivers.sh
      #      ⚠️ ファイルがなくても Alertmanager は**起動する** — 通知を送るたびに失敗するだけである。ディレクトリがなければ Docker が空のディレクトリを
      #      root 所有で作る。🐛 運用が 2026-09-24 から 10-20 までその状態だった(警報の配信 0 件、再起動後 153/153 失敗)。
      #      ./ops/05 がファイルと配信失敗を点検する。
      - ./observability/secrets:/etc/alertmanager/secrets:ro
    ports:
      - "127.0.0.1:9093:9093"   # 🔒 운영자만(ssh -L) · Prometheus · Loki 는 compose 망(alertmanager:9093)으로 보낸다 ／ [JA] 運用者だけ(ssh -L)
    mem_limit: 256m

  # ── 추적 (docs/63) — OpenTelemetry 데모의 구성: 서비스 → Collector → Jaeger / span_metrics → Prometheus ──
  # [JA] ── トレース(docs/63) — OpenTelemetry デモの構成: サービス → Collector → Jaeger / span_metrics → Prometheus ──
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    ports:
      # k3s 파드가 노드 IP 로 보낸다(OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://$(HOST_IP):4318/v1/traces).
      # 그래서 127.0.0.1 이 아니라 모든 인터페이스에 연다. 🔒 OCI 보안 목록에서는 4318 을 **열지 않는다** —
      # 파드 → 노드는 노드 안의 통신이다(docs/51 §4d). 4317(gRPC)·8889(span_metrics)·8888(자기 지표)는
      # 도커 망 안에서만 쓰므로 호스트로 내지 않는다.
      # [JA] k3s のポッドがノード IP に送る(OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://$(HOST_IP):4318/v1/traces)。
      #      そのため 127.0.0.1 ではなくすべてのインターフェースで開く。🔒 OCI のセキュリティリストでは 4318 を**開けない** —
      #      ポッド → ノードはノード内の通信である(docs/51 §4d)。4317(gRPC)・8889(span_metrics)・8888(自身の指標)は
      #      Docker ネットワーク内でだけ使うのでホストに出さない。
      - "4318:4318"
      - "127.0.0.1:13133:13133"   # 헬스 체크(ops/05) ／ [JA] ヘルスチェック(ops/05)
    depends_on:
      - jaeger
    mem_limit: 256m               # processors.memory_limiter(200MiB)가 이 아래에서 받기를 멈춘다 ／ [JA] processors.memory_limiter(200MiB)がこの下で受信を止める

  # 새 볼륨은 root 소유로 생긴다. Jaeger 이미지는 uid 10001 로 돌아 쓰지 못하므로 한 번 소유자를 맞추고 끝난다.
  # [JA] 新しいボリュームは root 所有で作られる。Jaeger イメージは uid 10001 で動き書き込めないので、一度所有者を合わせて終わる。
  jaeger-data-init:
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /badger/keys /badger/values && chown -R 10001:10001 /badger"]
    volumes:
      - jaeger-data:/badger
    restart: "no"

  jaeger:
    # 2.20 에 고정한다 — 2.21 이 "UI 가 더는 부르지 않는 v1 HTTP API"(/api/services · /api/traces?service=)를
    # 지웠는데, Grafana 의 Jaeger 데이터소스가 검색에 그것을 쓴다(ID 조회만 남아 로그 → 추적은 되고 검색이 404).
    # 올리기 전에 Grafana 에서 Explore → Jaeger → Search 가 되는지 본다(docs/63 §6).
    # [JA] 2.20 に固定する — 2.21 が「UI がもう呼ばない v1 HTTP API」(/api/services ・ /api/traces?service=)を
    #      削除したが、Grafana の Jaeger データソースが検索にそれを使う(ID 照会だけが残り、ログ → トレースはできるが検索が 404)。
    #      上げる前に Grafana で Explore → Jaeger → Search ができるか確認する(docs/63 §6)。
    image: jaegertracing/jaeger:2.20.0
    container_name: jaeger
    restart: unless-stopped
    command: ["--config=file:/etc/jaeger/config.yml"]
    environment:
      - JAEGER_TRACE_TTL=168h     # 추적 보관 기간(badger 가 지난 것을 스스로 지운다) ／ [JA] トレースの保管期間(badger が過ぎたものを自ら消す)
    volumes:
      - ./observability/jaeger.yml:/etc/jaeger/config.yml:ro
      # 추적 저장(badger) — 재시작 · 재배포를 넘긴다. 이미지는 uid 10001 로 돈다 — 아래 jaeger-data-init 이 권한을 맞춘다.
      # [JA] トレース保存(badger) — 再起動・再デプロイをまたぐ。イメージは uid 10001 で動く — 下の jaeger-data-init が権限を合わせる。
      - jaeger-data:/badger
    depends_on:
      jaeger-data-init:
        condition: service_completed_successfully
    ports:
      # UI 는 루프백에만 — 서버에서는 ssh -L 16686:localhost:16686 으로 본다. Grafana 는 도커 망으로 붙는다.
      # [JA] UI はループバックだけ — サーバーでは ssh -L 16686:localhost:16686 で見る。Grafana は Docker ネットワークで接続する。
      - "127.0.0.1:16686:16686"
    mem_limit: 512m

  # ── 로그 (docs/51 §4) ───────────────────────────────────────────────────
  # [JA] ── ログ(docs/51 §4) ──
  loki:
    image: grafana/loki:3.4.2
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./observability/loki-config.yml:/etc/loki/config.yml:ro
      # 로그 경보 규칙(docs/51 §4i). 테넌트 "fake"(auth_enabled:false) 아래에 있어야 ruler 가 읽는다.
      # [JA] ログの警報ルール(docs/51 §4i)。テナント "fake"(auth_enabled:false)の下にないと ruler が読まない。
      - ./observability/loki-rules:/etc/loki/rules/fake:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"   # 🔒 운영자만(ssh -L) · Alloy · Grafana 는 compose 망(loki:3100)으로 닿는다 ／ [JA] 運用者だけ(ssh -L)
    mem_limit: 512m

  # Promtail 이 아니라 Alloy 다 — Grafana 가 Promtail 을 지원 종료하고 Alloy 를 후속으로 내놓았다.
  # [JA] Promtail ではなく Alloy である — Grafana が Promtail のサポートを終了し、Alloy を後継として出した。
  alloy:
    image: grafana/alloy:v1.9.1
    container_name: alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy-config.alloy:/etc/alloy/config.alloy:ro
      # 🔒 저장소 전체가 아니라 모듈마다 logs 디렉터리만 읽기 전용으로 붙인다. 저장소 루트를 통째로
      #    붙이면 gitignore 된 비밀 파일(k8s/20-secret.yaml, kafka-secrets.properties)까지 컨테이너에
      #    보인다. 서비스를 더하면 여기에도 한 줄 더한다.
      # [JA] 🔒 リポジトリ全体ではなくモジュールごとの logs ディレクトリだけを読み取り専用で付ける。リポジトリのルートを丸ごと
      #      付けると gitignore された秘密ファイル(k8s/20-secret.yaml、kafka-secrets.properties)までコンテナから
      #      見える。サービスを足したらここにも一行足す。
      - ./cart-service/logs:/var/log/ecommerce/cart-service/logs:ro
      - ./catalog-service/logs:/var/log/ecommerce/catalog-service/logs:ro
      - ./chat-service/logs:/var/log/ecommerce/chat-service/logs:ro
      - ./coupon-service/logs:/var/log/ecommerce/coupon-service/logs:ro
      - ./delivery-service/logs:/var/log/ecommerce/delivery-service/logs:ro
      - ./eureka-server/logs:/var/log/ecommerce/eureka-server/logs:ro
      - ./gateway-server/logs:/var/log/ecommerce/gateway-server/logs:ro
      - ./notification-service/logs:/var/log/ecommerce/notification-service/logs:ro
      - ./order-service/logs:/var/log/ecommerce/order-service/logs:ro
      - ./pay-service/logs:/var/log/ecommerce/pay-service/logs:ro
      - ./saga-projection/logs:/var/log/ecommerce/saga-projection/logs:ro
      - ./user-service/logs:/var/log/ecommerce/user-service/logs:ro
      # k3s 파드의 표준 출력 로그(docs/51 §4c). 같은 호스트에서 k3s 가 돌 때 ecommerce 네임스페이스의
      # 파드 로그를 읽는다. k3s 가 없는 PC 에서는 빈 디렉터리일 뿐이다. 다른 위치면 K3S_POD_LOG_DIR 로 바꾼다.
      # [JA] k3s ポッドの標準出力ログ(docs/51 §4c)。同じホストで k3s が動くとき ecommerce ネームスペースの
      #      ポッドログを読む。k3s のない PC では空のディレクトリにすぎない。別の場所なら K3S_POD_LOG_DIR で変える。
      - ${K3S_POD_LOG_DIR:-/var/log/pods}:/var/log/pods:ro
      - alloy-data:/var/lib/alloy/data
    # 파드 로그 파일은 root 소유(0640)라 root 로 읽는다. 마운트는 전부 읽기 전용이다.
    # [JA] ポッドのログファイルは root 所有(0640)なので root で読む。マウントはすべて読み取り専用である。
    user: "0:0"
    ports:
      - "127.0.0.1:12345:12345"   # 🔒 운영자만(ssh -L) · Prometheus 는 compose 망(alloy:12345)으로 긁는다(이 컨테이너는 root 로 돈다) ／ [JA] 運用者だけ(ssh -L)
    depends_on:
      - loki
    mem_limit: 256m

volumes:
  jaeger-data:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
