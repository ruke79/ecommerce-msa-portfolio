version: '3.8'

# 공통 앵커: 모든 컨테이너에 적용할 재시작 정책.
x-restart-policy: &restart-policy
  restart: unless-stopped

services:
  eureka-server:
    image: ${EUREKA_SERVER_IMAGE_NAME}:${EUREKA_SERVER_IMAGE_VERSION}
    container_name: eureka-server
    hostname: eureka-server-host
    <<: *restart-policy
    build:
      context: ./eureka-server   # (수정) 기존 ./discovery-service 오타 → 실제 디렉터리 eureka-server
      dockerfile: Dockerfile     # (수정) 잘못된 키 'Dockerfile:' → 표준 키 'dockerfile:'
    ports:
      - "8761:8761"
    volumes:
      - /home/ubuntu/resources/:/app/resources/
      - /var/log/eureka-server:/var/log/eureka-server
    environment:
      - SERVER_PORT=8761
      - SPRING_APPLICATION_NAME=discovery-service
      - SERVER_SSL_KEY_STORE_PASSWORD=
      - SERVER_SSL_KEY_PASSWORD=
      - SERVER_SSL_KEY_STORE_ALIAS=
      - LOGGING_LEVEL_ROOT=INFO
      - EUREKA_CLIENT_TLS_ENABLED=true
    # eclipse-temurin(jammy)에는 curl/wget이 없으므로 bash /dev/tcp 로 포트 수신 여부만 확인한다.
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8761' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 768m
    cpus: 1.0
    networks:
      - msa-core-network

  gateway-server:
    image: ${GATEWAY_SERVER_IMAGE_NAME}:${GATEWAY_SERVER_IMAGE_VERSION}
    container_name: gateway-server
    hostname: gateway-server-host
    <<: *restart-policy
    build:
      context: ./gateway-server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - /home/ubuntu/resources/:/app/resources/
      - /var/log/gateway-server:/var/log/gateway-server
    environment:
      - SERVER_PORT=8000
      - SPRING_APPLICATION_NAME=gateway-server
      - SPRING_CONFIG_IMPORT=optional:configserver:https://  :8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=https://  :8761/eureka
      - SERVER_SSL_KEY_STORE_PASSWORD=
      - SERVER_SSL_KEY_PASSWORD=
      - SERVER_SSL_KEY_STORE_ALIAS=
      - SPRING_APP_JWTSECRET=
      - LOGGING_LEVEL_ROOT=INFO
      # RequestRateLimiter 토큰 버킷 저장소(Redis). 게이트웨이 레이트리미터가 사용한다.
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8000' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 768m
    cpus: 1.0
    depends_on:
      eureka-server:
        condition: service_healthy   # 컨테이너 "시작"이 아니라 "준비 완료"까지 대기
    networks:
      - msa-core-network

networks:
  msa-core-network:
    driver: bridge
