plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
	
}


allprojects {
	group = 'com.project'
	version = '0.0.1-SNAPSHOT'
}

	repositories {
		mavenCentral()
        maven { url 'https://repo.spring.io/snapshot' }
	}


subprojects {
	apply plugin: 'java'
	apply plugin: 'org.springframework.boot'
	apply plugin: 'io.spring.dependency-management'

	// ── 재현 가능한 아카이브 ──────────────────────────────────────────────
	//
	// Gradle 의 기본값은 파일 타임스탬프를 아카이브에 **그대로 박는다.** 그래서 소스가
	// 전혀 바뀌지 않아도 빌드할 때마다 jar 바이트가 달라진다(실측: 같은 커밋을 두 번
	// 빌드하니 sha256 이 달랐다).
	//
	// 그 대가는 배포에서 나온다. jar 가 다르면 도커 레이어가 다르고, 레지스트리에 올릴
	// 때 **안 바뀐 서비스 13개까지 매번 다시 전송된다.** 서비스당 수십 MB × 14 다.
	// 재현 가능하게 두면 안 바뀐 서비스는 다이제스트가 같아 푸시가 사실상 no-op 이 된다.
	//
	// 부수 효과도 좋다 — 같은 커밋이 같은 바이너리를 만든다는 것은 "지금 배포된 게
	// 정확히 무엇인가"를 태그가 아니라 **내용으로** 확인할 수 있다는 뜻이다.
	tasks.withType(AbstractArchiveTask).configureEach {
		preserveFileTimestamps = false
		reproducibleFileOrder = true
	}

 	sourceCompatibility = '17'


    configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
    }
	repositories {
		mavenCentral()
        maven { url 'https://repo.spring.io/snapshot' }
	}

    ext {
        set('springCloudVersion', "2025.0.3")
        // gRPC 시범(docs/66) — common 이 계약(.proto)과 부품을 갖고, catalog · order 가 런타임을 얹는다.
        // protobuf 는 grpc-protobuf 가 요구하는 버전과 맞춘다(grpc 1.84 → protobuf-java 3.25.x).
        set('grpcVersion', '1.84.0')
        set('protobufVersion', '3.25.9')
    }

	dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-web'
		implementation 'org.springframework.boot:spring-boot-starter-validation'
		
		implementation 'org.springframework.boot:spring-boot-starter-aop'

		
		implementation group: 'io.hypersistence', name: 'hypersistence-utils-hibernate-63', version: '3.8.2'
        implementation group: 'com.google.guava', name: 'guava', version: '33.2.0-jre'
        implementation group: 'com.google.code.gson', name: 'gson', version: '2.11.0'
		
		// lombok
		compileOnly 'org.projectlombok:lombok'
		annotationProcessor 'org.projectlombok:lombok'

        // spring
		testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

		// Testcontainers — 실제 인프라(PostgreSQL/Redis/Kafka/Mongo/ES)를 띄워 통합 테스트를 돌린다.
		// docs/14·16 의 기동 불가 버그들은 전부 "실제로 띄워야만" 드러났다. 그 검증을 손이 아니라
		// 빌드가 하도록 옮기는 것이 목적이다. 버전은 Spring Boot BOM 이 관리한다.
		testImplementation 'org.springframework.boot:spring-boot-testcontainers'
		testImplementation 'org.testcontainers:junit-jupiter'
		testImplementation 'org.testcontainers:postgresql'
		testImplementation 'org.testcontainers:kafka'
		testImplementation 'org.testcontainers:mongodb'
		testImplementation 'org.testcontainers:elasticsearch'
		// 비동기(Kafka 소비) 결과를 기다리는 데 필요하다. sleep 대신 조건 대기.
		testImplementation 'org.awaitility:awaitility'
		// ContainerTestUtils.waitForAssignment — 컨슈머가 파티션을 배정받기 전에 발행하면
		// 메시지를 놓칠 수 있어(auto.offset.reset 에 따라) 테스트가 불안정해진다.
		testImplementation 'org.springframework.kafka:spring-kafka-test'

		 // Logstash Logback Encoder 의존성 추가
    	implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

		// 분산 추적 — OpenTelemetry(docs/63). traceId/spanId 생성·전파는 Micrometer Tracing 의 OTel 브리지가,
		// 내보내기는 OTLP(HTTP)가 한다 → OTel Collector → Jaeger · spanmetrics(Prometheus).
		// 코드는 벤더 중립 API(io.micrometer.tracing.*)만 쓰므로 브리지만 바꿨다(예전: Brave + Zipkin 리포터).
		// 버전은 Spring Boot BOM 이 관리한다. 수집기 주소는 application-common.yml 의 management.otlp.tracing.endpoint.
		implementation 'io.micrometer:micrometer-tracing-bridge-otel'
		implementation 'io.opentelemetry:opentelemetry-exporter-otlp'

    }
		
	

    dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
		// Spring Boot 3.4.1 이 고정하는 Testcontainers 1.20.4 는 docker-java 클라이언트가
		// API 1.32 로 붙어, 최신 Docker Engine(29.x, 최소 1.40 요구)에서
		//   "client version 1.32 is too old"
		// 로 컨테이너를 아예 띄우지 못한다. 최신 Testcontainers 로 올려 이를 회피한다.
		mavenBom "org.testcontainers:testcontainers-bom:1.21.4"
	}
}

	// ⚠️ ConfigurationGuardrailTest 는 **모듈 밖**(각 서비스의 yml, k8s/, observability/)을 읽는다.
// Gradle 은 그 파일들을 test 태스크의 입력으로 모르기 때문에, 소스가 안 바뀌면 태스크를
// UP-TO-DATE 로 건너뛴다 — 즉 매니페스트를 깨뜨려도 **가드레일이 아예 실행되지 않는다**.
// (k3s 검증 중 실측: 시크릿에서 AMAZON_ACCESS_KEY 를 지웠는데 빌드가 초록불이었다.)
// 그 파일들을 명시적 입력으로 선언해, 바뀌면 다시 돌게 한다.
tasks.matching { it.name == 'test' && it.project.name == 'common' }.configureEach {
    inputs.files(
        fileTree(rootDir) {
            include '*/src/main/resources/application-*.yml'
            include 'k8s/*.yaml'
            include 'common/src/main/resources/es/*.json'
            include '*/src/main/java/**/Kafka*Config.java'
            include '*/src/main/resources/db/migration/*.sql'
            include 'ops/19-build-images.sh'
            // B-75 — 배포 워크플로
            include '.github/workflows/*.yml'
            // EnableBackupCronJobsTest(docs/22 §2) — 백업 CronJob 적용 + 켜기
            include 'ops/29-enable-pitr-in-cluster.sh'
            // CheckMtlsScriptTest(docs/57 §16) — mTLS 점검(신원 헤더)
            include 'ops/37-check-mtls.sh'
            // DltTopicsScriptTest(docs/29 §5.3) — 비밀이 흐르는 토픽의 보존
            include 'ops/02-create-dlt-topics.sh'
            // B-39 · B-56 — 오버레이와 배포 스크립트
            include 'k8s-overlays/**/*.yaml'
            include 'ops/28-deploy.sh'
            include 'ops/07-issue-certificates.sh'
            include 'ops/45-multinode.sh'
            // ReadmeTestCountTest — README 의 테스트 수 두 표기
            include 'README.md'
            include 'README.ko.md'
            include 'order-service/src/main/resources/application-local.yml'
        }
    ).withPropertyName('guardrailInputs').withPathSensitivity(PathSensitivity.RELATIVE)
}

// DemoUserGeneratorIntegrationTest(docs/79)는 모듈 밖의 ops/tools/generate-demo-users.py 를 돌린다 — 입력으로 선언하지
// 않으면 생성기를 고쳐도 테스트가 UP-TO-DATE 로 건너뛰어진다(실측: 변이 확인이 모두 "통과"했다).
// [JA] モジュール外の生成器を実行するので入力として宣言する。
tasks.matching { it.name == 'test' && it.project.name == 'user-service' }.configureEach {
    inputs.file(file("${rootDir}/ops/tools/generate-demo-users.py"))
        .withPropertyName('demoUserGenerator').withPathSensitivity(PathSensitivity.RELATIVE)
}

tasks.named('test') {
		// Docker 가 없는 환경에서도 단위 테스트는 돌아야 하므로 통합 테스트는 'containers' 태그로
		// 분리한다. 기본 실행에서는 제외되고, `-PwithContainers` 를 줄 때만 포함된다.
		//   ./gradlew test                    → 단위 테스트만 (Docker 불필요)
		//   ./gradlew test -PwithContainers   → Testcontainers 통합 테스트까지
		useJUnitPlatform {
			if (!project.hasProperty('withContainers')) {
				excludeTags 'containers'
			}
		}

		// 스키마 베이스라인 재생성용(docs/20 §3). `-PexportSchema` 를 주면 Hibernate 가
		// 컨텍스트를 띄우면서 자기가 만들 DDL 을 build/schema/<서비스>.sql 로 뱉는다.
		// 그 산출물을 ops/tools/hbm2flyway.py 가 멱등 마이그레이션으로 바꾼다.
		// 엔티티를 바꾼 뒤 베이스라인을 다시 뜰 때만 쓰는 개발용 스위치 — CI 는 쓰지 않는다.
		if (project.hasProperty('exportSchema')) {
			def target = file("${rootDir}/build/schema/${project.name}.sql")
			target.parentFile.mkdirs()
			systemProperty 'spring.jpa.hibernate.ddl-auto', 'none'
			systemProperty 'spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action', 'create'
			systemProperty 'spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target', target.absolutePath
			// 스키마(네임스페이스) 생성문까지 포함시킨다 — 빈 DB 에서는 이게 없으면
			// 'schema "product" does not exist' 로 첫 CREATE TABLE 부터 실패한다.
			systemProperty 'spring.jpa.properties.hibernate.hbm2ddl.create_namespaces', 'true'
		}

		// Testcontainers 가 이미지를 받을 곳. 기본은 Docker Hub 이지만 레지스트리가 막힌 환경이
		// 있어(이 저장소를 검증한 환경이 그랬다) 미러를 주입할 수 있게 해 둔다.
		//   TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX=mirror.gcr.io/
		// 값이 없으면 아무 것도 하지 않으므로 일반 환경에서는 평소대로 Docker Hub 를 쓴다.
		def hubPrefix = System.getenv('TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX')
		if (hubPrefix) {
			environment 'TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX', hubPrefix
		}
		// Gradle 데몬이 상속하지 않는 경우가 있어 Docker 접속 정보도 명시적으로 넘긴다.
		['DOCKER_HOST', 'DOCKER_API_VERSION', 'TESTCONTAINERS_RYUK_DISABLED', 'TESTCONTAINERS_CHECKS_DISABLE', 'E2E_JRE_IMAGE'].each { key ->
			def value = System.getenv(key)
			if (value) {
				environment key, value
			}
		}
	}
}

bootJar.enabled = false


