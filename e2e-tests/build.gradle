plugins {
	id 'java'
}

// 이 모듈은 애플리케이션이 아니다 — 테스트만 있다.
bootJar { enabled = false }
jar { enabled = false }

dependencies {
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	testImplementation 'org.testcontainers:kafka'
	testImplementation 'org.awaitility:awaitility'
	testImplementation 'org.postgresql:postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 서비스 jar 가 있어야 컨테이너 이미지를 만들 수 있다.
//
// 단, E2E_IMAGE_PREFIX 가 지정되면 이야기가 다르다 — 그때는 **레지스트리에 이미 올라간
// 릴리스 후보 이미지**를 받아서 띄우므로 jar 가 필요 없다. 여기서 bootJar 를 강제하면
// 파이프라인의 인수 스테이지가 "이미 만든 바이너리"를 검증하러 와서 바이너리를 한 번 더
// 만드는 꼴이 된다. 그게 바로 피하려는 것이다.
tasks.named('test') {
	if (!System.getenv('E2E_IMAGE_PREFIX')) {
		dependsOn ':order-service:bootJar', ':pay-service:bootJar', ':catalog-service:bootJar'
	}
}
