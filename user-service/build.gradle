


dependencies {
	
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	//implementation 'org.springframework.boot:spring-boot-starter-web'
	//implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// spring-boot-starter-mail 을 뺐다. user-service 는 더 이상 SMTP 를 직접 호출하지 않고
	// outgoing-mail 토픽에 요청만 넣는다 — 발송은 notification-service 가 한다(docs/29).
	// 의존성을 남겨 두면 "여기서도 메일을 보낼 수 있다"는 오해가 남고, JavaMailSender 자동 구성이
	// 살아 있어 실수로 다시 직접 호출하는 코드가 들어올 수 있다.
	// 버전은 Boot BOM(Spring Security)이 정한다 — 6.3.1 로 고정해 Boot 3.4 의 Security 6.4 와 섞여 있었다
	implementation 'org.springframework.security:spring-security-oauth2-client'
	// OIDC(구글·LINE)의 ID 토큰 검증. 없으면 스프링이 OIDC 로그인 처리기를 아예 등록하지 않아 openid scope 가 있는
	// 등록(구글)은 처리할 곳이 없이 실패한다 — 구글 로그인은 이 줄 없이는 한 번도 동작할 수 없었다.
	implementation 'org.springframework.security:spring-security-oauth2-jose'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'   // 버전은 Boot BOM 이 정한다(고정하면 Boot 를 올려도 따라가지 않는다)


	implementation 'org.springframework.cloud:spring-cloud-starter'
	implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'
	implementation 'org.springframework.cloud:spring-cloud-starter-config'
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
	implementation 'org.springframework.kafka:spring-kafka'

	// 🔴 tomcat-embed-core:10.1.34 고정을 지웠다 — Boot 가 올리는 Tomcat 보안 패치(10.1.35 의 CVE-2025-24813 원격 코드 실행 등)를
	//    전부 막고 있었다. Tomcat 은 spring-boot-starter-web 이 BOM 버전으로 가져온다.
	
	implementation group: 'org.passay', name: 'passay', version: '1.6.4'
	implementation group: 'com.warrenstrange', name: 'googleauth', version: '1.4.0'
	implementation group: 'commons-io', name: 'commons-io', version: '2.22.0'
	//implementation group: 'com.google.code.gson', name: 'gson', version: '2.11.0'
	implementation group: 'com.amazonaws', name: 'aws-java-sdk-s3', version: '1.12.797'

	implementation project(':common')

	
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

	implementation group: 'io.jsonwebtoken', name: 'jjwt-jackson', version: '0.12.7'
	implementation group: 'io.jsonwebtoken', name: 'jjwt-impl', version: '0.12.7'
	implementation group: 'io.jsonwebtoken', name: 'jjwt-api', version: '0.12.7'

	//runtimeOnly 'com.mysql:mysql-connector-j'
	runtimeOnly 'org.postgresql:postgresql'
	// 스키마 마이그레이션: 파티셔닝 등 Hibernate ddl-auto가 만들 수 없는 DDL은 Flyway가 소유한다 (docs/09 P0)
	implementation 'org.flywaydb:flyway-core'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	// OpenAPI 문서: /v3/api-docs, /swagger-ui.html
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'	
	
	
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.kafka:spring-kafka-test'
	// 2FA 비밀 백필을 실제 SQL 로 확인한다(TotpSecretBackfillTest)
	testRuntimeOnly 'com.h2database:h2'
	
}



