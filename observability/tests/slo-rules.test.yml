      value: 0
- interval: 1m
  input_series:
  - series: probe_success{job="site-probe",instance="https://www.ysyproject.com/"}
    values: 1x120
  - series: probe_duration_seconds{job="site-probe",instance="https://www.ysyproject.com/"}
    values: 0.4x120
  - series: probe_success{job="site-probe",instance="https://www.ysyproject.com/catalog-service/api/content/home"}
    values: 1x50 0x70
  - series: probe_duration_seconds{job="site-probe",instance="https://www.ysyproject.com/catalog-service/api/content/home"}
    values: 0.4x120
  alert_rule_test:
  - eval_time: 52m
    alertname: SiteProbeDown
    exp_alerts: []
  - eval_time: 55m
    alertname: SiteProbeDown
    exp_alerts:
    - exp_labels:
        job: site-probe
        instance: https://www.ysyproject.com/catalog-service/api/content/home
        severity: critical
      exp_annotations:
        summary: 바깥에서 https://www.ysyproject.com/catalog-service/api/content/home 를 열지 못합니다
        description: 운영 노드의 blackbox-exporter 가 Cloudflare 를 거쳐 3분 연속 실패했습니다. cloudflared 터널 · 게이트웨이 · frontend 파드와 인증서를 보세요. probe_http_status_code 로 상태 코드를, Cloudflare 의 403 · 챌린지면 봇 차단 설정을 확인하세요 (docs/91
          §2-6).
  - eval_time: 115m
    alertname: SloErrorBudgetBurnFast
    exp_alerts:
    - exp_labels:
        slo: site-probe
        severity: critical
      exp_annotations:
        summary: SLO site-probe — 오류 예산을 14.4배 빠르기로 쓰고 있습니다(1h 50%)
        description: 14일 오류 예산의 4%를 1시간에 쓰는 빠르기입니다. 1h 과 5m 창이 둘 다 넘었습니다 — 지금도 계속되는 문제입니다. 서비스별 5xx · p99(High5xxRate · HighP99Latency) · 탐침(SiteProbeDown)과 추적(Jaeger)에서 원인을 보고, 배포 직후면 ops/28 --rollback
          을 먼저 생각하세요 (docs/91 §2).
  promql_expr_test:
  - expr: slo:sli_error:ratio_rate1h
    eval_time: 70m
    exp_samples:
    - labels: slo:sli_error:ratio_rate1h{slo="site-probe"}
      value: 0.16393442622950816
- interval: 1m
  input_series:
  - series: probe_success{job="site-probe",instance="https://www.ysyproject.com/"}
    values: 1x120
  - series: probe_duration_seconds{job="site-probe",instance="https://www.ysyproject.com/"}
    values: 0.4x120
  - series: probe_success{job="site-probe",instance="https://www.ysyproject.com/catalog-service/api/content/home"}
    values: 1x120
  - series: probe_duration_seconds{job="site-probe",instance="https://www.ysyproject.com/catalog-service/api/content/home"}
    values: 3x120
