# 바깥 탐침(blackbox-exporter) 모듈 — 운영 노드에서 Cloudflare 를 거쳐 손님과 같은 주소를 연다(docs/91 §2-6, SLO site-probe).
# 운영 덧씌우기(docker-compose-observability.oci.yml)의 blackbox-exporter 가 읽고, prometheus.oci.yml 의 site-probe 작업이 30초마다 부른다.
# TLS 는 검증한다(insecure_skip_verify 를 쓰지 않는다 — 가드 SloRulesTest). 상태 코드만 보지 않고 본문까지 본다 —
# Cloudflare 오류 화면 · 챌린지 페이지도 200 일 수 있다.
# [JA] 外部プローブ(blackbox-exporter)のモジュール — 本番ノードから Cloudflare を経由して客と同じアドレスを開く(docs/91 §2-6, SLO site-probe)。
#      本番上書き(docker-compose-observability.oci.yml)の blackbox-exporter が読み、prometheus.oci.yml の site-probe ジョブが 30 秒ごとに呼ぶ。
#      TLS は検証する(insecure_skip_verify は使わない — ガード SloRulesTest)。ステータスコードだけでなく本文まで見る —
#      Cloudflare のエラー画面 · チャレンジページも 200 でありうる。
modules:
  # 첫 화면 — SPA 의 index.html(frontend nginx). React 가 붙는 자리가 있어야 한다
  # [JA] 最初の画面 — SPA の index.html(frontend nginx)。React が付く場所がなければならない
  http_page:
    prober: http
    timeout: 10s
    http:
      method: GET
      valid_status_codes: [200]
      fail_if_not_ssl: true
      preferred_ip_protocol: ip4
      headers:
        User-Agent: "ecommerce-msa site-probe (docs/91)"
      fail_if_body_not_matches_regexp:
        - '<div id="root">'
  # 홈 API — 게이트웨이 → catalog(홈 구성은 파드 메모리 30초 캐시). JSON 이어야 한다(프론트로 새면 index.html 200 이다)
  # [JA] ホーム API — ゲートウェイ → catalog(ホーム構成は Pod メモリの 30 秒キャッシュ)。JSON
  #      でなければならない(フロントに漏れると index.html の 200 になる)
  http_api:
    prober: http
    timeout: 10s
    http:
      method: GET
      valid_status_codes: [200]
      fail_if_not_ssl: true
      preferred_ip_protocol: ip4
      headers:
        User-Agent: "ecommerce-msa site-probe (docs/91)"
        Accept: application/json
      fail_if_header_not_matches:
        - header: Content-Type
          regexp: 'application/json'
      fail_if_body_not_matches_regexp:
        - '^\s*[\[{]'
