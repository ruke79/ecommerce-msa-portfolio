# Prometheus 경보 규칙 — docs/03 부록 "관측 지표 체크리스트"의 실행형.
# (컨슈머 지연은 kafka-consumer 그룹 — 2026-11-14 부터 지표가 있다, docs/91 §3. 아웃박스 파티션은 outbox-health 그룹)
groups:
  - name: service-availability
    rules:
      - alert: ServiceDown
        expr: up{job="spring-actuator"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.service }} 다운"
          description: "{{ $labels.service }} ({{ $labels.instance }}) 가 2분째 스크레이프에 응답하지 않습니다."

      # 서비스 지표가 통째로 없다 — 운영에서는 클러스터 안의 에이전트(k8s-overlays/external/metrics-agent.yaml)가 보내므로,
      # 에이전트가 멈추거나 노드의 Prometheus 가 수신 없이(docker-compose-observability.oci.yml 없이) 떴으면 up 자체가 사라진다.
      # 그때 ServiceDown(up == 0)은 울릴 수 없다 — 그래서 따로 본다(docs/63 §5, B-95).
      # [JA] サービスの指標がまったくない — エージェント停止や受信なしで起動した Prometheus では up 自体が消え、ServiceDown は鳴れない。
      - alert: ServiceMetricsMissing
        expr: absent(up{job="spring-actuator"})
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "서비스 지표가 하나도 들어오지 않습니다"
          description: "kubectl -n ecommerce get pods -l app=metrics-agent 와 그 로그(remote write 오류), 노드의 Prometheus 가 docker-compose-observability.oci.yml 과 함께 떴는지(--web.enable-remote-write-receiver) 확인하세요 (docs/63 §5)."

      - alert: CircuitBreakerOpen
        expr: resilience4j_circuitbreaker_state{state="open"} == 1
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "서킷브레이커 OPEN: {{ $labels.name }}"
          description: "{{ $labels.service }} 의 서킷브레이커 {{ $labels.name }} 가 열렸습니다. 다운스트림 장애 격리 중 — 원인 서비스를 확인하세요 (docs/03 F-1 런북)."

  - name: request-health
    rules:
      - alert: High5xxRate
        expr: |
          sum by (service) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / sum by (service) (rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.service }} 5xx 비율 5% 초과"
          description: "최근 5분 5xx 비율이 5%를 넘었습니다."

      - alert: HighP99Latency
        expr: |
          histogram_quantile(0.99,
            sum by (service, le) (rate(http_server_requests_seconds_bucket[5m]))) > 3
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }} p99 지연 3s 초과"
          description: "요청 p99가 3초를 넘었습니다. (히스토그램은 application-common.yml 의 percentiles-histogram 설정으로 노출)"

  - name: jvm-health
    rules:
      - alert: JvmHeapNearLimit
        expr: |
          sum by (service) (jvm_memory_used_bytes{area="heap"})
            / sum by (service) (jvm_memory_max_bytes{area="heap"}) > 0.9
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }} 힙 90% 초과"
          description: "JVM 힙 사용률이 5분째 90%를 넘고 있습니다. OOM 전에 조치하세요."

  # 초과 판매(docs/53) — 결제 뒤 재고 차감이 모자랐다. 자동 환불되지만 운영자는 알아야 한다: 재고 수치가 실물과
  # 어긋났거나 인기 상품이 동시에 팔리고 있다는 신호다. 자동 환불 실패·무통장은 로그 "수동 환불 필요" 로 Loki 경보가 따로 간다.
  - name: stock-shortage
    rules:
      - alert: StockShortageOccurred
        expr: sum(increase(catalog_stock_shortage_total[30m])) > 0
        labels: { severity: warning }
        annotations:
          summary: "결제된 주문의 재고가 모자랐습니다 (최근 30분 {{ $value }}개)"
          description: "catalog 가 결제 뒤 재고 차감에서 모자란 수량을 order 에 알렸고, order 가 그만큼 자동 환불합니다. 재고 수치가 실물과 맞는지, 품절 처리가 늦지 않았는지 확인하세요(docs/53)."

      # 결제 확정 차감 · 복원(product-update)이 DLT 로 갔다 — 재고가 줄지 않은 채 예약이 만료되면 같은 수량이 다시 팔린다(돈은 받았고
      # 물건은 없다). 일시적 DB 실패는 약 3분 다시 하므로(catalog KafkaDltConfig) 여기까지 온 것은 사람이 봐야 한다.
      # 처리: DLT 레코드의 eventId(order-<주문>) 로 주문을 찾아, 재고를 손으로 맞추거나 원래 토픽으로 다시 보낸다(멱등 — 이미 반영됐으면 건너뛴다).
      - alert: KafkaDeadLetterPublished
        expr: sum by (service, topic) (increase(kafka_dlt_records_total[15m])) > 0
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.service }} 가 {{ $labels.topic }} 레코드를 DLT 로 보냈습니다 (최근 15분 {{ $value }}건)"
          description: "재시도로 처리하지 못한 메시지입니다. product-update 면 결제된 주문의 재고 차감이 빠졌을 수 있습니다 — {{ $labels.topic }}.DLT 를 확인하세요."

      # 쿠폰 이중 사용 — 한 쿠폰으로 두 주문이 결제를 마쳤다(같은 쿠폰을 고른 두 결제가 겹쳤다). 두 번째 주문은 쿠폰 없이 받을 값을
      # 할인받았다. 처리: coupon-service 로그의 "쿠폰 이중 사용" 의 orderId 로 주문을 찾아 차액을 정한다(청구 · 감수).
      - alert: CouponDoubleUse
        expr: sum(increase(coupon_double_use_total[1h])) > 0
        labels: { severity: warning }
        annotations:
          summary: "쿠폰 하나로 두 주문이 할인을 받았습니다 (최근 1시간 {{ $value }}건)"
          description: "coupon-service 로그의 \"쿠폰 이중 사용\" 에 orderId 가 있습니다. 주문의 할인을 확인하세요."

      # 이중 결제 — 이미 결제가 붙은 주문에 다른 결제가 확인됐다(두 탭 · 두 수단). 돈을 두 번 받았다. 처리: order-service 로그의
      # "이중 결제" 의 second= 결제를 제공자 콘솔에서 환불한다(주문에는 첫 결제만 붙어 있다 — 주문 환불 버튼은 첫 결제를 돌려준다).
      - alert: OrderDuplicatePayment
        expr: sum by (provider) (increase(order_duplicate_payment_total[30m])) > 0
        labels: { severity: critical }
        annotations:
          summary: "이미 결제된 주문에 두 번째 결제가 확인됐습니다 ({{ $labels.provider }}, 최근 30분 {{ $value }}건)"
          description: "order-service 로그의 \"이중 결제\" 에 두 결제 참조가 있습니다. 두 번째 결제를 제공자 콘솔에서 환불하세요."

      # 결제 대사 — 결제는 기록됐는데 10분 넘게 결제 전인 주문(order UnconfirmedPaymentWatch). 고객은 돈을 냈는데 주문은 결제 전이다.
      # 처리: 로그 "결제 대사" 의 orderId 로 payment-request 아웃박스 행 · pay-service · payment.DLT 를 본다. 모든 파드가 같은 수 → max.
      - alert: OrderPaymentUnconfirmed
        expr: max(order_payment_unconfirmed) > 0
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: "결제는 됐는데 결제 전으로 남은 주문이 {{ $value }}건 있습니다"
          description: "order-service 로그의 \"결제 대사\" 에 orderId 가 있습니다. payment-request 아웃박스 · pay-service · payment.DLT 를 확인하세요."

      # order 아웃박스 행을 보낼 수 없어 FAILED 로 뒀다(깨진 페이로드 · 모르는 타입). 그 메시지(결제 요청 · 주문 상태 · 재고 차감 ·
      # 장바구니 비우기)는 나가지 않았다. 처리: 로그 "아웃박스 행을 보낼 수 없다" 의 id 로 orders.payment_outbox_event 를 본다.
      - alert: OrderOutboxRowFailed
        expr: sum by (type) (increase(order_outbox_failed_total[30m])) > 0
        labels: { severity: critical }
        annotations:
          summary: "order 아웃박스 {{ $labels.type }} 행을 보내지 못해 FAILED 로 뒀습니다 (최근 30분 {{ $value }}건)"
          description: "order-service 로그의 \"아웃박스 행을 보낼 수 없다\" 에 행 id 가 있습니다. orders.payment_outbox_event 를 확인하세요."

      - alert: PayOutboxRowFailed
        expr: sum(increase(pay_outbox_failed_total[30m])) > 0
        labels: { severity: critical }
        annotations:
          summary: "pay 결제 응답 아웃박스 행을 보내지 못해 FAILED 로 뒀습니다 (최근 30분 {{ $value }}건)"
          description: "pay-service 로그의 \"결제 응답 아웃박스 행을 보낼 수 없다\" 에 행 id 가 있습니다. pay.order_outbox_event 를 확인하세요 — 그 주문은 결제 응답을 받지 못했습니다."

      - alert: DeliveryStatusPublishFailed
        expr: sum(increase(delivery_status_publish_failed_total[30m])) > 0
        labels: { severity: warning }
        annotations:
          summary: "delivery 가 배송 상태 이벤트를 보내지 못했습니다 (최근 30분 {{ $value }}건)"
          description: "delivery-service 로그의 \"배송 상태 발행 실패\" 에 orderId 와 상태가 있습니다. 그 주문의 상태(DISPATCHED · DELIVERED)와 알림이 멈췄을 수 있습니다 — 배송 화면의 상태와 주문 상태를 맞춰 보세요."

      - alert: ChatMessagePublishFailed
        expr: sum(increase(chat_message_publish_failed_total[30m])) > 0
        labels: { severity: warning }
        annotations:
          summary: "chat 이 채팅 메시지를 Kafka 로 보내지 못했습니다 (최근 30분 {{ $value }}건)"
          description: "chat-service 로그의 \"채팅 메시지 발행 실패\" 에 roomId 와 예외 종류가 있습니다. 그 메시지는 저장 · 방송되지 않았습니다 — 브로커 상태(채팅 · 상담 모두 멈춤)를 먼저 보세요."

      - alert: ChatFanoutPublishFailed
        expr: sum(increase(chat_stomp_fanout_failed_total[30m])) > 0
        labels: { severity: warning }
        annotations:
          summary: "chat 이 실시간 메시지를 Redis 로 퍼뜨리지 못했습니다 (최근 30분 {{ $value }}건)"
          description: "chat-service 로그의 \"STOMP 팬아웃 발행 실패\" 에 주소와 예외 종류가 있습니다. 그 메시지는 저장됐고 소비한 파드의 구독자만 실시간으로 받았습니다 — 다른 파드에 붙은 사람은 다시 열면 이력에서 봅니다. Redis 상태를 먼저 보세요(docs/21 §2)."

      - alert: StockShortageRefundNotAutomatic
        expr: sum by (outcome) (increase(order_stock_shortage_total{outcome=~"manual|unknown_order"}[30m])) > 0
        labels: { severity: critical }
        annotations:
          summary: "재고 부족분을 자동으로 환불하지 못했습니다 ({{ $labels.outcome }})"
          description: "무통장입금 주문(계좌 송금 필요) 또는 주문을 찾지 못한 부족 알림입니다. order-service 로그의 \"수동 환불 필요\"/\"수동 확인 필요\" 로 주문을 찾아 처리하세요(docs/53)."

  # 리프레시 토큰 재사용(docs/68) — 이미 회전된 토큰이 유예(20초)가 지난 뒤 다시 왔다. 토큰이 복사돼 나갔다는 뜻이고,
  # user-service 는 그 로그인 묶음 전체를 이미 끊었다(피해자도 다시 로그인). 한 건이라도 사람이 봐야 한다.
  # [JA] リフレッシュトークン再利用 — 既にローテーション済みのトークンが猶予後に再び来た(複製の疑い)。ファミリーは切断済み。
  - name: auth-security
    rules:
      - alert: RefreshTokenReuseDetected
        expr: sum(increase(auth_refresh_total{result="reused"}[15m])) > 0
        labels: { severity: warning }
        annotations:
          summary: "리프레시 토큰 재사용을 감지했습니다 (최근 15분 {{ $value }}건)"
          description: "이미 쓴 리프레시 토큰이 다시 제출돼 그 로그인 묶음을 끊었습니다(탈취 의심). user-service 로그 \"리프레시 토큰 재사용 감지\" 의 userId 로 계정을 확인하세요. 같은 사용자가 반복되면 기기 · 확장 프로그램 유출을, 여러 사용자가 한꺼번에면 로그 · 프록시 · 백업 등 서버 쪽 유출을 의심합니다(쿠키는 HttpOnly)(docs/68)."

  # saga-projection 이 입력 레코드를 못 읽었을 때(SagaDeserializationExceptionHandler, docs/55 §8).
  # 깨진 레코드는 건너뛰고(skipped) 모르는 작성 스키마면 멈춘다(halted) — 어느 쪽이든 조용히 지나가면 안 된다.
  - name: saga-projection
    rules:
      - alert: SagaProjectionHalted
        # 모르는 작성 스키마 — 롤링 배포 중이면 새 파드가 몇 분 안에 이어받는다. 10분이 넘도록 다시 오르면
        # 배포가 아니라 스키마 진화 규칙 위반이다(프로듀서가 아무 소비자도 모르는 스키마로 썼다).
        expr: increase(saga_projection_deserialization_failures_total{action="halted"}[15m]) > 0
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "saga-projection 이 모르는 스키마의 레코드에서 멈췄습니다 ({{ $labels.topic }})"
          description: "처리 스레드가 멈춰 사가 조회가 갱신되지 않습니다. 배포 중이 아니라면 {{ $labels.topic }} 의 프로듀서가 쓴 스키마를 소비자가 모릅니다 — 이력/다음 스키마 등록을 확인하세요(docs/55 §4·§5). 로그에 토픽·파티션·오프셋이 있습니다."

      - alert: SagaProjectionSkippedRecords
        expr: increase(saga_projection_deserialization_failures_total{action="skipped"}[15m]) > 0
        labels: { severity: warning }
        annotations:
          summary: "saga-projection 이 읽을 수 없는 레코드를 건너뛰었습니다 ({{ $labels.topic }})"
          description: "그 주문의 사가 상태가 빠졌을 수 있습니다. 로그의 좌표(토픽·파티션·오프셋)로 원본을 확인하고, 필요하면 프로젝션을 입력 토픽에서 다시 접습니다(애플리케이션 리셋, docs/55 §8)."

  # 아웃박스 월 파티션(cart · order · pay · user) — common OutboxPartitionAutoConfiguration 이 6시간마다 앞으로 3달치를
  # 만든다(docs/09 §4.6). 잡이 조용히 멈추면 달이 바뀌는 순간 행이 DEFAULT 파티션으로 간다 — 에러는 나지 않는다.
  #
  # ⚠️ 2026-10-12 까지 이 그룹은 한 번도 울릴 수 없었다. ① 지표가 등록되지 않았다(자동 설정 순서 — 이제 MeterBinder) ②
  #    months_ahead 는 점검에 성공했을 때의 값을 그대로 냈다 — 성공하면 늘 3, 실패가 이어지면 마지막 값에 멈춤, 한 번도 성공
  #    못 하면 NaN(NaN 과의 비교는 거짓). 이제 months_ahead 는 지금 시각 기준으로 매번 계산하고(잡이 멈추면 달마다 1 씩 준다),
  #    "마지막 성공" 과 "지표 없음" 을 따로 본다.
  - name: outbox-health
    rules:
      - alert: OutboxPartitionJobStale
        # 마지막 성공 시각. 처음 값은 기동 시각이라 "기동 뒤 한 번도 못 돌았다" 도 여기서 잡힌다. 주기 6시간 — 하루면 4번 연속 실패.
        expr: time() - max by (service, table) (outbox_partition_last_success_seconds) > 86400
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "아웃박스 파티션 점검이 {{ $value | humanizeDuration }} 동안 성공하지 못했습니다 ({{ $labels.table }})"
          description: "로그의 '아웃박스 파티션 점검 실패'(DB 권한 · 연결) 또는 '파티션 테이블이 아니다'(V1 을 건너뛴 DB)를 확인하세요. outbox.partitions.enabled=false 로 잡을 끈 경우에도 울립니다 — 그 동안은 아무도 파티션을 만들지 않습니다 (docs/09 §4.6)."

      - alert: OutboxPartitionMetricsMissing
        # 파티션을 쓰는 서비스가 하나도 이 지표를 내지 않는다 — 위 경보들이 모두 침묵한다. 2026-10-12 까지 실제로 그랬다.
        expr: absent(outbox_partition_months_ahead)
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "아웃박스 파티션 지표가 없습니다 — 파티션 경보가 모두 울릴 수 없는 상태입니다"
          description: "cart · order · pay · user 의 /actuator/prometheus 에 outbox_partition_* 가 있는지, 그 서비스들이 수집 대상인지 확인하세요(OutboxPartitionAutoConfiguration.Metrics)."

      - alert: OutboxPartitionRunwayShort
        # 지금 기준 이번 달 뒤로 미리 만들어진 파티션 수. 정상이면 3. 잡이 멈추면 달이 바뀔 때마다 1 씩 준다 — 1 이면 두 달 가까이 못 돌았다.
        expr: min by (service, table) (outbox_partition_months_ahead) < 2
        for: 6h
        labels: { severity: warning }
        annotations:
          summary: "아웃박스 파티션 여유가 {{ $value }}달뿐입니다 ({{ $labels.table }})"
          description: "파티션 잡이 돌지 않고 있습니다. 로그의 '아웃박스 파티션 점검 실패' 를 확인하세요. 서비스를 재시작하면 30초 뒤 다시 만듭니다 (docs/09 §4.6)."

      - alert: OutboxPartitionMissingNextMonth
        expr: min by (service, table) (outbox_partition_months_ahead) < 1
        for: 1h
        labels: { severity: critical }
        annotations:
          summary: "다음 달 아웃박스 파티션이 없습니다 ({{ $labels.table }})"
          description: "달이 바뀌면 모든 아웃박스 행이 DEFAULT 파티션으로 갑니다. 잡이 다음 실행에서 옮겨 붙이지만(DEFAULT → 새 파티션), 원인(DB 권한 · 연결)을 먼저 확인하세요."

      - alert: OutboxRowsLandingInDefaultPartition
        # DEFAULT 에 옛 이관분이 남아 있을 수 있어 "0 이 아니다" 가 아니라 "늘었다" 를 본다.
        expr: delta(outbox_partition_default_rows[1d]) > 0
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "아웃박스 행이 DEFAULT 파티션에 쌓이고 있습니다 ({{ $labels.table }})"
          description: "그 달의 파티션이 없는 동안 들어온 행입니다. 파티션 잡이 다음 실행에서 옮깁니다. 이 값은 마지막으로 성공한 점검의 것이라 잡이 실패하는 동안에는 늘지 않습니다 — 그 경우는 OutboxPartitionJobStale 이 잡습니다."

      - alert: OutboxPartitionRetentionStalled
        # 이번 달 앞으로 남은 월 파티션 수 − 보존 설정(기본 3). 보존이 돌면 0 이하 — 2 이상이면 두 달 넘게 오래된 달을 지우지 못했다.
        # 보존을 끈 서비스(retention 0)는 months_kept 가 NaN 이라 울리지 않는다(docs/09 §4.6).
        expr: max by (service, table) (outbox_partition_months_kept) - max by (service, table) (outbox_partition_retention_months) > 1
        for: 1d
        labels: { severity: warning }
        annotations:
          summary: "아웃박스 오래된 파티션을 지우지 못하고 있습니다 — 보존보다 {{ $value }}달 더 남음 ({{ $labels.table }})"
          description: "로그의 '오래된 달에 끝나지 않은 행이 있어 지우지 않았다'(STARTED · FAILED 행 — 발행되지 않은 메시지, 고치거나 버릴지 사람이 정한다) 또는 '아웃박스 파티션 보존 실패'(잠금 3초 · 문장 30초 상한)를 확인하세요 (docs/09 §4.6)."

  # 추적 파이프라인(docs/63) — 서비스 → OTel Collector → Jaeger · span_metrics. 어디가 끊겨도 서비스는 오류 없이 돈다
  # (OTLP 내보내기는 실패한 배치를 버리고 계속 간다). 그래서 "추적이 안 보인다" 를 사람이 먼저 알아채기 전에 여기서 잡는다.
  # Collector 지표 이름은 버전에 따라 _total 이 붙기도 해서 둘 다 받는다.
  # 경보가 나가지 못한다 — 이 경보 자신도 나가지 못할 수 있다(같은 길). 그래서 ops/05 · Grafana 에서 보이게 둔다(docs/22 §1).
  # [JA] アラートが出ていけない — このアラート自身も届かないかもしれない。ops/05 · Grafana で見えるようにしておく。
  - name: alert-delivery
    rules:
      - alert: AlertDeliveryFailing
        expr: sum(increase(alertmanager_notifications_failed_total[15m])) > 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "경보를 Discord 로 보내지 못하고 있습니다"
          description: "docker logs alertmanager 2>&1 | grep 'Notify for alerts failed' | tail -3 — 주소 파일(observability/secrets/webhook-url-*)이 없거나 · 권한(uid 65534)이 틀렸거나 · 웹후크가 지워졌습니다. 고친 뒤 sudo ./ops/17-configure-alert-receivers.sh MODE=test (docs/22 §1)."

  - name: tracing-pipeline
    rules:
      - alert: OtelCollectorDown
        expr: up{job="otel-collector"} == 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "OTel Collector 다운 — 추적과 span_metrics 가 끊겼습니다"
          description: "docker compose -f docker-compose-observability.yml ps otel-collector 와 그 로그를 확인하세요. 서비스는 영향 없이 돌지만 그동안의 추적은 사라집니다 (docs/63)."

      - alert: TraceExportToJaegerFailing
        expr: sum(rate({__name__=~"otelcol_exporter_send_failed_spans(_total)?"}[5m])) > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Collector 가 Jaeger 로 스팬을 보내지 못하고 있습니다"
          description: "Jaeger 가 떠 있는지(ops/05), 메모리 한도로 재시작을 반복하는지(docker inspect jaeger) 확인하세요."

      - alert: TracesRefusedByCollector
        # memory_limiter 가 받기를 거절 — 추적이 폭주했거나 Collector 한도(256m)가 작다.
        expr: sum(rate({__name__=~"otelcol_receiver_refused_spans(_total)?"}[5m])) > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Collector 가 메모리 한도로 스팬을 거절하고 있습니다"
          description: "Collector 메모리 한도(docker-compose-observability.yml 의 mem_limit 와 memory_limiter)를 올리거나 꼬리 샘플링의 decision_wait 를 줄이세요. 서비스 쪽 샘플링(TRACING_SAMPLING_PROBABILITY)은 낮추지 않습니다 — 오류 추적까지 버려집니다 (docs/63 §5)."

      - alert: TailSamplingDroppedTooEarly
        # 결정 전 대기 칸(tail_sampling.num_traces)이 넘쳐 추적을 결정 없이 버렸다 — 오류 추적도 섞여 있을 수 있다.
        expr: sum(increase({__name__=~"otelcol_processor_tail_sampling_sampling_trace_dropped_too_early(_total)?"}[15m])) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "꼬리 샘플링이 결정 전에 추적을 버리고 있습니다"
          description: "초당 새 추적이 num_traces / decision_wait 를 넘었습니다. observability/otel-collector.yml 의 num_traces 를 올리세요(메모리 한도도 함께) (docs/63 §5)."

  # 백업은 "실패하는 것"보다 "아무도 모르게 안 도는 것"이 훨씬 위험하다.
  # ops/08-backup-postgres.sh 가 METRICS_DIR 에 남기는 textfile 지표를 감시한다
  # (node_exporter --collector.textfile.directory=<METRICS_DIR> 필요).
  - name: backup-health
    rules:
      - alert: PostgresBackupStale
        # 일 1회 백업 기준. 48시간 넘게 성공 기록이 갱신되지 않으면 백업이 죽은 것이다.
        expr: time() - ecommerce_pg_backup_last_success_timestamp > 172800
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "PostgreSQL 백업이 48시간 이상 성공하지 않았습니다"
          description: "마지막 성공 이후 {{ $value | humanizeDuration }} 경과. C1(금전) 데이터의 RPO 5분 목표가 무너진 상태입니다 — ops/08-backup-postgres.sh 의 cron 과 로그를 확인하세요 (docs/15 §2)."

      - alert: PostgresBackupMetricMissing
        # 지표 자체가 사라진 경우. "경보가 안 울린다 = 정상"이라는 착각을 막는다.
        expr: absent(ecommerce_pg_backup_last_success_timestamp)
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "PostgreSQL 백업 지표가 존재하지 않습니다"
          description: "백업이 한 번도 성공하지 않았거나 textfile collector 가 설정되지 않았습니다. 백업 없는 상태로 운영 중일 수 있습니다."

      - alert: PostgresWalArchivingFailing
        # archive_command 실패는 곧 pg_wal 디스크 포화로 이어진다 — DB 정지 사고의 단골이다.
        # (postgres_exporter 의 pg_stat_archiver 수집이 필요하다)
        expr: increase(pg_stat_archiver_failed_count[15m]) > 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "WAL 아카이빙이 실패하고 있습니다"
          description: "archive_command 가 실패 중입니다. WAL 이 pg_wal 에 계속 쌓여 디스크가 가득 차면 DB 가 멈춥니다. 동시에 PITR 복구 가능 구간도 끊깁니다 (docs/15 §2)."

      - alert: MongoBackupStale
        # 채팅 기록(C3)은 RPO 24시간. 일 1회 백업이 이틀 이상 멈추면 경보.
        expr: time() - ecommerce_mongo_backup_last_success_timestamp > 172800
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "MongoDB 백업이 48시간 이상 성공하지 않았습니다"
          description: "채팅 기록은 재생성이 불가능한 데이터입니다(Elasticsearch 색인과 달리 다시 만들 수 없음). ops/10-backup-mongo.sh 의 cron 을 확인하세요 (docs/15 §3)."

      - alert: MongoBackupEmpty
        # ⚠️ 위 Stale 경보는 **제시간에 돈 빈 백업을 잡지 못한다.** mongodump 는 대상 DB 가
        # 비어 있어도 성공하고, gzip -t 는 빈 아카이브도 통과시킨다. 실제로 116바이트짜리
        # 덤프가 "완료"로 끝난 적이 있다. 시각만 보면 백업이 건강해 보인다.
        #
        # 이 프로젝트는 URI 경로가 아니라 spring.data.mongodb.name('chat')으로 DB 를 고른다.
        # MONGO_URI 가 다른 DB 를 가리키면 정확히 이 상태가 된다 — 매일 성공하는 빈 백업.
        #
        # 1KiB 는 "gzip 헤더 + 빈 메타데이터"보다 크고 실제 채팅 한 건보다는 작은 값이다.
        # 채팅이 정말 하나도 없는 초기에는 이 경보가 맞게 울린다 — 그때는 억제하면 된다.
        expr: ecommerce_mongo_backup_last_size_bytes < 1024
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "MongoDB 백업은 성공했지만 사실상 비어 있습니다 ({{ $value }} bytes)"
          description: "백업이 제시간에 돌았고 무결성 검사도 통과했지만 담긴 것이 없습니다. MONGO_URI 가 가리키는 DB 와 애플리케이션이 쓰는 DB(spring.data.mongodb.name = chat)가 다른지 확인하세요. 배포 직후라 채팅 기록이 실제로 없는 경우라면 정상입니다."

  # ── SLO(docs/91) ─────────────────────────────────────────────────────────────────────────────────
  # 목표 숫자는 slo:objective:* 두 줄이 한 곳이다 — 경보는 그 값에서 오류 예산을 계산한다. 지연 경계(le)는
  # application-common.yml 의 management.metrics.distribution.slo 버킷과 같아야 한다(가드 SloRulesTest).
  # SLI 는 서비스 쪽 http.server.requests(게이트웨이 · 네트워크 시간은 빠진다 — 사용자 체감은 ops/53 의 k6 값).
  # 오류 = 5xx 만(4xx 는 손님 쪽). 지연 = 경계를 넘은 요청 비율(5xx 포함).
  # 경보는 다중 창 소진율(Google SRE workbook 5장): 빠름 1h · 5m 가 14.4 배(30일 예산의 2% 를 1시간에),
  # 느림 6h · 30m 가 6 배(5% 를 6시간에). 요청이 적으면(1시간 평균 초당 0.03 = 시간당 약 100 미만) 울리지 않는다 —
  # 운영처럼 손님이 적은 곳에서 한두 건의 실패가 예산을 다 쓴 것처럼 보이지 않게(그런 실패는 High5xxRate 가 본다).
  # [JA] SLO — 目標値は slo:objective:* の二行だけ。遅延の境界(le)は application-common.yml の SLO バケットと同じ。
  #      多窓のバーンレート(速い 1h·5m ×14.4、遅い 6h·30m ×6)。リクエストが少ないと鳴らない。
  - name: slo
    rules:
      # catalog-read — 상품 · 검색 · 홈 GET(관리자 · 내부 · actuator 제외): 가용성 99.9% · 300ms 안 99%
      - record: slo:objective:availability
        expr: vector(0.999)
        labels: { slo: catalog-read }
      - record: slo:objective:latency
        expr: vector(0.99)
        labels: { slo: catalog-read, threshold_seconds: "0.3" }
      - record: slo:sli_error:ratio_rate5m
        expr: |
          (sum(rate(http_server_requests_seconds_count{service="catalog-service",method="GET",uri!~".*(actuator|admin|internal).*",status=~"5.."}[5m])) or vector(0))
            / sum(rate(http_server_requests_seconds_count{service="catalog-service",method="GET",uri!~".*(actuator|admin|internal).*"}[5m]))
        labels: { slo: catalog-read }
      - record: slo:sli_slow:ratio_rate5m
        expr: |
          1 - sum(rate(http_server_requests_seconds_bucket{service="catalog-service",method="GET",uri!~".*(actuator|admin|internal).*",le="0.3"}[5m]))
                / sum(rate(http_server_requests_seconds_count{service="catalog-service",method="GET",uri!~".*(actuator|admin|internal).*"}[5m]))
        labels: { slo: catalog-read }
      - record: slo:sli_error:ratio_rate30m
        expr: |
          (sum(rate(http_server_requests_seconds_count{service="catalog-service",method="GET",uri!~".*(actuator|admin|internal).*",status=~"5.."}[30m])) or vector(0))
            / sum(rate(http_server_requests_seconds_count{service="catalog-service",method="GET",uri!~".*(actuator|admin|internal).*"}[30m]))
        labels: { slo: catalog-read }
      - record: slo:sli_slow:ratio_rate30m
        expr: |
          1 - sum(rate(http_server_requests_seconds_bucket{service="catalog-service",method="GET",uri!~".*(actuator|admin|internal).*",le="0.3"}[30m]))
                / sum(rate(http_server_requests_seconds_count{service="catalog-service",method="GET",uri!~".*(actuator|admin|internal).*"}[30m]))
        labels: { slo: catalog-read }
      - record: slo:sli_error:ratio_rate1h
        expr: |
          (sum(rate(http_server_requests_seconds_count{service="catalog-service",method="GET",uri!~".*(actuator|admin|internal).*",status=~"5.."}[1h])) or vector(0))
            / sum(rate(http_server_requests_seconds_count{service="catalog-service",method="GET",uri!~".*(actuator|admin|internal).*"}[1h]))
        labels: { slo: catalog-read }
      - record: slo:sli_slow:ratio_rate1h
        expr: |
          1 - sum(rate(http_server_requests_seconds_bucket{service="catalog-service",method="GET",uri!~".*(actuator|admin|internal).*",le="0.3"}[1h]))
                / sum(rate(http_server_requests_seconds_count{service="catalog-service",method="GET",uri!~".*(actuator|admin|internal).*"}[1h]))
        labels: { slo: catalog-read }
      - record: slo:sli_error:ratio_rate6h
        expr: |
          (sum(rate(http_server_requests_seconds_count{service="catalog-service",method="GET",uri!~".*(actuator|admin|internal).*",status=~"5.."}[6h])) or vector(0))
            / sum(rate(http_server_requests_seconds_count{service="catalog-service",method="GET",uri!~".*(actuator|admin|internal).*"}[6h]))
        labels: { slo: catalog-read }
      - record: slo:sli_slow:ratio_rate6h
        expr: |
          1 - sum(rate(http_server_requests_seconds_bucket{service="catalog-service",method="GET",uri!~".*(actuator|admin|internal).*",le="0.3"}[6h]))
                / sum(rate(http_server_requests_seconds_count{service="catalog-service",method="GET",uri!~".*(actuator|admin|internal).*"}[6h]))
        labels: { slo: catalog-read }
      - record: slo:requests:rate1h
        expr: sum(rate(http_server_requests_seconds_count{service="catalog-service",method="GET",uri!~".*(actuator|admin|internal).*"}[1h]))
        labels: { slo: catalog-read }
      # order-create — 주문 생성 POST: 가용성 99.9% · 1000ms 안 99%
      - record: slo:objective:availability
        expr: vector(0.999)
        labels: { slo: order-create }
      - record: slo:objective:latency
        expr: vector(0.99)
        labels: { slo: order-create, threshold_seconds: "1.0" }
      - record: slo:sli_error:ratio_rate5m
        expr: |
          (sum(rate(http_server_requests_seconds_count{service="order-service",method="POST",uri=~"/?api/order/create",status=~"5.."}[5m])) or vector(0))
            / sum(rate(http_server_requests_seconds_count{service="order-service",method="POST",uri=~"/?api/order/create"}[5m]))
        labels: { slo: order-create }
      - record: slo:sli_slow:ratio_rate5m
        expr: |
          1 - sum(rate(http_server_requests_seconds_bucket{service="order-service",method="POST",uri=~"/?api/order/create",le="1.0"}[5m]))
                / sum(rate(http_server_requests_seconds_count{service="order-service",method="POST",uri=~"/?api/order/create"}[5m]))
        labels: { slo: order-create }
      - record: slo:sli_error:ratio_rate30m
        expr: |
          (sum(rate(http_server_requests_seconds_count{service="order-service",method="POST",uri=~"/?api/order/create",status=~"5.."}[30m])) or vector(0))
            / sum(rate(http_server_requests_seconds_count{service="order-service",method="POST",uri=~"/?api/order/create"}[30m]))
        labels: { slo: order-create }
      - record: slo:sli_slow:ratio_rate30m
        expr: |
          1 - sum(rate(http_server_requests_seconds_bucket{service="order-service",method="POST",uri=~"/?api/order/create",le="1.0"}[30m]))
                / sum(rate(http_server_requests_seconds_count{service="order-service",method="POST",uri=~"/?api/order/create"}[30m]))
        labels: { slo: order-create }
      - record: slo:sli_error:ratio_rate1h
        expr: |
          (sum(rate(http_server_requests_seconds_count{service="order-service",method="POST",uri=~"/?api/order/create",status=~"5.."}[1h])) or vector(0))
            / sum(rate(http_server_requests_seconds_count{service="order-service",method="POST",uri=~"/?api/order/create"}[1h]))
        labels: { slo: order-create }
      - record: slo:sli_slow:ratio_rate1h
        expr: |
          1 - sum(rate(http_server_requests_seconds_bucket{service="order-service",method="POST",uri=~"/?api/order/create",le="1.0"}[1h]))
                / sum(rate(http_server_requests_seconds_count{service="order-service",method="POST",uri=~"/?api/order/create"}[1h]))
        labels: { slo: order-create }
      - record: slo:sli_error:ratio_rate6h
        expr: |
          (sum(rate(http_server_requests_seconds_count{service="order-service",method="POST",uri=~"/?api/order/create",status=~"5.."}[6h])) or vector(0))
            / sum(rate(http_server_requests_seconds_count{service="order-service",method="POST",uri=~"/?api/order/create"}[6h]))
        labels: { slo: order-create }
      - record: slo:sli_slow:ratio_rate6h
        expr: |
          1 - sum(rate(http_server_requests_seconds_bucket{service="order-service",method="POST",uri=~"/?api/order/create",le="1.0"}[6h]))
                / sum(rate(http_server_requests_seconds_count{service="order-service",method="POST",uri=~"/?api/order/create"}[6h]))
        labels: { slo: order-create }
      - record: slo:requests:rate1h
        expr: sum(rate(http_server_requests_seconds_count{service="order-service",method="POST",uri=~"/?api/order/create"}[1h]))
        labels: { slo: order-create }
      - alert: SloErrorBudgetBurnFast
        expr: |
          (
            slo:sli_error:ratio_rate1h > on (slo) (14.4 * (1 - slo:objective:availability))
            and on (slo) slo:sli_error:ratio_rate5m > on (slo) (14.4 * (1 - slo:objective:availability))
          )
          and on (slo) slo:requests:rate1h > 0.03
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "SLO {{ $labels.slo }} — 5xx 오류 예산을 14.4배 빠르기로 쓰고 있습니다(1h {{ $value | humanizePercentage }})"
          description: "30일 오류 예산의 2%를 1시간에 쓰는 빠르기입니다. 1h 과 5m 창이 둘 다 넘었습니다 — 지금도 계속되는 문제입니다. 서비스별 5xx · p99(High5xxRate · HighP99Latency)와 추적(Jaeger)에서 원인을 보고, 배포 직후면 ops/28 --rollback 을 먼저 생각하세요 (docs/91 §2)."
      - alert: SloErrorBudgetBurnSlow
        expr: |
          (
            slo:sli_error:ratio_rate6h > on (slo) (6 * (1 - slo:objective:availability))
            and on (slo) slo:sli_error:ratio_rate30m > on (slo) (6 * (1 - slo:objective:availability))
          )
          and on (slo) slo:requests:rate1h > 0.03
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "SLO {{ $labels.slo }} — 5xx 오류 예산을 6배 빠르기로 쓰고 있습니다(6h {{ $value | humanizePercentage }})"
          description: "30일 오류 예산의 5%를 6시간에 쓰는 빠르기입니다. 6h 과 30m 창이 둘 다 넘었습니다 — 지금도 계속되는 문제입니다. 서비스별 5xx · p99(High5xxRate · HighP99Latency)와 추적(Jaeger)에서 원인을 보고, 배포 직후면 ops/28 --rollback 을 먼저 생각하세요 (docs/91 §2)."
      - alert: SloLatencyBudgetBurnFast
        expr: |
          (
            slo:sli_slow:ratio_rate1h > on (slo) (14.4 * (1 - slo:objective:latency))
            and on (slo) slo:sli_slow:ratio_rate5m > on (slo) (14.4 * (1 - slo:objective:latency))
          )
          and on (slo) slo:requests:rate1h > 0.03
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "SLO {{ $labels.slo }} — 느린 요청 오류 예산을 14.4배 빠르기로 쓰고 있습니다(1h {{ $value | humanizePercentage }})"
          description: "30일 오류 예산의 2%를 1시간에 쓰는 빠르기입니다. 1h 과 5m 창이 둘 다 넘었습니다 — 지금도 계속되는 문제입니다. 서비스별 5xx · p99(High5xxRate · HighP99Latency)와 추적(Jaeger)에서 원인을 보고, 배포 직후면 ops/28 --rollback 을 먼저 생각하세요 (docs/91 §2)."
      - alert: SloLatencyBudgetBurnSlow
        expr: |
          (
            slo:sli_slow:ratio_rate6h > on (slo) (6 * (1 - slo:objective:latency))
            and on (slo) slo:sli_slow:ratio_rate30m > on (slo) (6 * (1 - slo:objective:latency))
          )
          and on (slo) slo:requests:rate1h > 0.03
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "SLO {{ $labels.slo }} — 느린 요청 오류 예산을 6배 빠르기로 쓰고 있습니다(6h {{ $value | humanizePercentage }})"
          description: "30일 오류 예산의 5%를 6시간에 쓰는 빠르기입니다. 6h 과 30m 창이 둘 다 넘었습니다 — 지금도 계속되는 문제입니다. 서비스별 5xx · p99(High5xxRate · HighP99Latency)와 추적(Jaeger)에서 원인을 보고, 배포 직후면 ops/28 --rollback 을 먼저 생각하세요 (docs/91 §2)."

  # ── Kafka 컨슈머 지연(docs/91 §3) — 지표는 common 의 KafkaConsumerMetricsAutoConfiguration 이 모든 컨슈머 팩토리에 단다 ──
  - name: kafka-consumer
    rules:
      - alert: KafkaConsumerLagHigh
        # 파티션마다 가장 큰 지연(records-lag-max). 1,000 건이 10분 — 사가 · 알림이 그만큼 늦다. 부하 측정 중이면 그것이 결과다.
        expr: max by (service, topic) (kafka_consumer_fetch_manager_records_lag_max) > 1000
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }} 의 {{ $labels.topic }} 컨슈머가 {{ $value }} 건 뒤처져 있습니다"
          description: "컨슈머가 따라가지 못합니다. 그 서비스의 CPU · DB 커넥션 대기(hikaricp_connections_pending) · DLT 재시도(KafkaDeadLetterPublished)를 보고, 파티션 수가 병렬도의 천장인지(ops/02 PARTITIONS) 확인하세요 (docs/91 §3, docs/89 §5-1)."
