# Loki — 로그 저장소 (docs/51 §4). 단일 바이너리, 파일시스템 저장, 로컬 관측 스택용.
#
# 서비스는 common 의 logback-spring.xml 로 ./logs/<서비스>.json 에 JSON 한 줄씩 쓰고(마스킹된 뒤),
# Alloy 가 그 파일을 읽어 여기로 보낸다. Grafana 에서 LogQL 로 찾고, 줄의 traceId 를 누르면 Jaeger
# 의 그 요청으로 넘어간다(데이터소스 derivedFields).
#
# 라벨은 service·level 두 개뿐이다. traceId·userId 같은 값은 라벨로 만들지 않는다 — 요청마다 다른
# 값을 라벨로 두면 스트림이 요청 수만큼 생겨 Loki 가 느려진다(카디널리티). 그런 값은
# `| json | traceId="..."` 로 줄 안에서 거른다.

auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # 7일. 서비스 쪽 파일도 14일·1GB 로 잘리므로 오래 둘 이유가 없다 — 사후 분석이 더 필요하면 늘린다.
  retention_period: 168h
  # 파일을 처음 읽을 때 며칠 치가 한꺼번에 들어온다. 오래된 줄을 거절하지 않게 보존 기간과 맞춘다.
  reject_old_samples: true
  reject_old_samples_max_age: 168h

# 로그 경보 (docs/51 §4i) — observability/loki-rules/*.yml 을 1분마다 평가해 Alertmanager 로 보낸다.
# 규칙 파일은 읽기 전용으로 붙고(/etc/loki/rules/fake), 평가용 사본은 데이터 볼륨에 둔다.
ruler:
  storage:
    type: local
    local:
      directory: /etc/loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: http://alertmanager:9093
  enable_alertmanager_v2: true
  enable_api: true
  ring:
    kvstore:
      store: inmemory

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
