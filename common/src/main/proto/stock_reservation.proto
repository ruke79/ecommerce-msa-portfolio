// 결제 전 재고 예약 — order-service → catalog-service 의 내부 RPC (docs/59 · docs/66).
//
// 같은 일을 하는 HTTP 경로(/api/internal/stock/reservations)가 그대로 있다. order-service 는 설정
// STOCK_RPC_TRANSPORT(http | grpc)로 둘 중 하나를 고른다 — 문제가 생기면 설정만 되돌린다.
//
// 계약의 규칙(스키마가 진실이다 — Avro 와 같다):
//   · 필드 번호는 바꾸지도, 다시 쓰지도 않는다. 지운 필드는 reserved 로 남긴다.
//   · 새 필드는 새 번호로만 더한다. 옛 클라이언트는 모르는 필드를 무시한다.
//   · "모자라다" 는 오류가 아니라 결과다(held=false + shortages). 상태 코드는 호출 자체의 실패에만 쓴다
//     (INVALID_ARGUMENT · PERMISSION_DENIED · UNAUTHENTICATED · UNAVAILABLE · DEADLINE_EXCEEDED).
//
// 서버의 호출자 판정은 HTTP 와 같은 규칙(INTERNAL_AUTH_PATH_RULES)을 쓴다 — gRPC 의 HTTP/2 경로가
// "/ecommerce.stock.v1.StockReservation/Reserve" 라서 경로 앞부분 규칙이 그대로 맞는다.
syntax = "proto3";

package ecommerce.stock.v1;

option java_multiple_files = true;
option java_package = "com.project.common.grpc.stock.v1";
option java_outer_classname = "StockReservationProto";

service StockReservation {
  // 주문의 모든 줄을 ttl 동안 잡는다. 이미 잡혀 있으면 수량 · 만료를 새로 쓴다(연장). 전부 아니면 전무.
  rpc Reserve(ReserveRequest) returns (ReserveResponse);
  // 푼다 — 여러 번 불러도 같다(없는 예약도 성공).
  rpc Release(ReleaseRequest) returns (ReleaseResponse);
}

message ReserveRequest {
  int64 order_id = 1;
  int64 ttl_seconds = 2;
  repeated Line lines = 3;
}

// 재고의 식별은 (상품, 색상, 사이즈 이름)이다 — 사이즈 SKU(docs/65)는 기록이지 키가 아니다.
message Line {
  int64 product_id = 1;
  int64 color_id = 2;
  string size = 3;   // 사이즈 없는 상품은 빈 문자열
  int32 qty = 4;
}

message ReserveResponse {
  bool held = 1;
  // 잡았을 때만. Unix epoch 밀리초 — google.protobuf.Timestamp 를 쓰지 않은 것은 well-known 타입 의존을
  // 늘리지 않기 위해서다(0 = 없음).
  int64 expires_at_epoch_millis = 2;
  repeated Shortage shortages = 3;
}

message Shortage {
  int64 product_id = 1;
  int64 color_id = 2;
  string size = 3;
  int32 requested = 4;
  int32 available = 5;
}

message ReleaseRequest {
  int64 order_id = 1;
}

message ReleaseResponse {
}
