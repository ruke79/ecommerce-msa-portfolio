# 테스트 전용 더미 값 — 비밀정보가 아니다.
#
# application-local.yml 이 "classpath:kafka-secrets.properties" 를 필수로 import 하는데
# 실제 파일(common/src/main/resources/kafka-secrets.properties)은 .gitignore 대상이다.
# 그 결과 새로 클론한 저장소나 CI 에서는 컨텍스트를 로딩하는 테스트가 전부
#   ConfigDataResourceNotFoundException: 'classpath:kafka-secrets.properties' cannot be found
# 로 깨진다(docs/14 B-20). 테스트 클래스패스에 더미 값을 두어 빌드가 비밀 파일에
# 의존하지 않게 한다. 운영 값은 여전히 저장소 밖에서 주입된다.
# [JA] テスト専用のダミー値 — シークレットではない。
#      application-local.yml が "classpath:kafka-secrets.properties" を必須で import するが、
#      実際のファイル(common/src/main/resources/kafka-secrets.properties)は .gitignore の対象である。
#      その結果、新しくクローンしたリポジトリや CI ではコンテキストを読み込むテストがすべて
#        ConfigDataResourceNotFoundException: 'classpath:kafka-secrets.properties' cannot be found
#      で壊れる(docs/14 B-20)。テストのクラスパスにダミー値を置き、ビルドがシークレットファイルに
#      依存しないようにする。運用値は引き続きリポジトリの外から注入される。
kafka.security.protocol=PLAINTEXT
kafka.url=localhost:29092
kafka.ssl.trust-store-location=classpath:dummy-truststore.jks
kafka.ssl.trust-store-password=dummy
kafka.ssl.key-store-location=classpath:dummy-keystore.p12
kafka.ssl.key-store-password=dummy
