dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	 // Redisson
    implementation 'org.redisson:redisson-spring-boot-starter:3.23.5' // 최신 안정화 버전으로 변경 가능
	
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'

	implementation 'org.springframework.cloud:spring-cloud-starter'
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'	
	implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
	implementation 'org.springframework.cloud:spring-cloud-starter-bootstrap'
	implementation 'org.springframework.cloud:spring-cloud-starter-config'
	
	implementation 'io.micrometer:micrometer-core' // (2)
	implementation 'io.micrometer:micrometer-registry-prometheus'

	// springfox는 Spring Boot 3 비호환(사장)이라 springdoc으로 교체
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'

	
	implementation 'com.auth0:java-jwt:3.19.4'   // 토큰 검증은 이것만 쓴다 — 쓰지 않던 jjwt 0.9.1·0.11.5 를 지웠다

	implementation 'org.springframework.kafka:spring-kafka'

	implementation project(':common')
	testImplementation(testFixtures(project(':common')))

	
	runtimeOnly 'org.postgresql:postgresql'
	// 스키마 마이그레이션: 파티셔닝 등 Hibernate ddl-auto가 만들 수 없는 DDL은 Flyway가 소유한다 (docs/09 P0)
	implementation 'org.flywaydb:flyway-core'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'		
	//runtimeOnly 'com.mysql:mysql-connector-j'
	

	
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
		
	testImplementation 'org.springframework.security:spring-security-test'
	
}

