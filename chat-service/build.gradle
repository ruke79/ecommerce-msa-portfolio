dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	 // Redisson
    // 🐛 3.23.5 의 redisson-spring-data-31 은 Spring Data Redis 3.1 용 — Boot 3.5(Spring Data Redis 3.5)에서 조건 있는 pExpire 가
    //    무한 재귀(StackOverflowError)했다: 상담 presence 의 expire · 끊김 처리가 죽어 STOMP 구독이 끊겼다(2026-11-20 실습).
    //    3.48+ 의 starter 가 redisson-spring-data-35 를 쓴다 — 시험 RedissonExpireRecursionTest. Boot 를 올리면 이 판도 맞춘다.
    // [JA] 3.23.5 は Spring Data Redis 3.1 用で、Boot 3.5 では条件付き pExpire が無限再帰した — 3.50.0(spring-data-35)に合わせる。
    implementation 'org.redisson:redisson-spring-boot-starter:3.50.0'
	
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'

	implementation 'org.springframework.cloud:spring-cloud-starter'
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'	
	implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
	implementation 'org.springframework.cloud:spring-cloud-starter-bootstrap'
	implementation 'org.springframework.cloud:spring-cloud-starter-config'
	
	implementation 'io.micrometer:micrometer-core' // (2)
	implementation 'io.micrometer:micrometer-registry-prometheus'

	// springfox는 Spring Boot 3 비호환(사장)이라 springdoc으로 교체
	// [JA] springfox は Spring Boot 3 非対応(開発終了)なので springdoc に置き換え
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'

	
	implementation 'com.auth0:java-jwt:3.19.4'   // 토큰 검증은 이것만 쓴다 — 쓰지 않던 jjwt 0.9.1·0.11.5 를 지웠다 ／ [JA] トークン検証はこれだけを使う — 使っていなかった jjwt 0.9.1・0.11.5 を削除した

	implementation 'org.springframework.kafka:spring-kafka'

	implementation project(':common')
	testImplementation(testFixtures(project(':common')))

	
	runtimeOnly 'org.postgresql:postgresql'
	// 스키마 마이그레이션: 파티셔닝 등 Hibernate ddl-auto가 만들 수 없는 DDL은 Flyway가 소유한다 (docs/09 P0)
	// [JA] スキーママイグレーション: パーティショニングなど Hibernate ddl-auto が作れない DDL は Flyway が所有する(docs/09 P0)
	implementation 'org.flywaydb:flyway-core'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'		
	//runtimeOnly 'com.mysql:mysql-connector-j'
	

	
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
		
	testImplementation 'org.springframework.security:spring-security-test'
	
}

