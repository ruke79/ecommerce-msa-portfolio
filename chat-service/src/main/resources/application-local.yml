frontend:
  # SockJS · WebSocket 이 허용하는 출처(WebSocketConfiguration.setAllowedOrigins) — 브라우저가 여는 주소와 같아야 한다.
  # 🐛 2026-11-20 실습: 이 값만 localhost:3000 으로 고정돼 shop.lab 에서 SockJS 가 모두 403(채팅 입력이 회색) — order · user 처럼
  #    APP_PUBLIC_URL 을 따른다. [JA] SockJS の許可オリジン — ブラウザが開くアドレスと同じでなければならない(APP_PUBLIC_URL に従う)。
  url: ${FRONTEND_URL:${APP_PUBLIC_URL:https://localhost:3000}}

server:
  port: 8086

  ssl:    
      key-store: ${LOCAL_KEY_STORE_PATH}    
      key-store-type: PKCS12
      key-store-password: ${LOCAL_KEY_STORE_PASSWORD}
      key-password: ${LOCAL_KEY_PASSWORD}

# Kafka 접속 설정은 common/application-common.yml 이 소유한다.
#
# 여기에는 개발자 PC 의 절대 경로가 그대로 박혀 있었다:
#     trust-store-location: file:E:/github/amazon-clone-msa/.../local_truststore.jks
# 그 경로는 다른 어떤 머신에도 존재하지 않으므로, 이 블록은 protocol: "SSL" 을 켜 놓은 채
# 존재하지도 않는 스토어를 가리키고 있었다. 로컬 브로커가 PLAINTEXT 라 조용히 넘어갔을 뿐이다.
#
# 이제 KAFKA_URL / KAFKA_SECURITY_PROTOCOL / KAFKA_SSL_* 환경변수로 주입한다.
# 파일은 ops/07-issue-certificates.sh 가 만들고, certs.env 를 source 하면 값이 채워진다(docs/18).
# [JA] Kafka 接続設定は common/application-common.yml が所有する。
#      ここには開発者 PC の絶対パスがそのまま埋め込まれていた(trust-store-location: file:E:/...)。
#      そのパスは他のどのマシンにも存在しないので、このブロックは protocol: "SSL" を有効にしたまま
#      存在しないストアを指していた。ローカルブローカーが PLAINTEXT なので黙って通っていただけである。
#      今は KAFKA_URL / KAFKA_SECURITY_PROTOCOL / KAFKA_SSL_* 環境変数で注入する。
#      ファイルは ops/07-issue-certificates.sh が作り、certs.env を source すれば値が埋まる(docs/18)。

eureka:
    instance:
      prefer-ip-address: true
      instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
      non-secure-port-enabled : false
      secure-port-enabled : true
      secure-port : 8086


feign:
  # 서비스 간 Feign 호출 대상. 기존에는 어디에도 정의돼 있지 않아
  # @FeignClient(url="${feign.*-url}") 해석 실패로 기동 자체가 불가능했다.
  # 환경변수(FEIGN_*_URL, k8s ConfigMap)로 오버라이드 가능.
  # [JA] サービス間 Feign 呼び出しの宛先。以前はどこにも定義されておらず、
  #      @FeignClient(url="${feign.*-url}") の解決に失敗して起動自体ができなかった。
  #      環境変数(FEIGN_*_URL, k8s ConfigMap)で上書き可能。
  user-url: ${FEIGN_USER_URL:https://localhost:8080}
  # 타임아웃은 여기 두지 않는다 — common/application-common.yml 의
  # spring.cloud.openfeign.client.config.default 가 전 서비스의 유일한 정의다(docs/37 §2.1).
  # 예전에 여기 있던 feign.client.config.* 는 OpenFeign 4.x 가 읽지 않는 키였다.
  # [JA] タイムアウトはここに置かない — common/application-common.yml の
  #      spring.cloud.openfeign.client.config.default が全サービス唯一の定義である(docs/37 §2.1)。
  #      以前ここにあった feign.client.config.* は OpenFeign 4.x が読まないキーだった。

spring:
    application:
      name: chat-service

    config:
      import: "classpath:application-common.yml, optional:classpath:kafka-secrets.properties"    
      #import: optional:configserver:https://localhost:8888

    datasource:
      # 커넥션 풀 산정 (docs/19).
      # 기본값 10 을 그대로 두면 데이터소스 8개 × 10 = 80 커넥션이고, HPA 로 레플리카가
      # 2개만 돼도 160 으로 PostgreSQL 기본 max_connections(100)를 **산술적으로 초과**한다.
      # 그 순간의 증상은 '느려짐'이 아니라 'FATAL: sorry, too many clients already' —
      # 늦게 뜬 파드가 통째로 기동 실패한다.
      # 5 × 8 데이터소스 × 3 레플리카 = 120. max_connections 는 200 으로 올릴 것(docs/19 §3).
      # 풀은 크다고 빠르지 않다 — 커넥션당 DB 측 프로세스가 하나씩 붙는다.
      # [JA] コネクションプールの算定(docs/19)。
      #      デフォルト 10 のままだとデータソース 8 個 × 10 = 80 コネクションで、HPA でレプリカが
      #      2 個になるだけで 160 となり PostgreSQL デフォルトの max_connections(100)を**算術的に超過**する。
      #      その瞬間の症状は「遅くなる」ではなく 'FATAL: sorry, too many clients already' —
      #      遅れて立ち上がった Pod が丸ごと起動失敗する。
      #      5 × 8 データソース × 3 レプリカ = 120。max_connections は 200 に上げること(docs/19 §3)。
      #      プールは大きいほど速いわけではない — コネクションごとに DB 側のプロセスが一つずつ付く。
      hikari:
        maximum-pool-size: ${DB_POOL_SIZE:5}
        minimum-idle: ${DB_POOL_MIN_IDLE:2}
        # 풀 고갈을 조용히 기다리지 않고 빠르게 실패시킨다(기본 30초는 요청 스레드를 묶어 둔다).
        # [JA] プール枯渇を黙って待たずに素早く失敗させる(デフォルトの 30 秒はリクエストスレッドを縛る)。
        connection-timeout: 5000
        # 커넥션 누수 감지 — 기본 끔(0). 켜면 커넥션을 빌릴 때마다 스택 추적 예외를 하나씩 만든다(2026-10-23 프로파일: catalog CPU 의 3.9%,
        # docs/83 §5 · B-104). 의심될 때만 DB_LEAK_DETECTION_MS=20000 으로 켠다. [JA] リーク検出は既定オフ — 借りるたびに例外を作る。
        leak-detection-threshold: ${DB_LEAK_DETECTION_MS:0}
        max-lifetime: 1200000
      # pay-service 와 같은 물리 DB(paydb)를 가리키고 있었다 — 서비스별 DB 원칙 위반.
      # k8s/46-chat-service.yaml 은 이미 chatdb 로 덮어쓰고 있어 로컬만 어긋나 있었다.
      # B-12(잘못된 dialect)로 chat 테이블이 애초에 생성된 적이 없어 이전은 무해하다.
      # [JA] pay-service と同じ物理 DB(paydb)を指していた — サービスごとの DB 原則違反。
      #      k8s/46-chat-service.yaml はすでに chatdb で上書きしており、ローカルだけがずれていた。
      #      B-12(誤った dialect)で chat テーブルがそもそも作られたことがないので、移行は無害である。
      url: jdbc:postgresql://localhost:5435/chatdb?sslmode=require
      username: product
      password: ${LOCAL_DB_PASSWORD}
      properties:
        ssl: true
        sslfactory: org.postgresql.ssl.DefaultJavaSSLFactory
        sslrootcert: ${LOCAL_KEY_STORE_PATH}
        sslpassword: ${LOCAL_KEY_PASSWORD}
    
    driver-class-name: org.postgresql.Driver

    jpa:
      hibernate:
         ddl-auto: ${DDL_AUTO:validate}
      properties:
             hibernate:
                 format_sql: false
                 #use_sql_comments: true
                 #type: trace
                 # 데이터소스는 PostgreSQL 인데 dialect 만 MySQL 이었다. Hibernate 가 MySQL DDL 을
                 # 만들어 보내 'syntax error at or near "engine"' / "auto_increment" 로 모든 테이블
                 # 생성이 실패했고, 결과적으로 chat 스키마 테이블이 하나도 만들어지지 않았다(docs/14 B-12).
                 # [JA] データソースは PostgreSQL なのに dialect だけ MySQL だった。Hibernate が MySQL の DDL を
                 #      作って送り、'syntax error at or near "engine"' / "auto_increment" ですべてのテーブル
                 #      作成が失敗し、結果として chat スキーマのテーブルが一つも作られなかった(docs/14 B-12)。
                 dialect : org.hibernate.dialect.PostgreSQLDialect

    data:
      mongodb:
        client: mongodb://admin:${LOCAL_DB_PASSWORD}@localhost:27017?ssl=true
        name: chat
        username: admin
        password: ${LOCAL_DB_PASSWORD}        
        cacert: ${LOCAL_CACERT_PATH}
        keystore: ${LOCAL_KEY_STORE_PATH}
        # 오타(LOCAL_KEY_STOE_PASSWORD)로 인해 MongoSslConfig 의 @Value 가 해석되지 못해
        # 'Could not resolve placeholder' 로 기동 자체가 불가능했다(docs/14 B-10).
        # [JA] タイポ(LOCAL_KEY_STOE_PASSWORD)のせいで MongoSslConfig の @Value が解決できず
        #      'Could not resolve placeholder' で起動自体が不可能だった(docs/14 B-10)。
        keystorePassword : ${LOCAL_KEY_STORE_PASSWORD}
        auto-index-creation: true
      redis:       
          ssl:
            enabled : false
            cacert : ${LOCAL_CACERT_PATH}
            # 코드(RedisCacheConfig)가 요구하는 키(기존엔 cert/key 라는 다른 이름만 존재).
            # [JA] コード(RedisCacheConfig)が要求するキー(以前は cert/key という別の名前だけが存在した)。
            keystore : ${LOCAL_KEY_STORE_PATH:}
            truststore : ${LOCAL_TRUST_STORE_PATH:}
            cert : ${LOCAL_CRT_PATH}
            key : ${LOCAL_KEY_PATH}
            storePassword : ${LOCAL_KEY_PASSWORD} 
          lettuce:
            pool:
              max-active: 5
              max-idle: 5
              min-idle: 2  
          host: localhost
          port: 6379
          password: ${LOCAL_DB_PASSWORD}

    app:    
      jwtSecret: ${JWT_SECRET_KEY}
      # 서명 키 링(docs/68 §17) — 비워 두면 JWT_SECRET_KEY 하나(kid "legacy"). 교체는 ops/46. 세 서비스(user · gateway · chat)가 같은 값이어야 한다.
      # [JA] 署名鍵リング(docs/68 §17) — 空にすると JWT_SECRET_KEY 一つ(kid "legacy")。交換は ops/46。三つのサービス(user・gateway・chat)が同じ値でなければならない。
      jwtSigningKeys: ${JWT_SIGNING_KEYS:}
      jwtActiveKid: ${JWT_ACTIVE_KID:}
      jwtAcceptLegacy: ${JWT_ACCEPT_LEGACY:true}

logging:
  level:
    root: info
    org.springframework.batch: ${LOG_LEVEL_BATCH:info}
    com.project.chatserver: ${LOG_LEVEL_APP:info}
    org.springframework.jdbc: ${LOG_LEVEL_SQL:warn}
    org.springframework.orm.jpa: ${LOG_LEVEL_SQL:warn}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:warn}

# Elasticsearch 클라이언트 패키지의 로깅 레벨을 DEBUG로 설정
    #co.elastic.clients: DEBUG
# HTTP 요청/응답 헤더 및 바디를 보려면 TRACE 레벨 설정
# 이 설정은 Elasticsearch 클라이언트가 내부적으로 사용하는 Apache HTTP 클라이언트에 대한 로그를 활성화합니다.
    #org.apache.http: DEBUG
    #apache.http.wire: DEBUG
# [JA] Elasticsearch クライアントパッケージのログレベルを DEBUG に設定。
#      HTTP リクエスト/レスポンスのヘッダとボディを見るには TRACE レベルを設定する。
#      この設定は Elasticsearch クライアントが内部で使う Apache HTTP クライアントのログを有効にする。
  file:
    path: ./logs
    name: ${logging.file.path}/chat_service.json   # JSON 한 줄씩 — common 의 logback-spring.xml 이 쓴다(docs/51) ／ [JA] JSON を 1 行ずつ — common の logback-spring.xml が書く(docs/51)
  # 출력 패턴은 common 의 logback-spring.xml 이 정한다 — 메시지·예외를 %mask 로 감싸 민감정보를 가린다.
  # 여기 logging.pattern 을 두어도 쓰이지 않는다(가드 B-57).
  # [JA] 出力パターンは common の logback-spring.xml が決める — メッセージ・例外を %mask で包み機密情報を隠す。
  #      ここに logging.pattern を置いても使われない(ガード B-57)。

