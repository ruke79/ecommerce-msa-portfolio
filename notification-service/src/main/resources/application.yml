spring:
  profiles:
    active: local
    group:
      prd:
        - prd
      dev:
        - dev
      local:
        - local

  # 이 모듈에는 @Scheduled 작업이 셋이다 — SMS 발송(5초), 메일 발송(5초), 메일 스크럽(1시간).
  # 스프링의 기본 스케줄러는 **스레드 하나**라(TaskSchedulingProperties.Pool.size = 1) 셋이
  # 같은 스레드를 번갈아 쓴다. SMS 배치가 게이트웨이 타임아웃에 걸려 있는 동안 메일은
  # 한 통도 나가지 못하고, 그 반대도 같다. 작업 수만큼 스레드를 준다.
  #
  # 같은 작업끼리는 fixedDelay 라 겹치지 않고, 서로 다른 작업이 겹치는 것은 처음부터 안전하게
  # 설계돼 있다 — 둘 다 FOR UPDATE SKIP LOCKED 로 자기 몫을 선점한다(docs/21).
  task:
    scheduling:
      pool:
        size: 3
      thread-name-prefix: sched-