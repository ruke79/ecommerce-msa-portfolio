spring:
  # 매니페스트도 SPRING_APPLICATION_NAME 으로 주지만 로컬 실행은 여기서 — 없으면 Eureka 에 UNKNOWN 으로 등록된다.
  # [JA] マニフェストも SPRING_APPLICATION_NAME で渡すが、ローカル実行はここで — なければ Eureka に UNKNOWN として登録される。
  application:
    name: config-server
  profiles:
    active: local
    group:
      prd:
        - prd      
      dev:
        - dev
      local:
        - local