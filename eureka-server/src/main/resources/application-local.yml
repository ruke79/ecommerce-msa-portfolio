# Standalone Eureka Server — 피어 없이 한 대(k8s/30 이 replicas: 1 로 고정하고 그 이유를 적었다).
server:
  port: 8761

  # HTTPS 로 받는다 — key-store 만 주면 Boot 가 TLS 를 켠다. 클라이언트 인증서 요청(want)은 매니페스트의 SERVER_SSL_CLIENT_AUTH.
  ssl:
   key-store: ${LOCAL_KEY_STORE_PATH}
   key-store-password: ${LOCAL_KEY_STORE_PASSWORD}
   key-password: ${LOCAL_KEY_PASSWORD}
      

spring:
  application:
    name: discovery-service


eureka:
  server:
    # self-preservation 을 끈다 — 하트비트가 줄어도 리스 만료(90초)를 계속한다. 단일 노드 · 소규모에서는 "죽은 주소가 레지스트리에
    # 오래 남아 호출이 그쪽으로 가는 것" 이 더 흔하고 더 아프다. 대가: 네트워크가 잠깐 끊기면 멀쩡한 인스턴스도 만료돼 목록에서
    # 빠진다(클라이언트는 로컬 캐시로 버티다 다음 하트비트에 다시 등록된다). 피어를 두면 다시 검토한다.
    # [JA] self-preservation を切る — 単一ノード・小規模では死んだアドレスが残る方が痛い。代わりに一時的な断で正常なインスタンスも外れる。
    enable-self-preservation: false
    # 🐛 예전에는 여기에 peer-awareness.enabled · registry-sync-interval-seconds 가 있었다 — EurekaServerConfigBean 에 없는 속성이라
    # 오류 없이 무시됐다(EurekaServerPropertiesTest 가 이제 막는다). 피어 구성은 eureka.client.service-url.defaultZone 에 상대 노드를
    # 적어서 한다.
    peer-node-read-timeout-ms: 30000

  client:
    # standalone — 자기에게 등록하지도, 등록부를 받아 가지도 않는다.
    register-with-eureka: false
    fetch-registry: false
    # 쓰이지 않는 값이 아니다 — 서버의 피어 노드 목록(PeerEurekaNodes)이 이 URL 들을 읽는다. 지우면 기본값
    # http://localhost:8761/eureka/(평문)가 들어가 동작이 바뀔 수 있으므로 그대로 둔다. 피어를 둘 때 상대 노드를 여기에 적는다.
    serviceUrl:
      defaultZone: https://localhost:8761/eureka/

    
    # Spring Boot는 이 설정을 기반으로 HTTPS 연결을 자동으로 구성합니다.
    #
    # ⚠️ 여기의 경로에는 file: 접두어가 **반드시** 필요하다. server.ssl.* 과 달리
    # eureka.client.tls.* 는 스프링 Resource 로 해석되는데, 웹 애플리케이션에서 접두어 없는
    # 경로는 ServletContext 상대 경로로 취급된다. 접두어가 없으면 파일이 멀쩡히 존재해도
    #   KeyStore not exists: ServletContext resource [/.../truststore.p12]
    # 로 기동이 죽는다. (RedisCacheConfig 는 코드에서 "file:" 를 직접 붙이므로,
    #  환경변수 자체는 접두어 없는 순수 경로로 둔다.)
    tls:
      enabled: true
      key-store: file:${LOCAL_KEY_STORE_PATH}
      key-store-password: ${LOCAL_KEY_STORE_PASSWORD}
      key-password: ${LOCAL_KEY_PASSWORD}

      # 다른 Peer Eureka Server의 인증서를 신뢰하기 위한 Truststore 설정
      # Standalone 모드라도 자기 자신의 인증서를 신뢰해야 하므로 필요합니다.
      trust-store: file:${LOCAL_TRUST_STORE_PATH}
      trust-store-password: ${LOCAL_KEY_STORE_PASSWORD}


# 로깅 설정 — 🐛 예전에는 이 블록이 두 칸 들여쓰여 `eureka:` 아래(eureka.logging.*)에 들어가 있어
# 스프링이 읽지 않았다. 레벨도 파일도 적용되지 않았고, 대신 이 모듈의 logback-spring.xml 이
# Netflix 로거를 DEBUG 로 고정하고 있었다. 이제 최상위에 두고, 출력 형식·마스킹은 common 의
# 공통 설정(logback-spring.xml)을 쓴다.
logging:
  level:
    root: info
    # Eureka 관련 로그를 자세히 보고 싶을 때 LOG_LEVEL_EUREKA=debug
    com.netflix.eureka: ${LOG_LEVEL_EUREKA:info}
    com.netflix.discovery: ${LOG_LEVEL_EUREKA:info}
    org.springframework.cloud.netflix: ${LOG_LEVEL_EUREKA:info}
  file:
    path: ./logs
    name: ${logging.file.path}/discovery-service.json   # JSON 한 줄씩 — common 의 logback-spring.xml 이 쓴다(docs/51)
  # 출력 패턴은 common 의 logback-spring.xml 이 정한다(가드 B-57).
