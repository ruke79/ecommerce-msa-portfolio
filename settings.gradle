plugins {
    // Apply the foojay-resolver plugin to allow automatic download of JDKs
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'amazon-clone-msa'

include('common')
include('cart-service')
include('catalog-service')
include('coupon-service')
include('chat-service')
include('order-service')
include('notification-service')
include('delivery-service')
// 주문 결제 사가의 읽기 모델 — Kafka Streams(exactly_once_v2). DB 없음(docs/38 §1.17).
include('saga-projection')
include('pay-service')
include('user-service')
include('eureka-server')
include('config-server')
include('gateway-server')

// 사가 전 구간(주문→결제→재고)을 실제 서비스 컨테이너로 검증하는 모듈.
// 서비스 모듈 3개의 application-local.yml 이 클래스패스에서 충돌하므로, 앱을 이 JVM 에
// 올리지 않고 **컨테이너로 띄워** 검증한다.
include('e2e-tests')
