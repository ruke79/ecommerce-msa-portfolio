resilience4j:
  timelimiter:
    configs:
      default:
        # ⚠️ 이 값을 적지 않으면 Resilience4j 기본값 **1초**가 적용된다. 그 1초는
        #    JVM 서비스 호출에 턱없이 짧다 — Eureka 로 인스턴스를 고르고 TLS 핸드셰이크를
        #    하고 JPA 쿼리까지 도는 시간이다. 실제로 /api/content/home 이 파드 직접 호출로는
        #    0.3초인데 게이트웨이로는 전부 503 이 났다. 게이트웨이 로그에 그대로 남는다:
        #    "Did not observe any item or terminal signal within 1000ms in 'circuitBreaker'".
        #
        #    10초는 아래 slow-call-duration-threshold 와 같은 값이다. 그보다 짧으면
        #    "느린 호출"이 집계되기 전에 잘려 나가 서킷이 느려짐을 영영 학습하지 못한다.
        #    프론트 axios 기본 타임아웃(15초)보다는 짧아야 사용자가 우리 쪽 응답을 받는다.
        timeout-duration: ${GATEWAY_TIMEOUT:10s}
        cancel-running-future: false

  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        allow-health-indicator-to-fail: false
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 10s 
        wait-duration-in-open-state: 10s
        automatic-transition-from-open-to-half-open-enabled: false
        permitted-number-of-calls-in-half-open-state:
        record-exceptions:
          - java.util.concurrent.TimeoutException
          - org.springframework.cloud.gateway.support.NotFoundException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException 

    instances:
      defaultCircuitBreaker:
        baseConfig: default  
        failure-rate-threshold: 50


management:
  endpoint:
    gateway:
      # enabled 는 Boot 3.4 부터 사용 중단 — access 로
      access: unrestricted
  endpoints:
    web:
      exposure:
        # 🔒 `gateway` 와 `beans` 를 뺐다.
        #   · gateway → 라우트 목록 조회뿐 아니라 **POST 로 라우트를 추가·삭제**할 수 있다.
        #     인증 없이 열려 있으면 트래픽을 임의의 목적지로 돌릴 수 있는 셈이다.
        #   · beans   → 빈 이름과 클래스 전체를 노출해 내부 구조를 그대로 알려준다.
        #   · refresh/busrefresh 는 설정 리로드를 트리거하는 쓰기 엔드포인트다. 운영상
        #     필요하면 남기되 반드시 인증 뒤에 두어야 한다 — 지금은 남겨 두고 별도 과제로 뺀다.
        include: health, info, metrics, prometheus, refresh, busrefresh

    
    
logging:
  level:
    root: info
    org.springframework.batch: ${LOG_LEVEL_BATCH:info}
    com.project.gatewayserver: ${LOG_LEVEL_APP:info}
    org.springframework.jdbc: ${LOG_LEVEL_SQL:warn}
    org.springframework.orm.jpa: ${LOG_LEVEL_SQL:warn}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:warn}

  file:
    path: ./logs
    name: ${logging.file.path}/gateway_service.json   # JSON 한 줄씩 — common 의 logback-spring.xml 이 쓴다(docs/51)
  # 출력 패턴은 common 의 logback-spring.xml 이 정한다 — 메시지·예외를 %mask 로 감싸 민감정보를 가린다.
  # 여기 logging.pattern 을 두어도 쓰이지 않는다(가드 B-57).
