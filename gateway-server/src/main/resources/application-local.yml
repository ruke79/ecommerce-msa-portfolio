  #   bundle:
  #     jks:
  #       eureka-client:
  #         truststore:
  #           location: ${LOCAL_KEY_STORE_PATH}
  #           password: ${LOCAL_KEY_STORE_PASSWORD}
  #           type: PKCS12
  #       gateway:
  #         key:
  #           # alias는 주석 처리하고, password는 환경 변수로 설정
  #           # alias: 
  #           password: ${LOCAL_KEY_PASSWORD}
  #         keystore:
  #           location: ${LOCAL_KEY_STORE_PATH}
  #           password: ${LOCAL_KEY_STORE_PASSWORD}
  #           type: PKCS12


spring:
  application:
    name: gateway-server
   
  config:
      import: "classpath:application-common.yml"    
      #import: optional:configserver:https://localhost:8888


  app:    
     jwtSecret: ${JWT_SECRET_KEY}
     # 서명 키 링(docs/68 §17) — 비워 두면 JWT_SECRET_KEY 하나(kid "legacy"). 교체는 ops/46. 세 서비스(user · gateway · chat)가 같은 값이어야 한다.
     jwtSigningKeys: ${JWT_SIGNING_KEYS:}
     jwtActiveKid: ${JWT_ACTIVE_KID:}
     jwtAcceptLegacy: ${JWT_ACCEPT_LEGACY:true}
  main:
    # 서블릿 · Tomcat 은 build.gradle.kts 가 클래스패스에서 뺀다 — 이것은 의도를 적어 두는 것(Netty 서버, NettyServerTest).
    # [JA] サーブレット・Tomcat は build.gradle.kts がクラスパスから外す — これは意図の明記(Netty サーバー)。
    web-application-type: reactive

  # RequestRateLimiter 토큰 버킷 저장소. Redis 미가동 시 게이트웨이가 트래픽을 처리하지 못하므로
  # 운영 환경에서는 Redis 가용성(복제/센티넬)을 반드시 확보한다. (docs/03 §장애 시나리오 참조)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 다른 서비스는 전부 LOCAL_DB_PASSWORD 로 Redis 에 인증하는데 게이트웨이만 비밀번호를
      # 읽지 않았다. requirepass 가 걸린 Redis(운영 표준) 앞에서는 레이트리미터의 Redis 접속이
      # 조용히 실패해 토큰버킷이 동작하지 않는다 — 스테이징 리허설에서 드러난 설정 드리프트.
      password: ${REDIS_PASSWORD:${LOCAL_DB_PASSWORD:}}
      # 🐛 명령 타임아웃이 없었다 — Lettuce 기본 60초. Redis 가 잠깐 끊기면(파드 재시작) 속도 제한의 명령이 버퍼에 쌓여
      #    **모든 API 요청**이 최대 60초 멈췄다(속도 제한은 CircuitBreaker 의 10초 TimeLimiter 보다 앞이라 그것도 받지 못한다).
      #    짧게 끊으면 RedisRateLimiter 가 오류를 "통과" 로 다룬다(fail-open) — 제한이 잠깐 풀리는 쪽이 전면 정지보다 낫다.
      # [JA] コマンドタイムアウトがなかった(Lettuce 既定 60 秒)。Redis が一瞬切れると全 API が最大 60 秒止まった。短く切れば fail-open。
      timeout: ${GATEWAY_REDIS_TIMEOUT:500ms}
      connect-timeout: ${GATEWAY_REDIS_CONNECT_TIMEOUT:1s}

  cloud:
    gateway:
      # Spring Cloud Gateway 4.3(2025.0)부터 서버 설정은 spring.cloud.gateway.server.webflux 아래다. 옛 위치(spring.cloud.gateway.*)는
      # 기동 때 옮겨 읽어 주지만(경고) 다음 메이저에서 빠진다 — 여기로 옮겼다(docs/61).
      server:
        webflux:
          httpclient:
            ssl:
                # 예전에는 true 로 고정돼 있었다. 그 한 줄이 게이트웨이의 다운스트림 TLS 검증을
                # **전부 무력화**한다 — 아무 인증서나 통과하므로 결제 트래픽 구간에서 MITM 이 성립한다.
                # (아래 trust-store 를 같이 써 놨지만, useInsecureTrustManager 가 true 면 무시된다.)
                #
                # 이제 기본값은 검증을 켜는 쪽이다. 서비스 인증서가 같은 CA 로 서명돼 있고
                # SAN 에 서비스 이름이 들어 있으면 그대로 동작한다 — ops/07-issue-certificates.sh 가
                # 정확히 그런 인증서를 만든다(docs/18).
                # 외부 인증서를 쓰는 과도기에만 GATEWAY_INSECURE_TRUST_MANAGER=true 로 임시 우회한다.
                useInsecureTrustManager: ${GATEWAY_INSECURE_TRUST_MANAGER:false}
                # Truststore 설정을 추가하여 Eureka Server의 인증서를 신뢰하도록 함
                trust-store: file:${LOCAL_TRUST_STORE_PATH}
                trust-store-password: ${LOCAL_KEY_STORE_PASSWORD}
                # 🔒 백엔드로 넘길 때 게이트웨이 자기 인증서(CN=gateway-server, ops/38 · k8s/96)를 클라이언트 인증서로 낸다.
                # 받는 쪽(InternalCallerFilter)은 신원 헤더(User-Id · User-Role · User-Email)를 이 인증서로 온 요청에서만
                # 믿는다 — 예전에는 헤더만 있으면 믿어서 클러스터 안의 파드가 헤더를 직접 붙여 관리자가 될 수 있었다(docs/57 §16).
                # 비우면(로컬 · 인증서 없는 환경) 인증서를 내지 않는다 — 받는 쪽 identity-mode 가 observe 면 경고만 남는다.
                # [JA] バックエンドへ渡すとき、ゲートウェイ自身の証明書(CN=gateway-server)をクライアント証明書として提示する。
                #      受け側は身元ヘッダーをこの証明書で来たリクエストでのみ信じる。空なら提示しない。
                key-store: ${GATEWAY_CLIENT_KEY_STORE:}
                key-store-type: PKCS12
                key-store-password: ${LOCAL_KEY_STORE_PASSWORD}
                # SSL 번들 설정 제거
                # bundle: eureka-client
            # 🐛 연결 풀 — 백엔드가 이미 닫은 연결을 재사용해 503 이 나던 것.
            #   Reactor Netty 는 기본값으로 쉬는 연결을 **무기한** 풀에 둔다. 백엔드(Tomcat)는 60초 쉰 연결을 닫는다(keep-alive 기본).
            #   그 사이 게이트웨이가 닫힌 연결을 꺼내 요청을 보내면 "Connection prematurely closed BEFORE response" →
            #   서킷 브레이커 fallback → 브라우저에는 503. 백엔드 재시작 뒤 옛 파드로 향한 연결도 같은 식으로 터진다.
            #   백엔드의 keep-alive(60초)보다 짧게 쉰 연결을 버리고, 오래된 연결은 수명으로 교체한다
            #   (GatewayPropertiesLocationTest 가 60초 미만인지 본다).
            pool:
                max-idle-time: ${GATEWAY_POOL_MAX_IDLE:30s}
                max-life-time: ${GATEWAY_POOL_MAX_LIFE:5m}
                eviction-interval: 15s

          default-filters:
           - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
           # 🔒 신원 헤더(User-Id/User-Email/User-Role)를 지우는 일은 **여기 있으면 안 된다.**
           #
           # 예전에는 여기에 RemoveRequestHeader=User-Id 세 줄이 있었고, "default-filters 는
           # 라우트 필터보다 먼저 실행되므로 지운 뒤 JwtAuthorization 이 다시 넣는다" 는
           # 주석이 붙어 있었다. 그 전제가 **정반대**였다:
           #
           #   RouteDefinitionRouteLocator.loadGatewayFilters 는 각 필터를 그 목록 안에서의
           #   인덱스+1 로 감싸고(OrderedGatewayFilter(filter, i+1)), getFilters 는
           #   default-filters(order 1..5) 다음에 라우트 필터를 **다시 1부터** 담아 정렬한다.
           #   그래서 JwtAuthorization(라우트 1번 → order 1)이 먼저 돌고,
           #   RemoveRequestHeader=User-Id(기본 2번 → order 2)가 그 뒤에 지워 버린다.
           #
           # 결과는 조용한 전면 장애였다 — 검증된 신원이 하위 서비스에 하나도 도달하지 않아
           # JwtAuthorization 이 붙은 모든 라우트가 401 을 받았다. 게이트웨이 로그에는 필터가
           # 정상 호출된 것으로 찍혀서 원인이 드러나지 않았다.
           #
           # 지금은 IdentityHeaderScrubFilter(GlobalFilter, HIGHEST_PRECEDENCE)가 한다.
           # 전역 필터는 자기 order 를 그대로 쓰므로 필터 개수·나열 순서에 기대지 않는다.
           # (되돌리면 ConfigurationGuardrailTest B-53 이 막는다.)
           # 🔒 유입 트래픽 제한(RequestRateLimiter)은 여기가 아니라 **라우트마다 하나씩** 둔다(아래 &rate-default, 가드 B-84).
           #
           # 🐛 예전에는 여기 하나 + 로그인 라우트에 하나였다. RedisRateLimiter 는 설정을 **라우트 id 로** 저장하고(나중에 묶인 것이
           #    이긴다) Redis 키도 라우트 id + 버킷 키라, 한 라우트의 두 필터가 같은 버킷에서 요청마다 토큰을 **두 개** 썼다 —
           #    로그인 라우트는 실효 초당 0.5회 · 버스트 5 였고, 같은 라우트의 리뷰 보기 · 토큰 갱신이 그 버킷을 비워 갱신이 429 →
           #    화면이 로그아웃시켰다. 또 default-filters 는 라우트 필터보다 앞이라 JWT 필터가 User-Id 를 넣기 전에 돌아,
           #    로그인한 사용자도 IP 하나에 묶였다. 라우트 필터로 두면 JwtAuthorization 뒤에 놓을 수 있다.
           # [JA] 流入制限はここではなくルートごとに一つ置く。以前はここと ログインルートの二つで、同じバケットからリクエストごとに
           #      トークンを二つ使い、レビュー閲覧 · トークン更新がバケットを空にしてログアウトさせていた。
      
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:              
                  - 'https://localhost:3000'                                                                                            
                allow-credentials: true 
                allowedHeaders: 
                   - 'Authorization'
                   - 'Content-Type'
                   - 'Cache-Control'
                   - 'Connection'
                   - 'X-Accel-Buffering'
                   - 'MultiLogin'
                   # 주문 생성 멱등 키(Summary.jsx) — 로컬은 출처가 달라 사전 요청이 이 헤더를 묻는다.
                   - 'Idempotency-Key'
                   # 결제 시도 키(Payment.jsx, order V27).
                   - 'Payment-Attempt'
                allowedMethods: 
                  - PUT
                  - GET
                  - POST
                  - DELETE
                  - OPTIONS
                exposedHeaders: 
                  - 'ACCESS'
                  - 'Set-Cookie'
                  - 'MultiLogin'

          # 🔒 자동 라우트(discovery locator)는 끈다(docs/57 §9, 가드 B-64). 켜 두면 Eureka 의 서비스마다
          #    `/USER-SERVICE/**`·`/ORDER-SERVICE/**` 라우트가 생기는데, 거기에는 **JWT 필터가 없다.** 신원 헤더는 전역
          #    필터가 지우므로 하위 서비스에는 "헤더 없음 = 내부 호출" 로 도착한다 — InternalCallGuard 가 내부로 믿는 모양이다.
          #    지금은 터널이 소문자 `…-service` 접두사만 넘겨 밖에서 닿지 않지만, 그것은 터널 설정 한 줄에 기댄 방어였다.
          #    쓰는 곳도 없다 — 화면은 아래의 명시 라우트만, 서비스끼리는 Eureka(lb://)로 직접 부른다.
          discovery:
            locator:
              enabled: false
      
          routes:        

            # 🐛 라우트 id 가 둘 다 `user-service` 였다(docs/57 §4). 레이트리미터는 설정을 라우트 id 로 저장한다 —
            #    같은 id 의 아래 라우트(기본값 20/s)가 이 라우트의 로그인 제한(1/s, 버스트 10)을 덮을 수 있었다. 라우트 id 는
            #    유일해야 한다(ConfigurationGuardrailTest B-62).
            - id: user-service-public
              uri: lb://user-service
              predicates:
                  # oauth2/** 는 소셜 로그인 시작(/oauth2/authorization/{provider}),
                  # login/oauth2/** 는 프로바이더가 코드를 들고 돌아오는 콜백이다. 둘 다
                  # 인증 **전** 경로라 JwtAuthorization 없는 이 라우트에 있어야 한다 —
                  # 아래 인증 라우트에 넣으면 로그인하러 가는 길을 로그인으로 막는 꼴이 된다.
                  - Path=/user-service/api/auth/public/**, \
                    /user-service/registrationConfirm, \
                    /user-service/oauth2/**, /user-service/login/oauth2/**
              filters:
                  - RewritePath=/user-service/(?<segment>.*), /$\{segment}
                  # 🔒 인증 전 경로에는 훨씬 강한 제한을 건다.
                  #
                  # 전역 기본값(20/s, 버스트 40)은 일반 API 기준이라 로그인에는 지나치게
                  # 관대하다 — IP 하나로 분당 1,200회 비밀번호를 시도할 수 있다는 뜻이고,
                  # 계정 잠금도 구현돼 있지 않아(User.accountNonLocked 필드는 있지만 실패
                  # 횟수를 세는 코드가 없다) 사실상 무제한 대입이 가능했다.
                  #
                  # 이 경로는 인증 전이라 버킷 키가 클라이언트 IP 로 잡힌다. 정상 사용자는
                  # 로그인·회원가입을 초당 여러 번 하지 않으므로 분당 30회면 충분하다.
                  - name: RequestRateLimiter
                    args:
                      key-resolver: "#{@userKeyResolver}"
                      redis-rate-limiter.replenishRate: 1
                      redis-rate-limiter.burstCapacity: 10
                      redis-rate-limiter.requestedTokens: 1
            # 인증 없이 열리는 읽기 · 토큰 갱신 — 로그인용 강한 제한을 쓰지 않는다(🐛 예전에는 위 라우트에 있어, 상품 몇 개의 리뷰를
            # 보면 갱신이 429 를 받아 화면이 로그아웃시켰다).
            # [JA] 認証なしの読み取り · トークン更新 — ログイン用の強い制限は使わない。
            - id: user-service-public-read
              uri: lb://user-service
              predicates:
                  - Path=/user-service/api/token/refresh, /user-service/api/review/**
              filters:
                  - RewritePath=/user-service/(?<segment>.*), /$\{segment}
                  # 기본 유입 제한(초당 20, 버스트 40) — 라우트마다 하나(B-84). 버킷 키는 CustomUserKeyResolver(로그인 사용자 → IP).
                  # JwtAuthorization 뒤에 두어 User-Id 가 들어간 뒤 돈다. 아래 라우트들은 *rate-default 로 같은 값을 쓴다.
                  - &rate-default
                    name: RequestRateLimiter
                    args:
                      key-resolver: "#{@userKeyResolver}"
                      redis-rate-limiter.replenishRate: 20
                      redis-rate-limiter.burstCapacity: 40
                      redis-rate-limiter.requestedTokens: 1
            - id: user-service-auth
              uri: lb://user-service
              predicates:
                  # ⚠️ SSE 는 `/user-service/api/sse` 다. 예전에는 여기가 `/user-service/sse` 라
                  #    어느 라우트에도 걸리지 않아 **404** 였고, 설령 걸렸어도 RewritePath 가
                  #    `/sse` 로 바꾸는데 컨트롤러는 `/api/sse`(@RequestMapping("/api/") +
                  #    @GetMapping("/sse")) 라서 또 404 였다. 양쪽이 함께 틀려 있었다.
                  #    증상은 "알림만 안 온다"라서 아무도 배포를 막지 않는다.
                  - Path=/user-service/api/user/**, /user-service/api/auth/**, /user-service/api/sse
              filters:              
                  - RewritePath=/user-service/(?<segment>.*), /$\{segment}
                  - JwtAuthorization              
                  - *rate-default
            
            # ── catalog 은 라우트가 **둘**이다. 읽기는 공개, 쓰기는 인증 ──────────
            #
            # 원래는 아래 읽기 라우트 하나뿐이었고 JwtAuthorization 이 없었다. 카탈로그
            # 조회는 로그인 없이 되어야 하니 그 자체는 맞는데, 같은 라우트로 POST /api/product
            # (상품 등록) · POST /api/category/** (카테고리 생성) · POST /api/products/sync
            # (배치 잡 기동!) 까지 **토큰 없이** 통과했다. 사이트가 공개된 순간 누구나 상품을
            # 등록·변조할 수 있는 상태였다.
            #
            # 그래서 쓰기 메서드만 받는 라우트를 앞(order -1)에 둔다. predicate 는 AND 라
            # Path+Method 둘 다 맞아야 하고, 나머지(GET)는 아래 공개 라우트로 떨어진다.
            # 역할(ROLE_ADMIN) 검사는 여기서 하지 않는다 — 이 필터는 인증만 안다. 역할은
            # catalog-service 의 AdminWriteInterceptor 가 User-Role 헤더로 판정한다
            # (그 헤더는 default-filters 가 지우고 JwtAuthorization 만 다시 넣으므로 위조 불가).
            #
            # ⚠️ 필터 순서: JwtAuthorization 이 RemoveRequestHeader=Cookie 보다 먼저다.
            #    토큰이 ACCESS 쿠키로 오는 경우(브라우저 경로가 그렇다) 쿠키를 먼저 지우면
            #    로그인해도 401 이 난다. cart-service 라우트와 같은 순서를 따른다.
            # 콘텐츠 관리(/api/content/admin/**)는 **GET 도** 인증이 필요하다 — 그 아래에
            # 비공개 배너와 초안 공지 목록이 있다. 아래 write 라우트는 Method 조건이 있어
            # GET 을 잡지 못하므로, 경로만으로 잡는 라우트를 더 앞(order -2)에 둔다.
            #
            # 역할(ROLE_ADMIN) 검사는 여기서 하지 않는다. 이 필터는 인증만 안다 — 역할은
            # AdminWriteInterceptor 가 ADMIN_CONTENT_PREFIX 로 판정한다.
            - id: catalog-service-content-admin
              uri: lb://catalog-service
              order: -2
              predicates:
                  - Path=/catalog-service/api/content/admin/**
              filters:
                  - JwtAuthorization
                  - *rate-default
                  - RemoveRequestHeader=Cookie
                  - RewritePath=/catalog-service/(?<segment>.*), /$\{segment}
                  - name: CircuitBreaker
                    args:
                      name: catalogServiceCircuitBreaker
                      fallbackUri: forward:/fallback

            - id: catalog-service-write
              uri: lb://catalog-service
              order: -1
              predicates:
                  - Path=/catalog-service/**
                  - Method=POST,PUT,DELETE,PATCH
              filters:
                  - JwtAuthorization
                  - *rate-default
                  - RemoveRequestHeader=Cookie
                  - RewritePath=/catalog-service/(?<segment>.*), /$\{segment}
                  - name: CircuitBreaker
                    args:
                      name: catalogServiceCircuitBreaker
                      fallbackUri: forward:/fallback

            - id: catalog-service
              uri: lb://catalog-service
              predicates:
                  - Path=/catalog-service/**
              filters:
                  - RemoveRequestHeader=Cookie
                  - RewritePath=/catalog-service/(?<segment>.*), /$\{segment}
                  - *rate-default
                  - name: CircuitBreaker
                    args:
                      name: catalogServiceCircuitBreaker
                      fallbackUri: forward:/fallback

            - id: cart-service
              uri: lb://cart-service
              predicates:
                  - Path=/cart-service/**
              filters:              
                  - JwtAuthorization       
                  - *rate-default
                  - RemoveRequestHeader=Cookie
                  - RewritePath=/cart-service/(?<segment>.*), /$\{segment}
                  - name: CircuitBreaker
                    args:
                      name: cartServiceCircuitBreaker
                      fallbackUri: forward:/fallback

            - id: coupon-service
              uri: lb://coupon-service
              predicates:
                  - Path=/coupon-service/**
              filters:
                  - JwtAuthorization
                  - RemoveRequestHeader=Cookie
                  - RewritePath=/coupon-service/(?<segment>.*), /$\{segment}
                  - *rate-default
                  - name: CircuitBreaker
                    args:
                      name: couponServiceCircuitBreaker
                      fallbackUri: forward:/fallback
            - id: notification-service
              uri: lb://notification-service
              predicates:
                  - Path=/notification-service/**
              filters:
                  - JwtAuthorization
                  - RemoveRequestHeader=Cookie
                  - RewritePath=/notification-service/(?<segment>.*), /$\{segment}
                  - *rate-default
                  - name: CircuitBreaker
                    args:
                      name: notificationServiceCircuitBreaker
                      fallbackUri: forward:/fallback
        

            - id: delivery-service
              uri: lb://delivery-service
              predicates:
                  - Path=/delivery-service/**
              filters:
                  - JwtAuthorization
                  - RemoveRequestHeader=Cookie
                  - RewritePath=/delivery-service/(?<segment>.*), /$\{segment}
                  - *rate-default
                  - name: CircuitBreaker
                    args:
                      name: deliveryServiceCircuitBreaker
                      fallbackUri: forward:/fallback
        

            # ── Stripe 웹훅 — 인증 없는 공개 경로 ───────────────────────────────
            #
            # 🔒 Stripe 는 우리 토큰을 가질 수 없으므로 JwtAuthorization 을 걸 수 없다.
            #    "정말 Stripe 가 보냈는가" 는 **Stripe-Signature 헤더의 HMAC 서명**이 답하고,
            #    order-service 의 StripeWebhookVerifier 가 그것을 검증한다. 검증을 건너뛰면
            #    이 URL 에 JSON 을 POST 하는 것만으로 결제가 조작된다.
            #
            # ⚠️ **order-service 라우트보다 위에 있어야 한다.** 아래 라우트가 /order-service/**
            #    를 전부 잡으므로, 순서가 바뀌면 이 경로도 JwtAuthorization 을 타고 401 이 된다.
            #    Stripe 는 401 을 받으면 재시도하다 포기하고, 그 결과는 "결제는 됐는데 주문에
            #    반영이 안 된다" 로 나타난다.
            #
            # RemoveRequestHeader=Cookie 는 그대로 둔다. 서명 대상은 본문이라 영향이 없다.
            # 포트원 웹훅 — 같은 이유로 공개다. ⚠️ 포트원 V1 은 서명이 없으므로 이 경로는
            # **본문을 단서로만** 쓴다(imp_uid 하나만 취하고 포트원 API 에 다시 조회한다).
            # 근거는 PortOnePaymentService 주석에 있다.
            - id: order-service-portone-webhook
              uri: lb://order-service
              predicates:
                  - Path=/order-service/api/order/payment/portone/webhook
              filters:
                  - RemoveRequestHeader=Cookie
                  - RewritePath=/order-service/(?<segment>.*), /$\{segment}
                  - *rate-default
                  - name: CircuitBreaker
                    args:
                      name: orderServiceCircuitBreaker
                      fallbackUri: forward:/fallback

            - id: order-service-stripe-webhook
              uri: lb://order-service
              predicates:
                  - Path=/order-service/api/order/payment/stripe/webhook
              filters:
                  - RemoveRequestHeader=Cookie
                  - RewritePath=/order-service/(?<segment>.*), /$\{segment}
                  - *rate-default
                  - name: CircuitBreaker
                    args:
                      name: orderServiceCircuitBreaker
                      fallbackUri: forward:/fallback

            - id: order-service
              uri: lb://order-service
              predicates:
                  - Path=/order-service/**
              filters:
                  - JwtAuthorization
                  - RemoveRequestHeader=Cookie
                  - RewritePath=/order-service/(?<segment>.*), /$\{segment}
                  - *rate-default
                  - name: CircuitBreaker
                    args:
                      name: orderServiceCircuitBreaker
                      fallbackUri: forward:/fallback

            # 주문 진행 읽기 모델(docs/76) — saga-projection 의 대화형 조회. JwtAuthorization 이 User-Id 를 넣고,
            # 서비스가 주문의 customerId 와 대조한다(남의 주문은 404). 조회 전용(GET).
            # [JA] 注文進行の読み取りモデル(docs/76) — saga-projection の対話型照会。JwtAuthorization が User-Id を入れ、
            #      サービスが注文の customerId と照合する(他人の注文は 404)。
            - id: saga-projection
              uri: lb://saga-projection
              predicates:
                  - Path=/saga-projection/api/saga/**
                  - Method=GET
              filters:
                  - JwtAuthorization
                  - RemoveRequestHeader=Cookie
                  - RewritePath=/saga-projection/(?<segment>.*), /$\{segment}
                  - *rate-default
                  - name: CircuitBreaker
                    args:
                      name: sagaProjectionCircuitBreaker
                      fallbackUri: forward:/fallback

            - id: pay-service
              uri: lb://pay-service
              predicates:
                  - Path=/pay-service/**
              filters:
                  - JwtAuthorization
                  - RemoveRequestHeader=Cookie
                  - RewritePath=/pay-service/(?<segment>.*), /$\{segment}
                  - *rate-default
                  - name: CircuitBreaker
                    args:
                      name: payServiceCircuitBreaker
                      fallbackUri: forward:/fallback

            # chat-service-ws: WebSocket 핸드셰이크(장수명 커넥션)이므로 서킷브레이커를 적용하지 않는다.
            # (요청 지속시간이 곧 연결 지속시간이 되어 slow-call 로 오탐된다.)
            - id: chat-service-ws
              uri: lb:ws://chat-service
              predicates:
                  - Path=/chat-service/chat/**
              filters:
                  - RemoveRequestHeader=Cookie
                  - RewritePath=/chat-service/(?<segment>.*), /$\{segment}
                  - *rate-default

            - id: chat-service-api
              uri: lb:ws://chat-service
              predicates:
                  - Path=/chat-service/api/**
              filters:
                  - JwtAuthorization
                  - RemoveRequestHeader=Cookie
                  - RewritePath=/chat-service/(?<segment>.*), /$\{segment}
                  - *rate-default
                  - name: CircuitBreaker
                    args:
                      name: chatApiCircuitBreaker
                      fallbackUri: forward:/fallback


