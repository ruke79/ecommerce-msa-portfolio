password: 선택된 개인 키에 접근하기 위한 비밀번호입니다.

eureka:
  instance:
    prefer-ip-address: false 
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}

    non-secure-port-enabled : false
    secure-port-enabled : true
    secure-port : 8000




    # 🐛 여기에 `tls:` 블록이 있었다 — `eureka.instance` 아래라 **eureka.instance.tls** 가 되어 아무도 읽지 않았다(클라이언트 TLS 는
    #    eureka.client.tls). 게이트웨이의 Eureka 클라이언트는 인증서 없이 붙고 있었다. 이제 공통 설정(application-common.yml 의
    #    eureka.client.tls — 이 파일보다 우선한다)이 신원 인증서(/app/identity, CN=gateway-server)를 낸다(docs/57 §16 "Eureka 쓰기").
    # [JA] 🐛 ここに `tls:` ブロックがあった — `eureka.instance` の下なので **eureka.instance.tls** になり誰も読まなかった(クライアント TLS は
    #    eureka.client.tls)。ゲートウェイの Eureka クライアントは証明書なしで接続していた。今は共通設定(application-common.yml の
    #    eureka.client.tls — このファイルより優先する)が身元証明書(/app/identity、CN=gateway-server)を出す(docs/57 §16 "Eureka 書き込み")。
    # [JA] ここにあった tls ブロックは eureka.instance の下で誰も読まなかった。今は共通設定の eureka.client.tls が身元証明書を出す。
    # [JA] ここにあった tls ブロックは eureka.instance の下で誰も読まなかった。今は共通設定の eureka.client.tls が身元証明書を出す。
    
  # ssl:
  #   bundle:
  #     jks:
  #       eureka-client:
  #         truststore:
  #           location: ${LOCAL_KEY_STORE_PATH}
  #           password: ${LOCAL_KEY_STORE_PASSWORD}
  #           type: PKCS12
  #       gateway:
  #         key:
  #           # alias는 주석 처리하고, password는 환경 변수로 설정 ／ [JA] alias はコメントアウトし、password は環境変数で設定
  #           # alias: 
  #           password: ${LOCAL_KEY_PASSWORD}
  #         keystore:
  #           location: ${LOCAL_KEY_STORE_PATH}
  #           password: ${LOCAL_KEY_STORE_PASSWORD}
  #           type: PKCS12


spring:
  application:
    name: gateway-server
   
  config:
      import: "classpath:application-common.yml"    
      #import: optional:configserver:https://localhost:8888


  app:    
     jwtSecret: ${JWT_SECRET_KEY}
     # 서명 키 링(docs/68 §17) — 비워 두면 JWT_SECRET_KEY 하나(kid "legacy"). 교체는 ops/46. 세 서비스(user · gateway · chat)가 같은 값이어야 한다.
     # [JA] 署名キーリング(docs/68 §17) — 空なら JWT_SECRET_KEY 一つ(kid "legacy")。交換は ops/46。三つのサービス(user · gateway · chat)が同じ値でなければならない。
     jwtSigningKeys: ${JWT_SIGNING_KEYS:}
     jwtActiveKid: ${JWT_ACTIVE_KID:}
     jwtAcceptLegacy: ${JWT_ACCEPT_LEGACY:true}
  main:
    # 서블릿 · Tomcat 은 build.gradle.kts 가 클래스패스에서 뺀다 — 이것은 의도를 적어 두는 것(Netty 서버, NettyServerTest).
    # [JA] サーブレット・Tomcat は build.gradle.kts がクラスパスから外す — これは意図の明記(Netty サーバー)。
    web-application-type: reactive

  # RequestRateLimiter 토큰 버킷 저장소. Redis 미가동 시 게이트웨이가 트래픽을 처리하지 못하므로
  # 운영 환경에서는 Redis 가용성(복제/센티넬)을 반드시 확보한다. (docs/03 §장애 시나리오 참조)
  # [JA] RequestRateLimiter のトークンバケット保存先。Redis が動いていないとゲートウェイがトラフィックを処理できないため、
  #      本番環境では Redis の可用性(レプリケーション/センチネル)を必ず確保する(docs/03 §障害シナリオ参照)。
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 다른 서비스는 전부 LOCAL_DB_PASSWORD 로 Redis 에 인증하는데 게이트웨이만 비밀번호를
      # 읽지 않았다. requirepass 가 걸린 Redis(운영 표준) 앞에서는 레이트리미터의 Redis 접속이
      # 조용히 실패해 토큰버킷이 동작하지 않는다 — 스테이징 리허설에서 드러난 설정 드리프트.
      # [JA] 他のサービスはすべて LOCAL_DB_PASSWORD で Redis に認証するのに、ゲートウェイだけがパスワードを読んでいなかった。
      #      requirepass がかかった Redis(本番標準)の前ではレートリミッターの Redis 接続が黙って失敗しトークンバケットが動かない — ステージングのリハーサルで露見した設定ドリフト。
      password: ${REDIS_PASSWORD:${LOCAL_DB_PASSWORD:}}
      # 🐛 명령 타임아웃이 없었다 — Lettuce 기본 60초. Redis 가 잠깐 끊기면(파드 재시작) 속도 제한의 명령이 버퍼에 쌓여
      #    **모든 API 요청**이 최대 60초 멈췄다(속도 제한은 CircuitBreaker 의 10초 TimeLimiter 보다 앞이라 그것도 받지 못한다).
      #    짧게 끊으면 RedisRateLimiter 가 오류를 "통과" 로 다룬다(fail-open) — 제한이 잠깐 풀리는 쪽이 전면 정지보다 낫다.
      # [JA] コマンドタイムアウトがなかった(Lettuce 既定 60 秒)。Redis が一瞬切れると全 API が最大 60 秒止まった。短く切れば fail-open。
      timeout: ${GATEWAY_REDIS_TIMEOUT:500ms}
      connect-timeout: ${GATEWAY_REDIS_CONNECT_TIMEOUT:1s}

  cloud:
    gateway:
      # Spring Cloud Gateway 4.3(2025.0)부터 서버 설정은 spring.cloud.gateway.server.webflux 아래다. 옛 위치(spring.cloud.gateway.*)는
      # 기동 때 옮겨 읽어 주지만(경고) 다음 메이저에서 빠진다 — 여기로 옮겼다(docs/61).
      # [JA] Spring Cloud Gateway 4.3(2025.0)からサーバー設定は spring.cloud.gateway.server.webflux 以下である。古い位置(spring.cloud.gateway.*)は
      #      起動時に移して読んでくれるが(警告)次のメジャーで外れる — ここへ移した(docs/61)。
      server:
        webflux:
          # 라우트마다의 요청 타이머 spring.cloud.gateway.requests(routeId · httpStatusCode · httpMethod · outcome) — 4.3 은 기본 꺼짐이라
          # 지금까지 게이트웨이 쪽 지표는 라우트를 몰랐다. SLO `gateway`(docs/91 §2-7)가 이것을 읽는다 — 회로 차단 폴백(/fallback 503)
          # · 연결 실패 · 다운스트림 시간 초과는 서비스 쪽 http.server.requests 에 남지 않는다. 경계 버킷은 application-common.yml.
          # path 태그(path-tags)는 켜지 않는다 — 요청 경로마다 시계열이 생긴다.
          # [JA] ルートごとのリクエストタイマー spring.cloud.gateway.requests(routeId · httpStatusCode · httpMethod · outcome)— 4.3 は既定で
          #      無効なので、これまでゲートウェイ側の指標はルートを知らなかった。SLO `gateway`(docs/91 §2-7)がこれを読む — サーキットブレーカーの
          #      フォールバック(/fallback 503) · 接続失敗 · 下流のタイムアウトはサービス側の http.server.requests に残らない。境界バケットは
          #      application-common.yml。path タグ(path-tags)は有効にしない — リクエストパスごとに時系列ができる。
          # [JA] ルートごとのタイマー(4.3 は既定で無効)。SLO gateway が読む — フォールバック 503 · 接続失敗はサービス側の指標に残らない。
          # [JA] ルートごとのタイマー(4.3 は既定で無効)。SLO gateway が読む — フォールバック 503 · 接続失敗はサービス側の指標に残らない。
          metrics:
            enabled: true
          httpclient:
            ssl:
                # 예전에는 true 로 고정돼 있었다. 그 한 줄이 게이트웨이의 다운스트림 TLS 검증을
                # **전부 무력화**한다 — 아무 인증서나 통과하므로 결제 트래픽 구간에서 MITM 이 성립한다.
                # (아래 trust-store 를 같이 써 놨지만, useInsecureTrustManager 가 true 면 무시된다.)
                #
                # 이제 기본값은 검증을 켜는 쪽이다. 서비스 인증서가 같은 CA 로 서명돼 있고
                # SAN 에 서비스 이름이 들어 있으면 그대로 동작한다 — ops/07-issue-certificates.sh 가
                # 정확히 그런 인증서를 만든다(docs/18).
                # 외부 인증서를 쓰는 과도기에만 GATEWAY_INSECURE_TRUST_MANAGER=true 로 임시 우회한다.
                # [JA] 以前は true に固定されていた。その一行がゲートウェイの下流 TLS 検証を**すべて無力化**する — どんな証明書でも通るので決済トラフィック区間で MITM が成立する。
                #      (下の trust-store も一緒に書いてあったが、useInsecureTrustManager が true なら無視される。)
                #      今はデフォルトが検証を有効にする側である。サービス証明書が同じ CA で署名され SAN にサービス名が入っていればそのまま動く — ops/07-issue-certificates.sh が
                #      まさにそういう証明書を作る(docs/18)。外部証明書を使う過渡期にだけ GATEWAY_INSECURE_TRUST_MANAGER=true で一時的に回避する。
                useInsecureTrustManager: ${GATEWAY_INSECURE_TRUST_MANAGER:false}
                # Truststore 설정을 추가하여 Eureka Server의 인증서를 신뢰하도록 함
                # [JA] Truststore 設定を追加して Eureka Server の証明書を信頼するようにする
                trust-store: file:${LOCAL_TRUST_STORE_PATH}
                trust-store-password: ${LOCAL_KEY_STORE_PASSWORD}
                # 🔒 백엔드로 넘길 때 게이트웨이 자기 인증서(CN=gateway-server, ops/38 · k8s/96)를 클라이언트 인증서로 낸다.
                # 받는 쪽(InternalCallerFilter)은 신원 헤더(User-Id · User-Role · User-Email)를 이 인증서로 온 요청에서만
                # 믿는다 — 예전에는 헤더만 있으면 믿어서 클러스터 안의 파드가 헤더를 직접 붙여 관리자가 될 수 있었다(docs/57 §16).
                # 비우면(로컬 · 인증서 없는 환경) 인증서를 내지 않는다 — 받는 쪽 identity-mode 가 observe 면 경고만 남는다.
                # [JA] バックエンドへ渡すとき、ゲートウェイ自身の証明書(CN=gateway-server)をクライアント証明書として提示する。
                #      受け側は身元ヘッダーをこの証明書で来たリクエストでのみ信じる。空なら提示しない。
                key-store: ${GATEWAY_CLIENT_KEY_STORE:}
                key-store-type: PKCS12
                key-store-password: ${LOCAL_KEY_STORE_PASSWORD}
                # SSL 번들 설정 제거
                # bundle: eureka-client
                # [JA] SSL バンドル設定を削除
            # 🐛 연결 풀 — 백엔드가 이미 닫은 연결을 재사용해 503 이 나던 것.
            #   Reactor Netty 는 기본값으로 쉬는 연결을 **무기한** 풀에 둔다. 백엔드(Tomcat)는 60초 쉰 연결을 닫는다(keep-alive 기본).
            #   그 사이 게이트웨이가 닫힌 연결을 꺼내 요청을 보내면 "Connection prematurely closed BEFORE response" →
            #   서킷 브레이커 fallback → 브라우저에는 503. 백엔드 재시작 뒤 옛 파드로 향한 연결도 같은 식으로 터진다.
            #   백엔드의 keep-alive(60초)보다 짧게 쉰 연결을 버리고, 오래된 연결은 수명으로 교체한다
            #   (GatewayPropertiesLocationTest 가 60초 미만인지 본다).
            # [JA] 🐛 接続プール — バックエンドが既に閉じた接続を再利用して 503 になっていたもの。
            #      Reactor Netty はデフォルトでアイドル接続を**無期限に**プールに置く。バックエンド(Tomcat)は 60 秒アイドルの接続を閉じる(keep-alive デフォルト)。
            #      その間にゲートウェイが閉じた接続を取り出してリクエストを送ると "Connection prematurely closed BEFORE response" →
            #      サーキットブレーカー fallback → ブラウザには 503。バックエンド再起動後に古いポッドへ向いた接続も同じように壊れる。
            #      バックエンドの keep-alive(60 秒)より短くアイドルした接続を捨て、古い接続は寿命で入れ替える(GatewayPropertiesLocationTest が 60 秒未満かを見る)。
            pool:
                max-idle-time: ${GATEWAY_POOL_MAX_IDLE:30s}
                max-life-time: ${GATEWAY_POOL_MAX_LIFE:5m}
                eviction-interval: 15s
            # 연결 시간 상한 — 클러스터 안 연결은 몇 ms 다. 기본값(45초)이면 사라진 파드 IP 로의 연결이 회로 차단기의 10초를 먼저 다 써
            # 아래 Retry(연결 실패만 다시 보낸다)가 돌 틈이 없다(docs/83 §2.8). [JA] 接続時間の上限 — 既定 45 秒では Retry が働く前に 10 秒を使い切る。
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}

          default-filters:
           - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
           # 🔒 신원 헤더(User-Id/User-Email/User-Role)를 지우는 일은 **여기 있으면 안 된다.**
           #
           # 예전에는 여기에 RemoveRequestHeader=User-Id 세 줄이 있었고, "default-filters 는
           # 라우트 필터보다 먼저 실행되므로 지운 뒤 JwtAuthorization 이 다시 넣는다" 는
           # 주석이 붙어 있었다. 그 전제가 **정반대**였다:
           #
           #   RouteDefinitionRouteLocator.loadGatewayFilters 는 각 필터를 그 목록 안에서의
           #   인덱스+1 로 감싸고(OrderedGatewayFilter(filter, i+1)), getFilters 는
           #   default-filters(order 1..5) 다음에 라우트 필터를 **다시 1부터** 담아 정렬한다.
           #   그래서 JwtAuthorization(라우트 1번 → order 1)이 먼저 돌고,
           #   RemoveRequestHeader=User-Id(기본 2번 → order 2)가 그 뒤에 지워 버린다.
           #
           # 결과는 조용한 전면 장애였다 — 검증된 신원이 하위 서비스에 하나도 도달하지 않아
           # JwtAuthorization 이 붙은 모든 라우트가 401 을 받았다. 게이트웨이 로그에는 필터가
           # 정상 호출된 것으로 찍혀서 원인이 드러나지 않았다.
           #
           # 지금은 IdentityHeaderScrubFilter(GlobalFilter, HIGHEST_PRECEDENCE)가 한다.
           # 전역 필터는 자기 order 를 그대로 쓰므로 필터 개수·나열 순서에 기대지 않는다.
           # (되돌리면 ConfigurationGuardrailTest B-53 이 막는다.)
           # 🔒 유입 트래픽 제한(RequestRateLimiter)은 여기가 아니라 **라우트마다 하나씩** 둔다(아래 &rate-default, 가드 B-84).
           #
           # 🐛 예전에는 여기 하나 + 로그인 라우트에 하나였다. RedisRateLimiter 는 설정을 **라우트 id 로** 저장하고(나중에 묶인 것이
           #    이긴다) Redis 키도 라우트 id + 버킷 키라, 한 라우트의 두 필터가 같은 버킷에서 요청마다 토큰을 **두 개** 썼다 —
           #    로그인 라우트는 실효 초당 0.5회 · 버스트 5 였고, 같은 라우트의 리뷰 보기 · 토큰 갱신이 그 버킷을 비워 갱신이 429 →
           #    화면이 로그아웃시켰다. 또 default-filters 는 라우트 필터보다 앞이라 JWT 필터가 User-Id 를 넣기 전에 돌아,
           #    로그인한 사용자도 IP 하나에 묶였다. 라우트 필터로 두면 JwtAuthorization 뒤에 놓을 수 있다.
           # [JA] 🔒 身元ヘッダー(User-Id/User-Email/User-Role)を消す処理は**ここにあってはならない。**
           #      以前はここに RemoveRequestHeader=User-Id の 3 行があり、「default-filters はルートフィルターより先に実行されるので、
           #      消した後に JwtAuthorization が入れ直す」というコメントが付いていた。その前提は**正反対**だった:
           #        RouteDefinitionRouteLocator.loadGatewayFilters は各フィルターをそのリスト内での
           #        インデックス+1 で包み(OrderedGatewayFilter(filter, i+1))、getFilters は
           #        default-filters(order 1..5)の次にルートフィルターを**また 1 から**入れてソートする。
           #        そのため JwtAuthorization(ルート 1 番 → order 1)が先に動き、
           #        RemoveRequestHeader=User-Id(既定 2 番 → order 2)がその後で消してしまう。
           #      結果は静かな全面障害だった — 検証済みの身元が下位サービスに一つも届かず、
           #      JwtAuthorization が付いたすべてのルートが 401 を受けた。ゲートウェイのログにはフィルターが
           #      正常に呼ばれたと出ていたので原因が見えなかった。
           #      今は IdentityHeaderScrubFilter(GlobalFilter, HIGHEST_PRECEDENCE)が行う。
           #      グローバルフィルターは自分の order をそのまま使うので、フィルターの数 · 並び順に依存しない。
           #      (戻すと ConfigurationGuardrailTest B-53 が止める。)
           #      🔒 流入トラフィック制限(RequestRateLimiter)はここではなく**ルートごとに一つずつ**置く(下の &rate-default、ガード B-84)。
           #      🐛 以前はここに一つ + ログインルートに一つだった。RedisRateLimiter は設定を**ルート id で**保存し(後で結び付いたものが
           #      勝つ)、Redis キーもルート id + バケットキーなので、一つのルートの二つのフィルターが同じバケットからリクエストごとにトークンを
           #      **二つ**使った — ログインルートは実効で毎秒 0.5 回 · バースト 5 で、同じルートのレビュー閲覧 · トークン更新がそのバケットを空にして
           #      更新が 429 → 画面がログアウトさせた。また default-filters はルートフィルターより前なので JWT フィルターが User-Id を入れる前に動き、
           #      ログインしたユーザーも IP 一つに縛られた。ルートフィルターにすれば JwtAuthorization の後に置ける。
           # [JA] 流入制限はここではなくルートごとに一つ置く。以前はここと ログインルートの二つで、同じバケットからリクエストごとに
           #      トークンを二つ使い、レビュー閲覧 · トークン更新がバケットを空にしてログアウトさせていた。
           # [JA] 流入制限はここではなくルートごとに一つ置く。以前はここと ログインルートの二つで、同じバケットからリクエストごとに
           #      トークンを二つ使い、レビュー閲覧 · トークン更新がバケットを空にしてログアウトさせていた。
      
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - 'https://localhost:3000'
                  # 브라우저가 여는 주소(운영 공개 도메인 · 실습 shop.lab). 🐛 2026-11-20 실습: localhost 하나뿐이라 traefik 을 거친
                  #    WebSocket 업그레이드(Origin = 실습 주소 shop.lab)를 CORS 가 403 으로 막았다 — 채팅이 xhr 로만 붙었다.
                  #    Origin 을 빼면 같은 요청이 101 이었다. [JA] ブラウザが開くアドレス — localhost だけで WebSocket が 403 だった。
                  - '${APP_PUBLIC_URL:https://localhost:3000}'
                allow-credentials: true 
                allowedHeaders: 
                   - 'Authorization'
                   - 'Content-Type'
                   - 'Cache-Control'
                   - 'Connection'
                   - 'X-Accel-Buffering'
                   - 'MultiLogin'
                   # 주문 생성 멱등 키(Summary.jsx) — 로컬은 출처가 달라 사전 요청이 이 헤더를 묻는다.
                   # [JA] 注文作成の冪等キー(Summary.jsx) — ローカルはオリジンが異なるのでプリフライトがこのヘッダーを問う。
                   - 'Idempotency-Key'
                   # 결제 시도 키(Payment.jsx, order V27).
                   # [JA] 決済試行キー(Payment.jsx、order V27)。
                   - 'Payment-Attempt'
                allowedMethods: 
                  - PUT
                  - GET
                  - POST
                  - DELETE
                  - OPTIONS
                exposedHeaders: 
                  - 'ACCESS'
                  - 'Set-Cookie'
                  - 'MultiLogin'

          # 🔒 자동 라우트(discovery locator)는 끈다(docs/57 §9, 가드 B-64). 켜 두면 Eureka 의 서비스마다
          #    `/USER-SERVICE/**`·`/ORDER-SERVICE/**` 라우트가 생기는데, 거기에는 **JWT 필터가 없다.** 신원 헤더는 전역
          #    필터가 지우므로 하위 서비스에는 "헤더 없음 = 내부 호출" 로 도착한다 — InternalCallGuard 가 내부로 믿는 모양이다.
          #    지금은 터널이 소문자 `…-service` 접두사만 넘겨 밖에서 닿지 않지만, 그것은 터널 설정 한 줄에 기댄 방어였다.
          #    쓰는 곳도 없다 — 화면은 아래의 명시 라우트만, 서비스끼리는 Eureka(lb://)로 직접 부른다.
          # [JA] 🔒 自動ルート(discovery locator)は切る(docs/57 §9、ガード B-64)。有効にすると Eureka のサービスごとに `/USER-SERVICE/**` · `/ORDER-SERVICE/**` ルートができるが、
          #      そこには**JWT フィルターがない。** 身元ヘッダーはグローバルフィルターが消すので、下位サービスには「ヘッダーなし = 内部呼び出し」として届く — InternalCallGuard が内部と信じる形だ。
          #      今はトンネルが小文字の `…-service` 接頭辞しか通さないので外から届かないが、それはトンネル設定一行に頼った防御だった。
          #      使う箇所もない — 画面は下の明示ルートだけ、サービス同士は Eureka(lb://)で直接呼ぶ。
          discovery:
            locator:
              enabled: false
      
          routes:        

            # 🐛 라우트 id 가 둘 다 `user-service` 였다(docs/57 §4). 레이트리미터는 설정을 라우트 id 로 저장한다 —
            #    같은 id 의 아래 라우트(기본값 20/s)가 이 라우트의 로그인 제한(1/s, 버스트 10)을 덮을 수 있었다. 라우트 id 는
            #    유일해야 한다(ConfigurationGuardrailTest B-62).
            # [JA] 🐛 ルート id が両方とも `user-service` だった(docs/57 §4)。レートリミッターは設定をルート id で保存する —
            #      同じ id の下のルート(デフォルト 20/s)がこのルートのログイン制限(1/s、バースト 10)を上書きしえた。ルート id は一意でなければならない(ConfigurationGuardrailTest B-62)。
            - id: user-service-public
              uri: lb://user-service
              # ⚠️ user-service-auth(/user-service/api/auth/**) 가 이 경로(/api/auth/public/**)를 덮는다 — 순서를 숫자로 고정한다.
              #    선언 순서에 기대면 줄을 옮기는 순간 로그인 · 가입이 JWT 를 요구해 401 이 된다(RouteMatchingTest).
              # [JA] ⚠️ user-service-auth(/user-service/api/auth/**)がこの経路(/api/auth/public/**)を覆う — 順序を数値で固定する。
              #    宣言順に頼ると、行を移した瞬間にログイン · 登録が JWT を要求して 401 になる(RouteMatchingTest)。
              # [JA] user-service-auth がこの経路を覆う — 順序を数値で固定する。
              # [JA] user-service-auth がこの経路を覆う — 順序を数値で固定する。
              order: -1
              predicates:
                  # oauth2/** 는 소셜 로그인 시작(/oauth2/authorization/{provider}),
                  # login/oauth2/** 는 프로바이더가 코드를 들고 돌아오는 콜백이다. 둘 다
                  # 인증 **전** 경로라 JwtAuthorization 없는 이 라우트에 있어야 한다 —
                  # 아래 인증 라우트에 넣으면 로그인하러 가는 길을 로그인으로 막는 꼴이 된다.
                  # 🐛 예전에는 여러 줄에 걸쳐 `, \` 로 이어 썼다 — YAML 의 일반 스칼라에서 `\` 는 이어 쓰기가 아니라 글자 그대로라,
                  #    "\ /user-service/registrationConfirm" · "\ /user-service/oauth2/**" 라는 패턴이 되어 아무것도 맞지 않았다.
                  #    가입 확인 메일 링크와 소셜 로그인 시작이 게이트웨이에서 404 였다(2026-09-28 부터, RouteMatchingTest).
                  # [JA] oauth2/** はソーシャルログインの開始(/oauth2/authorization/{provider})、
                  #      login/oauth2/** はプロバイダーがコードを持って戻るコールバックである。どちらも
                  #      認証**前**の経路なので JwtAuthorization のないこのルートになければならない —
                  #      下の認証ルートに入れると、ログインしに行く道をログインでふさぐことになる。
                  #      🐛 以前は複数行にわたって `, \` でつないでいた — YAML のプレーンスカラーでは `\` は継続ではなく文字そのものなので、
                  #      "\ /user-service/registrationConfirm" · "\ /user-service/oauth2/**" というパターンになり何にも一致しなかった。
                  #      登録確認メールのリンクとソーシャルログインの開始がゲートウェイで 404 だった(2026-09-28 から、RouteMatchingTest)。
                  # [JA] 以前は複数行を `, \` でつないでいた — YAML では `\` は文字そのもので、二つの経路が何にも一致せず 404 だった。
                  # [JA] 以前は複数行を `, \` でつないでいた — YAML では `\` は文字そのもので、二つの経路が何にも一致せず 404 だった。
                  - Path=/user-service/api/auth/public/**,/user-service/registrationConfirm,/user-service/oauth2/**,/user-service/login/oauth2/**
              filters:
                  - RewritePath=/user-service/(?<segment>.*), /$\{segment}
                  # 🔒 인증 전 경로에는 훨씬 강한 제한을 건다.
                  #
                  # 전역 기본값(20/s, 버스트 40)은 일반 API 기준이라 로그인에는 지나치게
                  # 관대하다 — IP 하나로 분당 1,200회 비밀번호를 시도할 수 있다는 뜻이고,
                  # 계정 잠금도 구현돼 있지 않아(User.accountNonLocked 필드는 있지만 실패
                  # 횟수를 세는 코드가 없다) 사실상 무제한 대입이 가능했다.
                  #
                  # 이 경로는 인증 전이라 버킷 키가 클라이언트 IP 로 잡힌다. 정상 사용자는
                  # 로그인·회원가입을 초당 여러 번 하지 않으므로 분당 30회면 충분하다.
                  # [JA] 🔒 認証前のパスにはずっと強い制限をかける。グローバルのデフォルト(20/s、バースト 40)は一般 API 基準なのでログインには甘すぎる —
                  #      IP 一つで毎分 1,200 回パスワードを試せるという意味で、アカウントロックも実装されておらず(User.accountNonLocked フィールドはあるが失敗回数を数えるコードがない)事実上無制限の総当たりが可能だった。
                  #      このパスは認証前なのでバケットキーがクライアント IP になる。正常なユーザーはログイン · 会員登録を毎秒何度もしないので毎分 30 回で十分だ。
                  - name: RequestRateLimiter
                    args:
                      key-resolver: "#{@userKeyResolver}"
                      redis-rate-limiter.replenishRate: 1
                      redis-rate-limiter.burstCapacity: 10
                      redis-rate-limiter.requestedTokens: 1
                  # 🔴 연결 실패(파드가 죽어 포트가 닫힘 · 연결 시간 초과 · 경로 없음)만, GET 만, 다른 인스턴스로 두 번까지 다시 보낸다.
                  #    응답 상태(5xx · 격벽 503)는 다시 보내지 않는다 — series · statuses 를 비운다(Retry 의 기본값은 5xx 전부라, 바쁘다고 답한
                  #    서비스에 같은 요청을 두 배로 얹는다). 쓰기(POST 등)도 다시 보내지 않는다. 회로 차단기 안쪽(뒤)에 둔다 — 다시 보내 성공하면 성공으로 센다.
                  #    🐛 2026-10-21 실습 8시간(docs/83 §2.8): catalog 파드 하나가 JVM 충돌로 죽고 다시 뜨는 동안 게이트웨이가 그 인스턴스로 계속 보내
                  #    home · banners · 상품까지 5xx 였다(Eureka 는 죽은 인스턴스를 몇십 초 더 알린다). 라우트마다 하나(B-99, RouteRetryTest).
                  #    [JA] 🔴 接続失敗(Pod が死んでポートが閉じた · 接続タイムアウト · 経路なし)だけ、GET だけ、別インスタンスへ 2 回まで送り直す。
                  #    応答ステータス(5xx · 隔壁 503)は送り直さない — series · statuses を空にする(Retry の既定値は 5xx 全部なので、忙しいと答えた
                  #    サービスに同じリクエストを倍載せる)。書き込み(POST など)も送り直さない。サーキットブレーカーの内側(後ろ)に置く — 送り直して
                  #    成功すれば成功として数える。
                  #    🐛 2026-10-21 実習 8 時間(docs/83 §2.8): catalog の Pod 一つが JVM クラッシュで死んで再起動する間、ゲートウェイがそのインスタンスへ
                  #    送り続け、home · banners · 商品まで 5xx だった(Eureka は死んだインスタンスを数十秒長く知らせる)。ルートごとに一つ(B-99、RouteRetryTest)。
                  #    [JA] 接続失敗だけ、GET だけ、別インスタンスへ 2 回まで送り直す。応答ステータス(5xx · 隔壁 503)は送り直さない。
                  #    [JA] 接続失敗だけ、GET だけ、別インスタンスへ 2 回まで送り直す。応答ステータス(5xx · 隔壁 503)は送り直さない。
                  - &retry-connect
                    name: Retry
                    args:
                      retries: 2
                      methods: GET
                      series: ""
                      statuses: ""
                      exceptions: java.net.ConnectException, java.net.NoRouteToHostException
            # 인증 없이 열리는 읽기 · 토큰 갱신 — 로그인용 강한 제한을 쓰지 않는다(🐛 예전에는 위 라우트에 있어, 상품 몇 개의 리뷰를
            # 보면 갱신이 429 를 받아 화면이 로그아웃시켰다).
            # [JA] 認証なしの読み取り · トークン更新 — ログイン用の強い制限は使わない。
            - id: user-service-public-read
              uri: lb://user-service
              predicates:
                  - Path=/user-service/api/token/refresh, /user-service/api/review/**
              filters:
                  - RewritePath=/user-service/(?<segment>.*), /$\{segment}
                  # 기본 유입 제한(초당 20, 버스트 40) — 라우트마다 하나(B-84). 버킷 키는 CustomUserKeyResolver(로그인 사용자 → IP).
                  # JwtAuthorization 뒤에 두어 User-Id 가 들어간 뒤 돈다. 아래 라우트들은 *rate-default 로 같은 값을 쓴다.
                  # 값은 환경 변수로 바꿀 수 있다(기본은 그대로) — 실습 클러스터의 용량 측정(docs/83)만. 터널이 없는 데모에서는 모든 비로그인
                  # 요청이 Traefik 파드 하나의 IP 로 보여 버킷 하나(초당 20)를 나눠 쓴다 — 그대로면 부하 시험이 재는 것은 이 제한뿐이다.
                  # 운영은 바꾸지 않는다. 로그인(위 라우트, 초당 1)은 바꿀 수 없다.
                  # [JA] 既定の流入制限(毎秒 20、バースト 40)— ルートごとに一つ(B-84)。バケットキーは CustomUserKeyResolver(ログインユーザー → IP)。
                  #      JwtAuthorization の後に置き、User-Id が入った後に動く。下のルートは *rate-default で同じ値を使う。
                  #      値は環境変数で変えられる(既定は同じ)— 実習クラスタの容量測定(docs/83)だけ。トンネルのないデモではすべての非ログイン
                  #      リクエストが Traefik Pod 一つの IP に見え、バケット一つ(毎秒 20)を分け合う — そのままだと負荷試験が測るのはこの制限だけになる。
                  #      本番は変えない。ログイン(上のルート、毎秒 1)は変えられない。
                  # [JA] 値は環境変数で変えられる(既定は同じ)— 実習クラスタの容量測定だけ。本番は変えない。ログインの制限は変えられない。
                  # [JA] 値は環境変数で変えられる(既定は同じ)— 実習クラスタの容量測定だけ。本番は変えない。ログインの制限は変えられない。
                  - &rate-default
                    name: RequestRateLimiter
                    args:
                      key-resolver: "#{@userKeyResolver}"
                      redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH:20}
                      redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST:40}
                      redis-rate-limiter.requestedTokens: 1
                  - *retry-connect
            - id: user-service-auth
              uri: lb://user-service
              predicates:
                  # ⚠️ SSE 는 `/user-service/api/sse` 다. 예전에는 여기가 `/user-service/sse` 라
                  #    어느 라우트에도 걸리지 않아 **404** 였고, 설령 걸렸어도 RewritePath 가
                  #    `/sse` 로 바꾸는데 컨트롤러는 `/api/sse`(@RequestMapping("/api/") +
                  #    @GetMapping("/sse")) 라서 또 404 였다. 양쪽이 함께 틀려 있었다.
                  #    증상은 "알림만 안 온다"라서 아무도 배포를 막지 않는다.
                  # [JA] ⚠️ SSE は `/user-service/api/sse` である。以前はここが `/user-service/sse` でどのルートにもかからず**404** で、仮にかかっても RewritePath が
                  #      `/sse` に変えるのにコントローラーは `/api/sse`(@RequestMapping("/api/") + @GetMapping("/sse"))なのでまた 404 だった。両側が一緒に間違っていた。
                  #      症状は「通知だけ来ない」なので誰もデプロイを止めない。
                  - Path=/user-service/api/user/**, /user-service/api/auth/**, /user-service/api/sse
              filters:              
                  - RewritePath=/user-service/(?<segment>.*), /$\{segment}
                  - JwtAuthorization              
                  - *rate-default
                  - *retry-connect
            
            # ── catalog 은 라우트가 **둘**이다. 읽기는 공개, 쓰기는 인증 ──────────
            #
            # 원래는 아래 읽기 라우트 하나뿐이었고 JwtAuthorization 이 없었다. 카탈로그
            # 조회는 로그인 없이 되어야 하니 그 자체는 맞는데, 같은 라우트로 POST /api/product
            # (상품 등록) · POST /api/category/** (카테고리 생성) · POST /api/products/sync
            # (배치 잡 기동!) 까지 **토큰 없이** 통과했다. 사이트가 공개된 순간 누구나 상품을
            # 등록·변조할 수 있는 상태였다.
            #
            # 그래서 쓰기 메서드만 받는 라우트를 앞(order -1)에 둔다. predicate 는 AND 라
            # Path+Method 둘 다 맞아야 하고, 나머지(GET)는 아래 공개 라우트로 떨어진다.
            # 역할(ROLE_ADMIN) 검사는 여기서 하지 않는다 — 이 필터는 인증만 안다. 역할은
            # catalog-service 의 AdminWriteInterceptor 가 User-Role 헤더로 판정한다
            # (그 헤더는 default-filters 가 지우고 JwtAuthorization 만 다시 넣으므로 위조 불가).
            #
            # ⚠️ 필터 순서: JwtAuthorization 이 RemoveRequestHeader=Cookie 보다 먼저다.
            #    토큰이 ACCESS 쿠키로 오는 경우(브라우저 경로가 그렇다) 쿠키를 먼저 지우면
            #    로그인해도 401 이 난다. cart-service 라우트와 같은 순서를 따른다.
            # 콘텐츠 관리(/api/content/admin/**)는 **GET 도** 인증이 필요하다 — 그 아래에
            # 비공개 배너와 초안 공지 목록이 있다. 아래 write 라우트는 Method 조건이 있어
            # GET 을 잡지 못하므로, 경로만으로 잡는 라우트를 더 앞(order -2)에 둔다.
            #
            # 역할(ROLE_ADMIN) 검사는 여기서 하지 않는다. 이 필터는 인증만 안다 — 역할은
            # AdminWriteInterceptor 가 ADMIN_CONTENT_PREFIX 로 판정한다.
            # [JA] ── catalog はルートが**二つ**ある。読み取りは公開、書き込みは認証 ── もとは下の読み取りルート一つだけで JwtAuthorization がなかった。
            #      カタログ照会はログインなしでできるべきなのでそれ自体は正しいが、同じルートで POST /api/product(商品登録) · POST /api/category/**(カテゴリ作成) · POST /api/products/sync
            #      (バッチジョブ起動!)まで**トークンなしで**通っていた。サイトが公開された瞬間誰でも商品を登録 · 改ざんできる状態だった。
            #      そこで書き込みメソッドだけを受けるルートを前(order -1)に置く。predicate は AND なので Path+Method の両方が合う必要があり、残り(GET)は下の公開ルートに落ちる。
            #      ロール(ROLE_ADMIN)の検査はここではしない — このフィルターは認証しか知らない。ロールは catalog-service の AdminWriteInterceptor が User-Role ヘッダーで判定する
            #      (そのヘッダーは default-filters が消し JwtAuthorization だけが入れ直すので偽造不可)。
            #      ⚠️ フィルター順序: JwtAuthorization が RemoveRequestHeader=Cookie より先である。トークンが ACCESS Cookie で来る場合(ブラウザ経路がそう)Cookie を先に消すと
            #      ログインしても 401 になる。cart-service ルートと同じ順序に従う。
            #      コンテンツ管理(/api/content/admin/**)は**GET も**認証が必要だ — その下に非公開バナーと下書きのお知らせ一覧がある。下の write ルートは Method 条件があり
            #      GET を捕まえられないので、パスだけで捕まえるルートをさらに前(order -2)に置く。ロール(ROLE_ADMIN)検査はここではしない。このフィルターは認証しか知らない —
            #      ロールは AdminWriteInterceptor が ADMIN_CONTENT_PREFIX で判定する。
            - id: catalog-service-content-admin
              uri: lb://catalog-service
              order: -2
              predicates:
                  - Path=/catalog-service/api/content/admin/**
              filters:
                  - JwtAuthorization
                  - *rate-default
                  - RemoveRequestHeader=Cookie
                  - RewritePath=/catalog-service/(?<segment>.*), /$\{segment}
                  - name: CircuitBreaker
                    args:
                      name: catalogServiceCircuitBreaker
                      fallbackUri: forward:/fallback
                  - *retry-connect

            - id: catalog-service-write
              uri: lb://catalog-service
              order: -1
              predicates:
                  - Path=/catalog-service/**
                  - Method=POST,PUT,DELETE,PATCH
              filters:
                  - JwtAuthorization
                  - *rate-default
                  - RemoveRequestHeader=Cookie
                  - RewritePath=/catalog-service/(?<segment>.*), /$\{segment}
                  - name: CircuitBreaker
                    args:
                      name: catalogServiceCircuitBreaker
                      fallbackUri: forward:/fallback
                  - *retry-connect

            - id: catalog-service
              uri: lb://catalog-service
              predicates:
                  - Path=/catalog-service/**
              filters:
                  - RemoveRequestHeader=Cookie
                  - RewritePath=/catalog-service/(?<segment>.*), /$\{segment}
                  - *rate-default
                  - name: CircuitBreaker
                    args:
                      name: catalogServiceCircuitBreaker
                      fallbackUri: forward:/fallback
                  - *retry-connect

            - id: cart-service
              uri: lb://cart-service
              predicates:
                  - Path=/cart-service/**
              filters:              
                  - JwtAuthorization       
                  - *rate-default
                  - RemoveRequestHeader=Cookie
                  - RewritePath=/cart-service/(?<segment>.*), /$\{segment}
                  - name: CircuitBreaker
                    args:
                      name: cartServiceCircuitBreaker
                      fallbackUri: forward:/fallback
                  - *retry-connect

            - id: coupon-service
              uri: lb://coupon-service
              predicates:
                  - Path=/coupon-service/**
              filters:
                  - JwtAuthorization
                  - RemoveRequestHeader=Cookie
                  - RewritePath=/coupon-service/(?<segment>.*), /$\{segment}
                  - *rate-default
                  - name: CircuitBreaker
                    args:
                      name: couponServiceCircuitBreaker
                      fallbackUri: forward:/fallback
                  - *retry-connect
            - id: notification-service
              uri: lb://notification-service
              predicates:
                  - Path=/notification-service/**
              filters:
                  - JwtAuthorization
                  - RemoveRequestHeader=Cookie
                  - RewritePath=/notification-service/(?<segment>.*), /$\{segment}
                  - *rate-default
                  - name: CircuitBreaker
                    args:
                      name: notificationServiceCircuitBreaker
                      fallbackUri: forward:/fallback
                  - *retry-connect
        

            - id: delivery-service
              uri: lb://delivery-service
              predicates:
                  - Path=/delivery-service/**
              filters:
                  - JwtAuthorization
                  - RemoveRequestHeader=Cookie
                  - RewritePath=/delivery-service/(?<segment>.*), /$\{segment}
                  - *rate-default
                  - name: CircuitBreaker
                    args:
                      name: deliveryServiceCircuitBreaker
                      fallbackUri: forward:/fallback
                  - *retry-connect
        

            # ── Stripe 웹훅 — 인증 없는 공개 경로 ───────────────────────────────
            #
            # 🔒 Stripe 는 우리 토큰을 가질 수 없으므로 JwtAuthorization 을 걸 수 없다.
            #    "정말 Stripe 가 보냈는가" 는 **Stripe-Signature 헤더의 HMAC 서명**이 답하고,
            #    order-service 의 StripeWebhookVerifier 가 그것을 검증한다. 검증을 건너뛰면
            #    이 URL 에 JSON 을 POST 하는 것만으로 결제가 조작된다.
            #
            # ⚠️ **order-service 라우트보다 위에 있어야 한다.** 아래 라우트가 /order-service/**
            #    를 전부 잡으므로, 순서가 바뀌면 이 경로도 JwtAuthorization 을 타고 401 이 된다.
            #    Stripe 는 401 을 받으면 재시도하다 포기하고, 그 결과는 "결제는 됐는데 주문에
            #    반영이 안 된다" 로 나타난다.
            #
            # RemoveRequestHeader=Cookie 는 그대로 둔다. 서명 대상은 본문이라 영향이 없다.
            # 포트원 웹훅 — 같은 이유로 공개다. ⚠️ 포트원 V1 은 서명이 없으므로 이 경로는
            # **본문을 단서로만** 쓴다(imp_uid 하나만 취하고 포트원 API 에 다시 조회한다).
            # 근거는 PortOnePaymentService 주석에 있다.
            # [JA] ── Stripe Webhook — 認証のない公開パス ── 🔒 Stripe はこちらのトークンを持てないので JwtAuthorization をかけられない。
            #      「本当に Stripe が送ったか」は**Stripe-Signature ヘッダーの HMAC 署名**が答え、order-service の StripeWebhookVerifier がそれを検証する。検証を飛ばすと
            #      この URL に JSON を POST するだけで決済が操作される。
            #      ⚠️ **order-service ルートより上になければならない。** 下のルートが /order-service/** をすべて捕まえるので、順序が変わるとこのパスも JwtAuthorization を通って 401 になる。
            #      Stripe は 401 を受けると再試行してから諦め、その結果は「決済はされたのに注文に反映されない」として現れる。
            #      RemoveRequestHeader=Cookie はそのままにする。署名対象は本文なので影響がない。
            #      PortOne Webhook — 同じ理由で公開である。⚠️ PortOne V1 は署名がないので、このパスは**本文を手がかりとしてだけ**使う(imp_uid 一つだけを取り PortOne API に再照会する)。
            #      根拠は PortOnePaymentService のコメントにある。
            - id: order-service-portone-webhook
              uri: lb://order-service
              # order-service(/order-service/**) 가 이 경로를 덮는다 — 순서를 숫자로 고정한다(선언 순서에 기대지 않는다).
              # [JA] order-service(/order-service/**)がこのパスを覆う — 順序を数字で固定する(宣言順に頼らない)。
              order: -1
              predicates:
                  - Path=/order-service/api/order/payment/portone/webhook
              filters:
                  - RemoveRequestHeader=Cookie
                  - RewritePath=/order-service/(?<segment>.*), /$\{segment}
                  - *rate-default
                  - name: CircuitBreaker
                    args:
                      name: orderServiceCircuitBreaker
                      fallbackUri: forward:/fallback
                  - *retry-connect

            # PayPal 웹훅(5단계 14) — 같은 이유로 공개다. 서명은 order-service 가 PayPal 의 verify-webhook-signature 로 확인한다.
            # [JA] PayPal のウェブフック — 同じ理由で公開。署名は order-service が PayPal に問う。
            - id: order-service-paypal-webhook
              uri: lb://order-service
              order: -1
              predicates:
                  - Path=/order-service/api/order/payment/paypal/webhook
              filters:
                  - RemoveRequestHeader=Cookie
                  - RewritePath=/order-service/(?<segment>.*), /$\{segment}
                  - *rate-default
                  - name: CircuitBreaker
                    args:
                      name: orderServiceCircuitBreaker
                      fallbackUri: forward:/fallback
                  - *retry-connect

            - id: order-service-stripe-webhook
              uri: lb://order-service
              # order-service(/order-service/**) 가 이 경로를 덮는다 — 순서를 숫자로 고정한다(선언 순서에 기대지 않는다).
              # [JA] order-service(/order-service/**)がこのパスを覆う — 順序を数字で固定する(宣言順に頼らない)。
              order: -1
              predicates:
                  - Path=/order-service/api/order/payment/stripe/webhook
              filters:
                  - RemoveRequestHeader=Cookie
                  - RewritePath=/order-service/(?<segment>.*), /$\{segment}
                  - *rate-default
                  - name: CircuitBreaker
                    args:
                      name: orderServiceCircuitBreaker
                      fallbackUri: forward:/fallback
                  - *retry-connect

            - id: order-service
              uri: lb://order-service
              predicates:
                  - Path=/order-service/**
              filters:
                  - JwtAuthorization
                  - RemoveRequestHeader=Cookie
                  - RewritePath=/order-service/(?<segment>.*), /$\{segment}
                  - *rate-default
                  - name: CircuitBreaker
                    args:
                      name: orderServiceCircuitBreaker
                      fallbackUri: forward:/fallback
                  - *retry-connect

            # 주문 진행 읽기 모델(docs/76) — saga-projection 의 대화형 조회. JwtAuthorization 이 User-Id 를 넣고,
            # 서비스가 주문의 customerId 와 대조한다(남의 주문은 404). 조회 전용(GET).
            # [JA] 注文進行の読み取りモデル(docs/76) — saga-projection の対話型照会。JwtAuthorization が User-Id を入れ、
            #      サービスが注文の customerId と照合する(他人の注文は 404)。
            - id: saga-projection
              uri: lb://saga-projection
              predicates:
                  - Path=/saga-projection/api/saga/**
                  - Method=GET
              filters:
                  - JwtAuthorization
                  - RemoveRequestHeader=Cookie
                  - RewritePath=/saga-projection/(?<segment>.*), /$\{segment}
                  - *rate-default
                  - name: CircuitBreaker
                    args:
                      name: sagaProjectionCircuitBreaker
                      fallbackUri: forward:/fallback
                  - *retry-connect

            - id: pay-service
              uri: lb://pay-service
              predicates:
                  - Path=/pay-service/**
              filters:
                  - JwtAuthorization
                  - RemoveRequestHeader=Cookie
                  - RewritePath=/pay-service/(?<segment>.*), /$\{segment}
                  - *rate-default
                  - name: CircuitBreaker
                    args:
                      name: payServiceCircuitBreaker
                      fallbackUri: forward:/fallback
                  - *retry-connect

            # chat-service-ws: WebSocket 핸드셰이크(장수명 커넥션)이므로 서킷브레이커를 적용하지 않는다.
            # (요청 지속시간이 곧 연결 지속시간이 되어 slow-call 로 오탐된다.)
            #
            # ⚠️ 두 chat 라우트의 uri 가 `lb:ws://` 였다. 운영(Eureka)에서는 동작했다 — 게이트웨이는 인스턴스가 알리는 스킴(https)을
            #    먼저 쓰고(DelegatingServiceInstance), `lb:ws` 의 ws 는 인스턴스가 스킴을 모를 때만 쓴다. 그런 디스커버리(simple ·
            #    테스트)에서는 모든 요청이 WebSocket 핸드셰이크가 되어 일반 GET 400 · POST 405, 업그레이드는 TLS 포트에 평문 ws 였다.
            #    `lb://` 는 어느 디스커버리에서도 일반 요청은 https, 업그레이드는 게이트웨이가 wss 로 바꾼다(ChatRouteTlsTest).
            # [JA] 以前は lb:ws://。運用(Eureka)ではインスタンスが知らせるスキーム(https)が優先され動いていた。スキームを知らせない
            #      ディスカバリーでは GET 400 · POST 405、WebSocket は平文だった。lb:// ならどのディスカバリーでも https / wss。
            - id: chat-service-ws
              uri: lb://chat-service
              predicates:
                  - Path=/chat-service/chat/**
              filters:
                  - RemoveRequestHeader=Cookie
                  - RewritePath=/chat-service/(?<segment>.*), /$\{segment}
                  - *rate-default

            - id: chat-service-api
              uri: lb://chat-service
              predicates:
                  - Path=/chat-service/api/**
              filters:
                  - JwtAuthorization
                  - RemoveRequestHeader=Cookie
                  - RewritePath=/chat-service/(?<segment>.*), /$\{segment}
                  - *rate-default
                  - name: CircuitBreaker
                    args:
                      name: chatApiCircuitBreaker
                      fallbackUri: forward:/fallback
                  - *retry-connect


      # rabbitmq:
      #   host: localhost
      #   port: 5672
      #   username: 
      #   password: 

# 로그인 해제 뒤의 액세스 토큰을 HTTP 에서도 바로 401(JwtAuthorizationGatewayFilterFactory#sessionStillValid, docs/57 §22) —
# user-service 가 쓰는 auth:cutoff:<uid> 보다 이른 iat 를 거절한다. Redis 가 이 상한을 넘기거나 실패하면 막지 않는다(만료가 15분 상한).
# [JA] ログイン解除後のアクセストークンを HTTP でもすぐ 401。Redis が上限を超える · 失敗するときは通す。
gateway:
  session-cutoff:
    enabled: ${GATEWAY_SESSION_CUTOFF_ENABLED:true}
    timeout: ${GATEWAY_SESSION_CUTOFF_TIMEOUT:300ms}

resilience4j:
  # 동시 호출 상한(벌크헤드) — 회로 차단기 이름(라우트의 CircuitBreaker name)마다, 게이트웨이 파드마다 하나.
  # 🐛 예전에는 이 항목이 없어 Spring Cloud CircuitBreaker 가 resilience4j-bulkhead 의 기본값(동시 25 · 대기 0)을 그대로 썼다 —
  #    값이 왜 25 인지 아무도 정한 적이 없었다. 2026-10-18 부하 시험(docs/83 §5)에서 catalog 가 느려지자 26번째 호출부터 503 이었다.
  #
  # 값은 재서 정했다(같은 browse · catalog · 게이트웨이 레플리카 2 · 최고 요청 ~500/초):
  #   · 25  — 실패 1.06%, p95 267ms · p99 506ms. catalog 바쁜 스레드 최대 46, DB 커넥션 대기 최대 30.
  #   · 100 — 실패 1.71%, p95 814ms · p99 1,498ms. 바쁜 스레드 128, DB 대기 113, catalog p95 0.03 → 1.3초 — 그리고 결국 100 도 다 찼다.
  #   catalog 는 CPU(1 코어)가 먼저 차는 서비스라, 상한을 올리면 처리량은 그대로고 catalog 안에 줄만 선다 — 지연이 늘수록 걸려 있는
  #   호출이 늘어(리틀의 법칙: 동시 = 초당 요청 × 응답 시간) 더 큰 상한도 결국 넘친다. 그래서 상한은 "하류가 정상일 때의 응답 시간"으로 잡는다:
  #   파드당 ~250/초 × 정상 응답 ~0.1초(p95 30ms 대의 몇 배) ≈ 25. 그보다 많이 걸려 있으면 하류가 밀리는 중이니 기다리게 하지 않고 바로 끊는다(대기 0).
  #   용량이 모자라면 상한이 아니라 파드를 늘린다(레플리카 3: 실패 0.14%, docs/83 §5). 측정할 때는 GATEWAY_BULKHEAD_MAX_CONCURRENT 로 바꾼다.
  # [JA] 同時呼び出し上限(バルクヘッド)— サーキットブレーカー名(ルートの CircuitBreaker name)ごと、ゲートウェイ Pod ごとに一つ。
  #      🐛 以前はこの項目がなく、Spring Cloud CircuitBreaker が resilience4j-bulkhead の既定値(同時 25 · 待機 0)をそのまま使っていた —
  #      なぜ 25 なのか誰も決めたことがなかった。2026-10-18 負荷試験(docs/83 §5)で catalog が遅くなると 26 番目の呼び出しから 503 だった。
  #      値は測って決めた(同じ browse · catalog · ゲートウェイのレプリカ 2 · 最高リクエスト ~500/秒):
  #        · 25  — 失敗 1.06%、p95 267ms · p99 506ms。catalog の忙しいスレッド最大 46、DB コネクション待ち最大 30。
  #        · 100 — 失敗 1.71%、p95 814ms · p99 1,498ms。忙しいスレッド 128、DB 待ち 113、catalog p95 0.03 → 1.3 秒 — そして結局 100 も埋まった。
  #      catalog は CPU(1 コア)が先に詰まるサービスなので、上限を上げても処理量は同じで catalog の中に列が並ぶだけ — 遅延が増えるほど
  #      掛かっている呼び出しが増え(リトルの法則: 同時 = 毎秒リクエスト × 応答時間)、より大きな上限も結局あふれる。そこで上限は
  #      「下流が正常なときの応答時間」で取る: Pod あたり ~250/秒 × 正常応答 ~0.1 秒(p95 30ms 台の数倍)≈ 25。それより多く掛かって
  #      いれば下流が詰まっている最中なので、待たせずにすぐ切る(待機 0)。容量が足りなければ上限ではなく Pod を増やす(レプリカ 3: 失敗 0.14%、
  #      docs/83 §5)。計測するときは GATEWAY_BULKHEAD_MAX_CONCURRENT で変える。
  # [JA] 同時呼び出し上限(バルクヘッド)。以前は未設定で既定値のままだった。測って決めた: 25 は失敗 1.06% · p95 267ms、100 は 1.71% · 814ms —
  #      CPU が先に詰まる下流では上限を上げても列が延びるだけ。値 = Pod あたり ~250/秒 × 正常時の応答 ~0.1 秒 ≈ 25。足りなければ Pod を増やす。
  # [JA] 同時呼び出し上限(バルクヘッド)。以前は未設定で既定値のままだった。測って決めた: 25 は失敗 1.06% · p95 267ms、100 は 1.71% · 814ms —
  #      CPU が先に詰まる下流では上限を上げても列が延びるだけ。値 = Pod あたり ~250/秒 × 正常時の応答 ~0.1 秒 ≈ 25。足りなければ Pod を増やす。
  bulkhead:
    configs:
      default:
        max-concurrent-calls: ${GATEWAY_BULKHEAD_MAX_CONCURRENT:25}
        # ⚠️ 0 밖으로 올리지 않는다 — resilience4j 2.2 의 대기는 semaphore.tryAcquire(대기) 로 **부른 스레드를 막는다**(reactive 의 MonoBulkhead 도
        #    같다). 게이트웨이에서 그 스레드는 Netty · Lettuce 이벤트 루프다(2026-11-21 운영 읽기 천장의 503 은 lettuce-nioEventLoop 에서 났다) —
        #    격벽이 찰 때마다 Redis 연결 전체(유입 제한 · 로그인 해제 확인)가 멈춘다. 순간 넘침은 파드 · 상한으로 다룬다(docs/95 §5).
        #    [JA] 0 より上げない — 待ちは呼んだスレッド(Netty · Lettuce のイベントループ)を塞ぐ。
        max-wait-duration: 0ms

  timelimiter:
    configs:
      default:
        # ⚠️ 이 값을 적지 않으면 Resilience4j 기본값 **1초**가 적용된다. 그 1초는
        #    JVM 서비스 호출에 턱없이 짧다 — Eureka 로 인스턴스를 고르고 TLS 핸드셰이크를
        #    하고 JPA 쿼리까지 도는 시간이다. 실제로 /api/content/home 이 파드 직접 호출로는
        #    0.3초인데 게이트웨이로는 전부 503 이 났다. 게이트웨이 로그에 그대로 남는다:
        #    "Did not observe any item or terminal signal within 1000ms in 'circuitBreaker'".
        #
        #    10초는 아래 slow-call-duration-threshold 와 같은 값이다. 그보다 짧으면
        #    "느린 호출"이 집계되기 전에 잘려 나가 서킷이 느려짐을 영영 학습하지 못한다.
        #    프론트 axios 기본 타임아웃(15초)보다는 짧아야 사용자가 우리 쪽 응답을 받는다.
        # [JA] ⚠️ この値を書かないと Resilience4j のデフォルト**1秒**が適用される。その 1秒は JVM サービス呼び出しには短すぎる — Eureka でインスタンスを選び TLS ハンドシェイクをし
        #      JPA クエリまで回る時間だ。実際 /api/content/home がポッド直接呼び出しでは 0.3 秒なのに、ゲートウェイ経由ではすべて 503 になった。ゲートウェイのログにそのまま残る:
        #      "Did not observe any item or terminal signal within 1000ms in 'circuitBreaker'"。
        #      10秒は下の slow-call-duration-threshold と同じ値である。それより短いと「遅い呼び出し」が集計される前に切られ、サーキットが遅延を永遠に学習しない。
        #      フロントの axios デフォルトタイムアウト(15秒)よりは短くないとユーザーがこちらの応答を受け取れない。
        timeout-duration: ${GATEWAY_TIMEOUT:10s}
        cancel-running-future: false

  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        allow-health-indicator-to-fail: false
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 10s 
        wait-duration-in-open-state: 10s
        automatic-transition-from-open-to-half-open-enabled: false
        permitted-number-of-calls-in-half-open-state:
        record-exceptions:
          - java.util.concurrent.TimeoutException
          - org.springframework.cloud.gateway.support.NotFoundException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException 

    instances:
      defaultCircuitBreaker:
        baseConfig: default  
        failure-rate-threshold: 50


