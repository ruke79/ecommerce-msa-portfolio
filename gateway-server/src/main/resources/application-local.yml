password: 선택된 개인 키에 접근하기 위한 비밀번호입니다.

eureka:
  instance:
    prefer-ip-address: false 
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}

    non-secure-port-enabled : false
    secure-port-enabled : true
    secure-port : 8000




    # 🐛 여기에 `tls:` 블록이 있었다 — `eureka.instance` 아래라 **eureka.instance.tls** 가 되어 아무도 읽지 않았다(클라이언트 TLS 는
    #    eureka.client.tls). 게이트웨이의 Eureka 클라이언트는 인증서 없이 붙고 있었다. 이제 공통 설정(application-common.yml 의
    #    eureka.client.tls — 이 파일보다 우선한다)이 신원 인증서(/app/identity, CN=gateway-server)를 낸다(docs/57 §16 "Eureka 쓰기").
    # [JA] ここにあった tls ブロックは eureka.instance の下で誰も読まなかった。今は共通設定の eureka.client.tls が身元証明書を出す。
    
