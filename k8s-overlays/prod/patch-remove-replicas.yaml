# replicas 필드를 지운다 — HPA 가 소유한다.
#
# 남겨 두면 `kubectl apply` 마다 매니페스트 값(2)으로 되돌아갔다가 HPA 가 다시 올린다.
# 부하로 6개까지 늘어난 상태에서 배포하면 그 순간 2로 떨어진다.
# [JA] replicas フィールドを消す — HPA が所有する。
#      残しておくと `kubectl apply` のたびにマニフェストの値(2)に戻ってから HPA がまた上げる。
#      負荷で 6 つまで増えた状態でデプロイするとその瞬間 2 に落ちる。
- op: remove
  path: /spec/replicas
