# Cloudflare Tunnel — 공인 IP·로드밸런서 없이 외부에서 접속한다.
#
# ── 왜 이걸 쓰나 (ALB + ACM 대신) ───────────────────────────────────────
#
# 이 프로젝트의 운영 대상은 OCI Ampere 프리티어다. AWS ALB 는 그 위에 붙일 수 없고,
# OCI 의 무료 LB 는 대역이 10Mbps 로 제한된다. 그리고 어느 쪽이든 **인스턴스에 인바운드
# 포트를 열어야 한다** — 공개 IP 에 80/443 을 여는 순간 스캐너가 붙는다.
#
# 터널은 반대다. cloudflared 가 **밖으로** 나가서 Cloudflare 엣지에 연결을 유지하고,
# 트래픽은 그 연결을 타고 들어온다. 결과:
#
#   · 인바운드 포트 0개. OCI Security List 에 80/443 을 열 필요가 없다
#   · TLS 는 Cloudflare 가 종단한다 — 인증서 발급·갱신이 없다(ACM 도 cert-manager 도 불필요)
#   · 공인 IP 가 바뀌어도 상관없다. DNS 도 Cloudflare 가 CNAME 으로 관리한다
#   · 무료
#
# 대가도 분명하다:
#   · Cloudflare 에 의존한다. 엣지 장애 = 서비스 장애
#   · 평문 HTTP 로 클러스터 안에 들어온다(아래 §ingress 주석)
#   · 무료 플랜은 업로드 100MB 제한이 있다 — 상품 이미지 업로드에 걸릴 수 있다
#
# ── 트래픽 경로 ────────────────────────────────────────────────────────
#
#   사용자 → Cloudflare 엣지 → (터널) → cloudflared 파드
#          → traefik(k3s 내장) → k8s/60-ingress.yaml 규칙 → frontend / gateway
#
# Ingress 를 그대로 통과시키는 이유: 호스트·경로 라우팅을 이미 60-ingress.yaml 이 갖고 있다.
# 터널에서 서비스로 직접 쏘면 그 규칙을 터널 설정에 복제하게 되고, 반드시 어긋난다.
#
# ── 먼저 할 일 ─────────────────────────────────────────────────────────
#
#   ops/24-cloudflare-tunnel.sh   터널 생성 + 자격증명 Secret 주입 + DNS 라우트
#
# 그 스크립트가 만드는 Secret(cloudflared-credentials)이 없으면 파드는 CrashLoopBackOff 다.
# [JA] Cloudflare Tunnel — 公開 IP・ロードバランサーなしで外部から接続する。
#      ── なぜこれを使うか(ALB + ACM の代わりに) ──
#      このプロジェクトの運用対象は OCI Ampere の無料枠である。AWS ALB はその上に付けられず、
#      OCI の無料 LB は帯域が 10Mbps に制限される。そしてどちらにしても**インスタンスにインバウンド
#      ポートを開けなければならない** — 公開 IP に 80/443 を開けた瞬間スキャナーが寄ってくる。
#      トンネルは逆である。cloudflared が**外へ**出て Cloudflare エッジへの接続を維持し、
#      トラフィックはその接続に乗って入ってくる。結果:
#        · インバウンドポート 0 個。OCI Security List に 80/443 を開ける必要がない
#        · TLS は Cloudflare が終端する — 証明書の発行・更新がない(ACM も cert-manager も不要)
#        · 公開 IP が変わっても構わない。DNS も Cloudflare が CNAME で管理する
#        · 無料
#      代償もはっきりしている:
#        · Cloudflare に依存する。エッジ障害 = サービス障害
#        · 平文 HTTP でクラスタ内に入ってくる(下記 §ingress のコメント)
#        · 無料プランはアップロード 100MB 制限がある — 商品画像のアップロードに引っかかりうる
#      ── トラフィック経路 ──
#        ユーザー → Cloudflare エッジ → (トンネル) → cloudflared ポッド
#               → traefik(k3s 内蔵) → k8s/60-ingress.yaml のルール → frontend / gateway
#      Ingress をそのまま通す理由: ホスト・パスのルーティングは既に 60-ingress.yaml が持っている。
#      トンネルからサービスへ直接送るとそのルールをトンネル設定に複製することになり、必ずずれる。
#      ── 先にやること ──
#        ops/24-cloudflare-tunnel.sh   トンネル作成 + 資格情報 Secret 注入 + DNS ルート
#      そのスクリプトが作る Secret(cloudflared-credentials)がなければポッドは CrashLoopBackOff である。
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: ecommerce
data:
  config.yaml: |
    # 터널 UUID. ops/24 가 실제 값으로 치환한다.
    # [JA] トンネル UUID。ops/24 が実際の値に置き換える。
    tunnel: REPLACE_ME_TUNNEL_ID
    credentials-file: /etc/cloudflared/creds/credentials.json

    # 엣지 연결. 기본값이면 한 곳에만 붙어 그 리전이 흔들릴 때 끊긴다.
    # [JA] エッジ接続。既定値だと 1 か所にしかつながらず、そのリージョンが揺らぐと切れる。
    protocol: quic
    ha-connections: 4

    # 메트릭 — 아래 프로브가 이 포트를 쓴다.
    # [JA] メトリクス — 下のプローブがこのポートを使う。
    metrics: 0.0.0.0:2000
    no-autoupdate: true

    ingress:
      # ── ① API 는 게이트웨이로 직접 보낸다 ─────────────────────────────
      #
      # ⚠️ 이 규칙이 없으면 **API 가 아예 외부에서 닿지 않는다.** 이유가 둘 겹친다:
      #
      #   · k8s/60-ingress.yaml 의 규칙은 `/` → frontend **하나뿐**이다. 게이트웨이
      #     경로가 없어서 /user-service/... 가 프론트엔드로 가 404 가 난다
      #   · k8s/31-gateway-server.yaml 의 Service 는 ClusterIP 다(B-85 — 예전 LoadBalancer 는 ops/23 의
      #     `--disable servicelb` 로 외부 IP 는 없이 nodePort 만 모든 노드에 열었다). 바깥에서는 이 터널로만 닿는다
      #
      # traefik 을 거치지 않고 여기서 바로 보내는 이유: 게이트웨이는 **스스로 HTTPS 를
      # 종단한다**(profile local 의 server.ssl, 포트 8000). 표준 Ingress 는 백엔드로
      # 평문 HTTP 를 보내므로 그대로는 붙지 않고, traefik 에 ServersTransport 를 따로
      # 만들어야 한다. cloudflared 는 originRequest 로 한 줄이면 된다.
      #
      # 호스트명을 하나로 유지하는 것이 중요하다 — 프론트엔드와 API 가 **동일 출처**라
      # CORS 설정이 필요 없고, 무료 Universal SSL 의 서브도메인 한 단계 제약도 안 걸린다.
      # 그래서 REACT_APP_API_URL 은 그냥 `https://<도메인>` 이다(docs/33 §6).
      #
      # path 는 정규식이다. 게이트웨이의 Path 술어와 같은 접두사를 쓴다 — 게이트웨이에 접두사를 더하면 여기도(B-82 가 대조한다).
      # 🐛 saga-projection(주문 진행 타임라인, docs/76)이 빠져 있었다 — /saga-projection/... 이 traefik → 프론트 nginx 로 가
      #    index.html 200 을 받았다(try_files). 게이트웨이까지 오지도 않아 서버 로그에도 없었다.
      # [JA] ── ① API はゲートウェイへ直接送る ──
      #      ⚠️ この規則がないと API はまったく外部から届かない。理由が二つ重なる:
      #        · k8s/60-ingress.yaml の規則は `/` → frontend の一つだけである。ゲートウェイの経路がないため、
      #          /user-service/... がフロントエンドへ行って 404 になる
      #        · k8s/31-gateway-server.yaml の Service は ClusterIP である(B-85 — 以前の LoadBalancer は ops/23 の
      #          `--disable servicelb` により外部 IP はないまま nodePort だけを全ノードに開いていた)。外からはこのトンネルでしか届かない
      #      traefik を経由せずここから直接送る理由: ゲートウェイは自分で HTTPS を終端する(profile local の server.ssl、ポート 8000)。
      #      標準の Ingress はバックエンドへ平文 HTTP を送るのでそのままでは繋がらず、traefik に ServersTransport を別途作る必要がある。
      #      cloudflared は originRequest の一行で済む。
      #      ホスト名を一つに保つことが重要である — フロントエンドと API が同一オリジンなので CORS 設定が不要で、
      #      無料 Universal SSL のサブドメイン一段の制約にもかからない。だから REACT_APP_API_URL は単に `https://<ドメイン>` である(docs/33 §6)。
      #      path は正規表現である。ゲートウェイの Path 述語と同じ接頭辞を使う — ゲートウェイに接頭辞を足したらここにも(B-82 が照合する)。
      #      🐛 saga-projection(注文進行タイムライン、docs/76)が抜けていた — /saga-projection/... が traefik → フロントの nginx へ行き、
      #      index.html の 200 を受け取っていた(try_files)。ゲートウェイまで来ないのでサーバーログにも残らなかった。
      - path: ^/((user|catalog|cart|order|pay|coupon|chat|notification|delivery)-service|saga-projection)(/|$)
        service: https://gateway-server.ecommerce.svc.cluster.local:8000
        originRequest:
          # 게이트웨이 인증서는 ops/07 이 만든 자체 서명이다. 이 구간은 클러스터
          # 내부이고 바깥 TLS 는 Cloudflare 가 이미 종단했으므로 검증하지 않는다.
          # [JA] ゲートウェイの証明書は ops/07 が作った自己署名だ。この区間はクラスター内部で、外側の TLS は Cloudflare がすでに終端しているので検証しない。
          noTLSVerify: true
          connectTimeout: 30s
          # chat-service 의 STOMP/WebSocket 과 user-service 의 SSE 가 이 경로로 온다.
          # [JA] chat-service の STOMP/WebSocket と user-service の SSE がこの経路で来る。
          tcpKeepAlive: 30s

      # ── ② 나머지는 traefik 으로 ────────────────────────────────────────
      #
      # ⚠️ http:// 다. 이 구간은 클러스터 내부이고 TLS 는 이미 Cloudflare 가 종단했다.
      #    https 로 쓰면 traefik 의 자체 서명 인증서 때문에 실패한다(noTLSVerify 로 우회할
      #    수는 있지만 얻는 것이 없다).
      # ⚠️ **이 규칙이 마지막이어야 한다.** hostname·path 가 없으면 catch-all 이고,
      #    cloudflared 는 catch-all 뒤에 규칙이 더 있으면 기동을 거부한다:
      #
      #      Rule #2 is matching the hostname '', but this will match every hostname,
      #      meaning the rules which follow it will never be triggered.
      #
      #    예전에는 이 뒤에 `- service: http_status:404` 를 두었다. catch-all 이 필수라는
      #    것까지는 맞았지만, **이 traefik 규칙이 이미 catch-all** 이라 404 규칙이 뒤에
      #    붙는 순간 위 오류로 터널이 아예 뜨지 않았다. 404 는 필요 없다 — 매칭되지 않는
      #    경로는 traefik 이 알아서 404 를 돌려준다.
      #
      #    바꾼 뒤에는 반드시 검증할 것:
      #      cloudflared --config <파일> tunnel ingress validate
      # [JA] ── ② 残りは traefik へ。http:// だ — この区間はクラスター内部で TLS は Cloudflare がすでに終端している(https にすると traefik の自己署名証明書で失敗する)。⚠️ この規則は最後でなければならない — hostname・path がなければ catch-all で、cloudflared は catch-all の後に規則があると起動を拒否する。以前は後ろに 404 規則を置いてトンネルがまったく起動しなかった。マッチしないパスは traefik が 404 を返すので 404 規則は不要だ。変えたら必ず cloudflared tunnel ingress validate で検証する。
      - service: http://traefik.kube-system.svc.cluster.local:80
        originRequest:
          connectTimeout: 30s
          # WebSocket(chat-service)이 유휴로 끊기지 않게 한다.
          # [JA] WebSocket(chat-service)がアイドルで切れないようにする。
          tcpKeepAlive: 30s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: ecommerce
  labels:
    app: cloudflared
spec:
  # 2개 이상 두면 각각 엣지에 붙어 무중단 롤아웃이 된다.
  # cloudflared 는 같은 터널에 커넥터가 여럿 붙는 것을 허용하므로 충돌하지 않는다.
  # [JA] 2 つ以上置くとそれぞれがエッジに繋がり、無停止ロールアウトになる。
  #      cloudflared は同じトンネルに複数のコネクタが繋がることを許すので衝突しない。
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0   # 배포 중에도 최소 1개는 붙어 있게 ／ [JA] デプロイ中も最低 1 つは繋がっているように
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      # 같은 노드에 몰리면 노드 하나가 빠질 때 터널이 통째로 끊긴다.
      # [JA] 同じノードに集まると、ノード 1 つが抜けたときにトンネルが丸ごと切れる。
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: cloudflared
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: cloudflared
          # ⚠️ 태그를 고정한다. latest 는 롤백이 불가능하고 노드마다 다른 버전이 돌 수 있다.
          # [JA] ⚠️ タグを固定する。latest はロールバックできず、ノードごとに違うバージョンが動きうる。
          image: cloudflare/cloudflared:2024.8.3
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config/config.yaml
            - run
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true
            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: cloudflared-config
        - name: creds
          secret:
            # ops/24-cloudflare-tunnel.sh 가 만든다. 없으면 파드가 뜨지 않는다.
            # ⚠️ 이 Secret 은 **절대 커밋하지 않는다** — 터널 자격증명이다.
            # [JA] ops/24-cloudflare-tunnel.sh が作る。なければポッドが起動しない。
            #      ⚠️ この Secret は**決してコミットしない** — トンネルの資格情報である。
            secretName: cloudflared-credentials
