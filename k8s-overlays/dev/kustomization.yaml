# dev 오버레이 — 노트북 한 대에서 전부 돌린다.
#
#   kubectl apply -k k8s-overlays/dev
#
# 🔴 **위 apply 는 최초 배포에서만 쓴다.** 아래 `images:` 의 `newTag` 는 손으로 적어 둔
#    값이라 금방 낡는다. 배포한 뒤 이 파일을 그대로 apply 하면 전 서비스가 **그 옛 태그로
#    되돌아간다** — 실패도 롤백도 아니고 적힌 대로 적용된 것이라, 증상은 "배포가 이상하다"
#    로만 보인다(실제로 프론트엔드가 몇 주 전 버전으로 돌아갔다). 두 번째부터는:
#
#      ./ops/28-deploy.sh dev <커밋SHA12자>                   # 배포
#      ./ops/28-deploy.sh dev --config-only                   # 설정만(이미지 유지)
#      ./ops/28-deploy.sh dev --config-only --restart <deploy> # 값을 읽히려면 재시작
#
#    ops/28 은 배포할 버전(또는 클러스터에서 읽은 현재 버전)으로 태그를 덮어써 적용한다.
#
# ── 무엇이 prod 와 다른가 ──────────────────────────────────────────────
#
#   레플리카      전부 1. 아래 §replicas 참조
#   리소스        요청을 크게 낮춘다. 24GB 맥북에서 12개 서비스 + 인프라 5종이 함께 뜬다
#   인프라        Kafka/PG/Redis/Mongo/ES 를 클러스터 안에 띄운다(90-dev-infra, 아래 참조)
#   HPA           없다. metrics-server 가 없으면 HPA 는 <unknown> 으로 멈춰 있을 뿐이다
#   백업 CronJob  없다
#
# ── 왜 레플리카 1인가 (단순히 "개발이니까"가 아니다) ─────────────────────
#
# 이 저장소는 레플리카를 2로 올렸을 때 조용히 깨지는 버그를 여럿 겪었다(docs/21):
# 아웃박스 폴러가 레플리카마다 같은 이벤트를 발행했고, SMS·메일 디스패처도 잠금이 없으면
# 같은 행을 두 번 집었다. 그건 **prod 에서 잡아야 할 문제**이고, 그래서 prod 오버레이는
# 2 이상을 유지한다.
#
# dev 를 1로 두는 것은 자원 때문이다. 다만 그 결과 **dev 에서는 그 부류의 버그가 절대
# 재현되지 않는다**는 점을 알고 있어야 한다. 동시성 문제를 확인하려면 prod 오버레이나
# ops/12-staging-rehearsal.sh 를 써야 한다.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ecommerce

# ⚠️ 오버레이가 k8s/ **밖에** 있는 이유. kustomize 는 베이스 루트 안에 오버레이가 있으면
#    순환으로 보고 거부한다:
#
#      cycle detected: candidate root '.../k8s' contains visited root '.../k8s/overlays/dev'
#
#    보통은 매니페스트를 k8s/base/ 로 옮겨 해결하지만, 이 저장소는 ops/13·README·docs 등
#    50곳 가까이가 `k8s/40-user-service.yaml` 같은 경로를 직접 참조한다. 그걸 전부 고치는
#    비용이 더 크다고 봤다. 오버레이만 밖으로 빼면 참조는 하나도 건드리지 않아도 된다.
resources:
  - ../../k8s               # 베이스 (k8s/kustomization.yaml)

# ⚠️ 90-dev-infra.yaml 은 여기 없다. kustomize 는 오버레이 밖의 **낱개 파일**을 참조하지
#    못하고(디렉터리 베이스만 가능), 그 파일을 위해 별도 kustomization 루트를 하나 더 만드는
#    것은 얻는 것에 비해 복잡하다. dev 인프라는 지금도 ops/13-k3s-deploy.sh 가 직접 적용하고
#    있으므로 그대로 둔다:
#
#      kubectl apply -f k8s/90-dev-infra.yaml
#      kubectl apply -k k8s-overlays/dev

# ── 레플리카 ───────────────────────────────────────────────────────────
# 베이스에 replicas 가 적혀 있으므로 여기서 덮어쓴다. HPA 가 없으니 충돌하지 않는다.
replicas:
  - name: gateway-server
    count: 1
  - name: user-service
    count: 1
  - name: catalog-service
    count: 1
  - name: cart-service
    count: 1
  - name: order-service
    count: 1
  - name: pay-service
    count: 1
  - name: coupon-service
    count: 1
  - name: notification-service
    count: 1
  - name: delivery-service
    count: 1
  # 노트북 한 대에서는 대기 복제본이 의미가 없다 — 활성 1개만.
  - name: saga-projection
    count: 1
  - name: frontend
    count: 1

# ── 이미지 ─────────────────────────────────────────────────────────────
# ops/13-k3s-deploy.sh 가 이미지를 k3s 안으로 직접 넣는 방식과 맞춘다(레지스트리 없음).
# newTag 를 바꾸려면 여기만 고치면 된다.
images:
  - name: REGISTRY_PLACEHOLDER/ecommerce-msa/eureka-server
    newName: ecommerce-msa/eureka-server
    newTag: local
  - name: REGISTRY_PLACEHOLDER/ecommerce-msa/gateway-server
    newName: ecommerce-msa/gateway-server
    newTag: local
  - name: REGISTRY_PLACEHOLDER/ecommerce-msa/user-service
    newName: ecommerce-msa/user-service
    newTag: local
  - name: REGISTRY_PLACEHOLDER/ecommerce-msa/catalog-service
    newName: ecommerce-msa/catalog-service
    newTag: local
  - name: REGISTRY_PLACEHOLDER/ecommerce-msa/cart-service
    newName: ecommerce-msa/cart-service
    newTag: local
  - name: REGISTRY_PLACEHOLDER/ecommerce-msa/order-service
    newName: ecommerce-msa/order-service
    newTag: local
  - name: REGISTRY_PLACEHOLDER/ecommerce-msa/pay-service
    newName: ecommerce-msa/pay-service
    newTag: local
  - name: REGISTRY_PLACEHOLDER/ecommerce-msa/coupon-service
    newName: ecommerce-msa/coupon-service
    newTag: local
  - name: REGISTRY_PLACEHOLDER/ecommerce-msa/chat-service
    newName: ecommerce-msa/chat-service
    newTag: local
  - name: REGISTRY_PLACEHOLDER/ecommerce-msa/notification-service
    newName: ecommerce-msa/notification-service
    newTag: local
  - name: REGISTRY_PLACEHOLDER/ecommerce-msa/delivery-service
    newName: ecommerce-msa/delivery-service
    newTag: local
  - name: REGISTRY_PLACEHOLDER/ecommerce-msa/saga-projection
    newName: ecommerce-msa/saga-projection
    newTag: local
  - name: REGISTRY_PLACEHOLDER/ecommerce-msa/config-server
    newName: ecommerce-msa/config-server
    newTag: local
  - name: REGISTRY_PLACEHOLDER/ecommerce-msa/frontend
    newName: ecommerce-msa/frontend
    newTag: local

patches:
  # 요청량을 낮춰 노트북 한 대에 다 들어가게 한다.
  #
  # ⚠️ requests 만 낮추고 limits 는 그대로 둔다. requests 는 스케줄러가 "자리를 잡아 두는"
  #    값이라 낮추면 더 많이 뜨고, limits 는 실제로 쓸 수 있는 상한이라 낮추면 JVM 이
  #    OOMKilled 된다. 둘을 같이 낮추는 것이 흔한 실수다.
  - path: patch-dev-resources.yaml
    target:
      kind: Deployment
      # ⚠️ 이름 정규식으로 애플리케이션 서비스만 고른다. `kind: Deployment` 만 쓰면
      #    90-dev-infra 의 Kafka/PG/ES 까지 같이 줄어들어 인프라가 뜨지 못한다.
      #    ES 는 특히 메모리가 부족하면 부트스트랩 체크에서 바로 죽는다.
      name: "eureka-server|gateway-server|user-service|catalog-service|cart-service|order-service|pay-service|coupon-service|chat-service|notification-service|delivery-service|saga-projection|config-server|frontend"

  # 개발에서는 이미지가 로컬에 이미 있다(ops/13 이 k3s 로 임포트한다).
  # Always 로 두면 레지스트리를 찾다 ImagePullBackOff 가 된다.
  - path: patch-dev-imagepull.yaml
    target:
      kind: Deployment
      name: "eureka-server|gateway-server|user-service|catalog-service|cart-service|order-service|pay-service|coupon-service|chat-service|notification-service|delivery-service|saga-projection|config-server|frontend"
