# 요청량을 노트북 규모로 낮춘다. JSON6902 를 쓰는 이유: 전략적 머지 패치는 컨테이너를
# **이름으로** 찾는데 서비스마다 이름이 달라서 12개를 따로 써야 한다. 모든 Deployment 가
# 컨테이너 1개뿐인 것을 확인했으므로 인덱스 0으로 한 번에 처리한다.
#
# ⚠️ requests 만 낮춘다. limits 는 건드리지 않는다 —
#    requests 는 스케줄러가 잡아 두는 자리, limits 는 실제 상한이다.
#    limits 를 같이 낮추면 JVM 이 힙을 잡다 OOMKilled 된다.
- op: replace
  path: /spec/template/spec/containers/0/resources/requests/cpu
  value: "50m"
- op: replace
  path: /spec/template/spec/containers/0/resources/requests/memory
  value: "256Mi"
