# 이 환경에만 있는 엔드포인트. **커밋되지 않는다.**
#
# 비밀은 여기 두지 않는다 — 비밀번호·접속 문자열은 k8s/20-secret.yaml 이 담당한다.
# 여기 들어가는 것은 식별자뿐이다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-config
  namespace: ecommerce
data:
  # ── PostgreSQL (Neon 등) ───────────────────────────────────────────────
  #
  # ⚠️ **풀러(-pooler)가 아닌** 주소를 쓴다. 풀러는 트랜잭션 모드라 서버측 prepared
  #    statement 가 깨진다(`prepared statement "S_1" already exists`).
  # ⚠️ 콘솔의 접속 URI 를 그대로 붙여넣지 말 것 — 호스트만 떼어 낸다. `postgresql://`,
  #    `user:password@`, `:5432`, `/dbname`, `?sslmode=` 가 들어가면 안 된다.
  # ⚠️ Neon 은 **와일드카드 DNS** 라 오타가 나도 이름은 해석된다. `dig` 로는 검증되지
  #    않는다 — psql 로 실제 붙어 봐야 한다(ops/25 가 마지막에 그걸 한다).
  POSTGRES_HOST: "REPLACE_ME_your_neon_host"
  POSTGRES_PORT: "5432"

  # ── 공개 도메인 ────────────────────────────────────────────────────────
  #
  # 메일의 인증 링크·비밀번호 재설정 링크가 이 값으로 만들어진다. 틀리면 메일은
  # 정상적으로 발송되고 링크만 죽는다 — 사용자만 알고 로그에는 안 남는다.
  APP_PUBLIC_URL: "https://REPLACE_ME_your_domain"

  # ── 결제수단 스위치 (docs/49 §6) ─────────────────────────────────────────
  #
  # 🔴 k8s/10-configmap.yaml 을 직접 고치지 말 것. 그 파일은 저장소의 것이라 pull·rebase
  #    때마다 되돌아가고(실제로 겪었다), 같은 키를 두 번 적으면 kustomize 가
  #    "mapping key already defined" 로 멈춘다. 이 패치의 data 는 configmap 의 같은 키를
  #    **덮어쓴다** — 켤 것만 여기 적는다. 비밀(키·시크릿)은 k8s/20-secret.yaml.
  #
  # STRIPE_ENABLED: "true"            # STRIPE_SECRET_KEY · STRIPE_WEBHOOK_SECRET 필요
  # PORTONE_ENABLED: "true"           # v1: PORTONE_API_KEY/SECRET · v2: PORTONE_V2_* 필요
  # PORTONE_VERSION: "v1"             # 콘솔에 imp… 가 없고 store-… 만 보이면 "v2"
  # BANK_TRANSFER_BANK: "국민은행"      # 손님에게 보여 줄 상점 계좌 — 비밀이 아니다
  # BANK_TRANSFER_ACCOUNT: "000-00-0000"
  # BANK_TRANSFER_HOLDER: "예시상점"
  # PAYPAL_ENV: "sandbox"             # live 면 프론트의 REACT_APP_PAYPAL_CLIENT_ID 도 라이브 것
  # LOG_LEVEL_SQL: "warn"             # debug 로 두면 스케줄러 폴링이 로그를 덮는다

  # ── 배송 시뮬레이터 (docs/25 §11) ─────────────────────────────────────────
  #
  # 실제 택배사 없이 결제→배송→추적→알림→주문 DISPATCHED/DELIVERED 를 끝까지 돌려 본다.
  # 관리자 화면(/admin/delivery)에서 택배사 "테스트배송"(SIMULATED), 송장번호 SIM… 으로 등록하면
  # STEP_MS 마다 한 단계씩 진행된다(SIMEXC 예외, SIMFAIL 배달 실패 뒤 성공, SIMINTL 통관).
  #
  # DELIVERY_SIMULATED_ENABLED: "true"
  # DELIVERY_SIMULATED_STEP_MS: "60000"   # 1분마다 한 단계
  # DELIVERY_POLL_INTERVAL_MS: "20000"    # 폴링 주기도 그에 맞춰
