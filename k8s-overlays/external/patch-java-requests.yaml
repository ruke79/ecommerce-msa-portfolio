# CPU **요청**만 낮춘다. 상한(limits)은 건드리지 않는다.
#
# ── 왜 필요한가 ────────────────────────────────────────────────────────
#
# 베이스는 서비스당 250m 을 요청한다. 13개면 그것만으로 2,950m 이고, 여기에 클러스터
# 안 인프라(redis·kafka·ES 450m)와 k3s 내장(CoreDNS·metrics-server 200m)이 더해져
# **4 OCPU 노드에서 실측 3,980m (99%)** 이 나왔다. 파드는 뜨지만 여유가 20m 라:
#
#   · `kubectl rollout restart` 가 Pending 에서 끝나지 않는다(maxSurge 로 새 파드를
#     먼저 띄우는데 자리가 없다). 실제로 이 배포에서 롤아웃이 겹쳐 쌓였다
#   · 파드 하나가 이미지 문제로 못 뜨면 옛 ReplicaSet 이 정리되지 않아 자리를 이중으로
#     잡고, 그러면 다음 롤아웃도 막힌다 — 한 번 막히면 스스로 못 빠져나온다
#
# ── 왜 요청만 낮추나 ───────────────────────────────────────────────────
#
# 요청은 **스케줄러의 예약**이고 상한은 **실제 천장**이다. Spring Boot 서비스는 유휴
# 시 10~50m 을 쓰므로 250m 예약은 80% 이상을 놀린다. 반면 기동 순간에는 짧게 수백 m 을
# 쓰는데, 그건 상한(1,000m)이 허용한다. 즉 요청을 낮춰도 기동은 느려지지 않는다 —
# 자리가 없어 스케줄되지 못하는 쪽이 훨씬 느리다.
#
# 100m 은 유휴 사용량의 2~3배로 잡은 값이다. 더 낮추면 부하 시 서로 밀어내고,
# 더 높이면 위의 문제가 돌아온다.
#
# ⚠️ 이 값을 `kubectl patch` 로 임시로 바꾸지 말 것. 다음 `kubectl apply -k` 에 덮인다.
#    바꿔야 하면 여기서 바꾼다.
#
# ⚠️ 2 OCPU 라면 이것으로도 부족하다. `k8s-overlays/oci` 가 요청·상한·힙을 함께 조인다.

- op: replace
  path: /spec/template/spec/containers/0/resources/requests/cpu
  value: "100m"
