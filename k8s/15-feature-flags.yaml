# 기능 플래그 정의(docs/74) — flagd 형식의 부분집합. 읽는 쪽: common 의 FileFlagProvider.
#
# ── 바꾸는 법 ────────────────────────────────────────────────────────────
#   1. 이 파일의 비중(fractional)을 고쳐 커밋한다 — 바꾼 기록이 git 에 남는다
#   2. ./ops/28-deploy.sh <환경> --config-only        (--restart 는 필요 없다)
#   3. 1분 안팎에 kubelet 이 마운트된 파일을 바꾸고, 서비스가 5초 안에 다시 읽는다
#   4. Grafana "Tracing RED" · Jaeger 에서 feature_flag.result.variant 로 나눠 본다
#   🔴 `kubectl patch` · `kubectl edit` 로 고치지 않는다 — 다음 --config-only 가 git 의 값으로 되돌린다.
#
# ── 규칙 (가드 B-76) ──────────────────────────────────────────────────────
#   · 플래그마다 metadata.owner · metadata.expires(YYYY-MM-DD). 만료가 지나면 빌드가 빨갛다 —
#     다 쓴 플래그는 코드와 함께 지우고, 아직 쓰는 중이면 날짜를 미룬다(그것이 "결정" 의 기록이다)
#   · targeting 은 fractional 만 된다. 다른 규칙은 서비스가 파일 전체를 거부하고 직전 정의를 쓴다
#   · 코드의 기본값은 "플래그 이전의 동작" — 이 파일이 없거나 틀려도 서비스는 예전처럼 돈다
#   · 보안 · 결제 스위치는 플래그로 만들지 않는다(실행 중에 꺼지면 안 되는 것들 — 설정으로 둔다)
#
# ── catalog.search-engine ────────────────────────────────────────────────
#   텍스트 검색을 ES 로 할 검색어의 비율. 검색은 비로그인 경로라 사용자 대신 정규화한 검색어로 나눈다
#   (같은 검색어 = 같은 엔진 → 무한 스크롤 · 캐시가 어긋나지 않는다). ES 가 없는 배포(SEARCH_ENGINE=postgres,
#   OCI)에서는 평가하지 않는다 — 먼저 ES 를 띄우고 SEARCH_ENGINE=es 로 색인을 채운 뒤 비중을 올린다.
#
# [JA] 機能フラグ定義(docs/74) — flagd 形式のサブセット。変更はこのファイルをコミットし `ops/28 --config-only`
#      (再起動不要)。kubectl patch ・ edit で直さない。フラグごとに owner ・ expires が必要で、期限切れはビルドが
#      赤くなる(B-76)。targeting は fractional のみ。コードのデフォルト値は「フラグ導入前の動作」である。
apiVersion: v1
kind: ConfigMap
metadata:
  name: feature-flags
  namespace: ecommerce
data:
  flags.json: |
    {
      "$schema": "https://flagd.dev/schema/v0/flags.json",
      "flags": {
        "catalog.search-engine": {
          "state": "ENABLED",
          "variants": { "es": "es", "postgres": "postgres" },
          "defaultVariant": "postgres",
          "targeting": { "fractional": [ ["es", 0], ["postgres", 100] ] },
          "metadata": {
            "owner": "catalog",
            "expires": "2027-03-31",
            "description": "ES 관련도 검색으로 보낼 검색어의 비율 (docs/74 · docs/13)"
          }
        }
      }
    }
