apiVersion: apps/v1
kind: Deployment
metadata:
  name: coupon-service
  namespace: ecommerce
  labels:
    app: coupon-service
  annotations:
    # 신원 인증서가 갱신되면(cert-manager — k8s/96) 롤링 재시작 — 자바는 keystore 를 기동할 때만 읽는다. Reloader 가 없으면 아무 일도 없다.
    # [JA] 身元証明書が更新されたら(cert-manager — k8s/96)ローリング再起動 — Java は keystore を起動時にしか読まない。Reloader がなければ何も起きない。
    secret.reloader.stakater.com/reload: "tls-id-coupon-service"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: coupon-service
  template:
    metadata:
      labels:
        app: coupon-service
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: coupon-service
          # 이미지는 ops/19-build-images.sh 가 ops/Dockerfile.runtime 으로 만든다(CI 와 같은 경로 — 모듈별 Dockerfile 은 지웠다).
          # [JA] イメージは ops/19-build-images.sh が ops/Dockerfile.runtime で作る(CI と同じ経路 — モジュール別の Dockerfile は消した)。
          image: REGISTRY_PLACEHOLDER/ecommerce-msa/coupon-service:1.0.0
          ports:
            - containerPort: 8183
            # 관리 포트(actuator) — 프로브 · 지표 에이전트만. 앱 포트에는 /actuator 가 없다(B-119, docs/57 §25).
            # [JA] 管理ポート(actuator) — プローブ · 指標エージェントだけ。アプリのポートには /actuator がない。
            - name: management
              containerPort: 9180
          envFrom:
            - configMapRef:
                name: ecommerce-config
            - secretRef:
                name: ecommerce-secrets
          env:
            # actuator 를 앱 포트에서 떼어 관리 포트로(B-119) — 같은 네임스페이스의 다른 파드는 이 포트에 닿지 못한다(k8s/95).
            # TLS(server.ssl) · 보안 규칙은 앱 포트의 것을 그대로 물려받는다. [JA] actuator を管理ポートへ分ける。
            - name: MANAGEMENT_SERVER_PORT
              value: "9180"
            # Eureka 등록 · 하트비트에 내는 클라이언트 인증서 = 이 서비스의 신원(/app/identity, CN=서비스 이름). Eureka 는 등록부를 바꾸는
            # 요청을 그 CN 이 앱 이름과 같을 때만 받는다(EUREKA_WRITE_AUTH_MODE, docs/57 §16 "Eureka 쓰기"). JVM 키스토어는 Eureka
            # 클라이언트가 쓰지 않는다 — 설정은 common application-common.yml 의 eureka.client.tls(B-86).
            # [JA] Eureka 登録 · ハートビートで出すクライアント証明書 = このサービスの身元(/app/identity、CN=サービス名)。Eureka はレジストリを変える
            #      リクエストを、その CN がアプリ名と同じときだけ受ける(EUREKA_WRITE_AUTH_MODE、docs/57 §16「Eureka 書き込み」)。JVM キーストアは Eureka
            #      クライアントが使わない — 設定は common application-common.yml の eureka.client.tls(B-86)。
            - name: EUREKA_CLIENT_TLS_ENABLED
              value: "true"
            - name: SPRING_APPLICATION_NAME
              value: "coupon-service"
            # 분산 추적 → 이 노드에서 도는 관측 스택의 OTel Collector(docker-compose-observability.yml, :4318)
            # (docs/51 §4d, docs/63). 설정 기본값 localhost:4318 은 파드 안에서는 파드 자신이라 추적이 어디에도
            # 가지 않는다. 노드 IP 는 downward API 로 받는다 — 매니페스트에 IP 를 적지 않는다.
            # [JA] 分散トレース → このノードで動く観測スタックの OTel Collector(docker-compose-observability.yml、:4318)
            #      (docs/51 §4d、docs/63)。設定のデフォルト localhost:4318 はポッド内ではポッド自身なので、トレースがどこにも
            #      行かない。ノード IP は downward API で受け取る — マニフェストに IP を書かない。
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: "http://$(HOST_IP):4318/v1/traces"
            # 인증서 SAN 이 커버하는 이름으로 Eureka 에 등록한다.
            # 기본값(prefer-ip-address: true)대로면 파드 IP 로 등록되는데, 파드 IP 는 인증서
            # SAN 에 넣을 수 없으므로(동적) 게이트웨이의 TLS 검증이 'No subject alternative
            # names matching IP address ...' 로 전부 거부한다 — 스테이징 리허설(ops/12)에서
            # 실측한 실패다. 서비스 DNS 는 와일드카드 SAN(*.ecommerce.svc.cluster.local)이
            # 커버하고, k8s Service 가 파드로 부하분산해 준다.
            #
            # ⚠️ 트레이드오프(HPA 로 레플리카가 2 이상이 될 때):
            #   모든 레플리카가 **같은 주소**로 등록되므로 Eureka 의 클라이언트 사이드
            #   로드밸런싱은 실질적으로 무력화되고, 분배는 k8s Service(kube-proxy)가 맡는다.
            #   기능적으로는 정상이지만(요청은 고르게 분산된다) Eureka 대시보드에서
            #   인스턴스별 구분이 흐려진다. 파드별 신원이 꼭 필요하면 선택지는 둘이다:
            #     ① StatefulSet + 헤드리스 Service 로 파드별 안정 DNS 를 부여하고
            #        그 이름들을 SAN 에 포함시킨다.
            #     ② 서비스 메시(mTLS 를 사이드카에 위임)로 옮긴다.
            #   현재 규모(maxReplicas 3)에서는 ①의 복잡도가 이득보다 크다고 판단했다.
            # [JA] 証明書の SAN がカバーする名前で Eureka に登録する。
            #      デフォルト(prefer-ip-address: true)のままだとポッド IP で登録されるが、ポッド IP は証明書の
            #      SAN に入れられないので(動的)、ゲートウェイの TLS 検証が 'No subject alternative
            #      names matching IP address ...' ですべて拒否する — ステージングリハーサル(ops/12)で
            #      実測した失敗である。サービス DNS はワイルドカード SAN(*.ecommerce.svc.cluster.local)が
            #      カバーし、k8s Service がポッドへ負荷分散してくれる。
            #      ⚠️ トレードオフ(HPA でレプリカが 2 以上になるとき):
            #        全レプリカが**同じアドレス**で登録されるので、Eureka のクライアントサイド
            #        ロードバランシングは実質的に無力化され、分配は k8s Service(kube-proxy)が担う。
            #        機能的には正常だが(リクエストは均等に分散される)Eureka ダッシュボードで
            #        インスタンスごとの区別がぼやける。ポッドごとの身元がどうしても必要なら選択肢は 2 つ:
            #          ① StatefulSet + ヘッドレス Service でポッドごとの安定した DNS を与え、
            #             その名前を SAN に含める。
            #          ② サービスメッシュ(mTLS をサイドカーに委ねる)に移す。
            #        現在の規模(maxReplicas 3)では ① の複雑さが利得より大きいと判断した。
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "false"
            - name: EUREKA_INSTANCE_HOSTNAME
              value: "coupon-service.ecommerce.svc.cluster.local"
            # 서비스 JVM 이 사설 CA 를 신뢰하게 한다.
            # LOCAL_TRUST_STORE_PATH 는 server.ssl / eureka.client.tls 같은 **특정 설정**만 읽는다.
            # 반면 Eureka 클라이언트 등록(Jersey), Feign 호출, 액추에이터 아웃바운드는 전부
            # **JVM 기본 트러스트스토어**를 쓰므로, 사설 CA 로 발급한 환경에서는
            # 'PKIX path building failed' 로 서비스 등록 자체가 실패한다(k3s 검증에서 실측:
            # 파드 9/9 가 Running 인데 Eureka 등록은 0건이었다).
            # $(VAR) 치환은 같은 env 목록의 앞선 항목만 참조할 수 있어 비밀번호를 여기서 다시 선언한다.
            # [JA] サービスの JVM が私設 CA を信頼するようにする。
            #      LOCAL_TRUST_STORE_PATH は server.ssl / eureka.client.tls のような**特定の設定**だけが読む。
            #      一方 Eureka クライアント登録(Jersey)、Feign 呼び出し、アクチュエータのアウトバウンドはすべて
            #      **JVM デフォルトのトラストストア**を使うので、私設 CA で発行した環境では
            #      'PKIX path building failed' でサービス登録自体が失敗する(k3s 検証で実測:
            #      ポッド 9/9 が Running なのに Eureka 登録は 0 件だった)。
            #      $(VAR) 置換は同じ env リストの前の項目しか参照できないので、パスワードをここで再宣言する。
            - name: LOCAL_KEY_STORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: LOCAL_KEY_STORE_PASSWORD
            # 🔒 스토어 비밀번호는 JAVA_TOOL_OPTIONS 에 넣지 않는다 — JVM 이 기동마다 그 변수를 통째로 "Picked up JAVA_TOOL_OPTIONS: …"
            #    로 stderr 에 찍어 파드 로그 · Loki 에 평문으로 남았다. 앱이 기동 첫 순간에 아래 변수를 javax.net.ssl.*Password 로
            #    옮긴다(common JvmSslPasswords · 게이트웨이 · config-server 는 main, B-83).
            # [JA] 🔒 ストアのパスワードは JAVA_TOOL_OPTIONS に入れない — JVM が起動のたびにその変数を丸ごと "Picked up JAVA_TOOL_OPTIONS: …"
            #         として stderr に出し、ポッドログ · Loki に平文で残った。アプリが起動の最初の瞬間に下の変数を javax.net.ssl.*Password に
            #         移す(common JvmSslPasswords · ゲートウェイ · config-server は main、B-83)。
            - name: JAVAX_NET_SSL_TRUST_STORE_PASSWORD
              value: "$(LOCAL_KEY_STORE_PASSWORD)"
            - name: JAVAX_NET_SSL_KEY_STORE_PASSWORD
              value: "$(LOCAL_KEY_STORE_PASSWORD)"
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -Djavax.net.ssl.trustStore=/app/resources/truststore.p12
                -Djavax.net.ssl.trustStoreType=PKCS12
                -Djavax.net.ssl.keyStore=/app/identity/keystore.p12
                -Djavax.net.ssl.keyStoreType=PKCS12
            # 서버 쪽 — 부르는 서비스에게 클라이언트 인증서를 요청한다(want: 없어도 연결은 된다 — 프로브·게이트웨이). docs/57 §16
            # [JA] サーバー側 — 呼んでくるサービスにクライアント証明書を要求する(want: なくても接続はできる — プローブ・ゲートウェイ)。docs/57 §16
            - name: SERVER_SSL_CLIENT_AUTH
              value: "want"
            - name: LOCAL_KEY_STORE_PATH
              value: "/app/resources/keystore.p12"
            # 서버 인증서는 이 서비스의 신원(CN=coupon-service · 90일 — cert-manager 가 만료 30일 전 새로 발급, Reloader 가 재시작)이다.
            # 공유 tls-keystore(825일 · 모든 서비스 이름의 와일드카드)는 서버로 쓰지 않는다 — 그 키 하나가 새면 어느 서비스로도
            # 행세할 수 있었다. 신원에는 serverAuth · 서비스 이름 · 지표 에이전트가 확인하는 이름이 있다(docs/57 §27, B-121).
            # [JA] サーバー証明書はこのサービスの身元(CN=coupon-service · 90 日 — cert-manager が期限 30 日前に再発行し、Reloader が再起動)である。
            #      共有 tls-keystore(825 日 · 全サービス名のワイルドカード)はサーバーには使わない — その鍵一つが漏れればどのサービスにも
            #      成りすませた。身元には serverAuth · サービス名 · メトリクスエージェントが確認する名前がある(docs/57 §27、B-121)。
            - name: SERVER_SSL_KEY_STORE
              value: "/app/identity/keystore.p12"
            - name: SERVER_SSL_KEY_STORE_TYPE
              value: "PKCS12"
            - name: SERVER_SSL_KEY_STORE_PASSWORD
              value: "$(LOCAL_KEY_STORE_PASSWORD)"
            - name: SERVER_SSL_KEY_PASSWORD
              value: "$(LOCAL_KEY_STORE_PASSWORD)"
            # 인증서 경로는 키스토어 하나가 아니라 **다섯 개가 한 세트**다(docs/18 §4 산출물 표).
            # 예전에는 키스토어 경로만 주입해, eureka.client.tls 의 file:${LOCAL_TRUST_STORE_PATH} 가
            # placeholder 그대로 남아 'KeyStore not exists: URL [file:${...}]' 로 기동이 죽었다
            # (k3s 검증에서 실측 — 둘 다 넣었던 gateway 만 살아났다).
            # [JA] 証明書のパスはキーストア 1 つではなく **5 つで 1 セット**である(docs/18 §4 成果物の表)。
            #      以前はキーストアのパスだけを注入し、eureka.client.tls の file:${LOCAL_TRUST_STORE_PATH} が
            #      プレースホルダーのまま残って 'KeyStore not exists: URL [file:${...}]' で起動が落ちた
            #      (k3s 検証で実測 — 両方入れていた gateway だけが生き残った)。
            - name: LOCAL_TRUST_STORE_PATH
              value: "/app/resources/truststore.p12"
            - name: LOCAL_CACERT_PATH
              value: "/app/resources/ca.crt"
            - name: LOCAL_CRT_PATH
              value: "/app/resources/tls.crt"
            - name: LOCAL_KEY_PATH
              value: "/app/resources/tls.key"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://$(POSTGRES_HOST):$(POSTGRES_PORT)/coupondb?sslmode=require"
            - name: SPRING_DATASOURCE_USERNAME
              value: "product"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: LOCAL_DB_PASSWORD
            - name: SPRING_DATASOURCE_PROPERTIES_SSL
              value: "false"
          volumeMounts:
            # 🔴 JVM 충돌 기록(hs_err) — 파드가 사는 동안 남는다(컨테이너가 다시 떠도). 꺼내기: docs/83 §2.8 · B-97
            #    [JA] JVM のクラッシュ記録 — Pod が生きている間は残る(コンテナが再起動しても)。
            - name: jvm-crash
              mountPath: /var/log/jvm
            - name: tls-keystore
              mountPath: /app/resources
              readOnly: true
            # 서비스 자신의 신원(CN=coupon-service) — 다른 서비스를 부를 때 내는 클라이언트 인증서(JVM 기본 keystore, 위 JAVA_TOOL_OPTIONS).
            # 서버 인증서·Redis·Kafka 는 위 공유 tls-keystore 그대로. 발급: ops/38 (docs/57 §16)
            # [JA] サービス自身の身元(CN=coupon-service) — 他のサービスを呼ぶときに出すクライアント証明書(JVM デフォルト keystore、上の JAVA_TOOL_OPTIONS)。
            #      サーバー証明書・Redis・Kafka は上の共有 tls-keystore のまま。発行: ops/38(docs/57 §16)
            - name: tls-id
              mountPath: /app/identity
              readOnly: true
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
              scheme: HTTPS
            # 5초 × 60 = 5분. 이 서비스들은 기동 중 Flyway 마이그레이션·Eureka 등록·Kafka
            # 컨슈머 배정을 모두 수행하며, 노드가 붐빌 때는 웹 컨텍스트 초기화만 40초가 걸린다.
            # 기존 150초 예산은 그런 순간에 **정상 기동을 죽여** CrashLoop 로 오인하게 만든다
            # (k3s 검증에서 exit 137 로 실측).
            # [JA] 5 秒 × 60 = 5 分。これらのサービスは起動中に Flyway マイグレーション・Eureka 登録・Kafka
            #      コンシューマ割り当てをすべて行い、ノードが混んでいるときは Web コンテキストの初期化だけで 40 秒かかる。
            #      既存の 150 秒の予算はそういう瞬間に**正常な起動を殺し**、CrashLoop と誤認させる
            #      (k3s 検証で exit 137 として実測)。
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
              scheme: HTTPS
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
              scheme: HTTPS
            periodSeconds: 10
      volumes:
        # 🔴 JVM 충돌 기록(ops/Dockerfile.runtime 의 -XX:ErrorFile) — 로그(Loki)로 보내지 않는다: 기록에 메모리 내용이 들어갈 수 있다
        # [JA] 🔴 JVM クラッシュ記録(ops/Dockerfile.runtime の -XX:ErrorFile) — ログ(Loki)には送らない: 記録にメモリ内容が入りうる
        - name: jvm-crash
          emptyDir:
            sizeLimit: 64Mi
        - name: tls-keystore
          secret:
            secretName: tls-keystore
        - name: tls-id
          secret:
            secretName: tls-id-coupon-service
---
apiVersion: v1
kind: Service
metadata:
  name: coupon-service
  namespace: ecommerce
spec:
  selector:
    app: coupon-service
  ports:
    - port: 8183
      targetPort: 8183
