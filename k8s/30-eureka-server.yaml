apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: ecommerce
  labels:
    app: eureka-server
spec:
  # replicas 는 1 로 유지한다. 이 Eureka 는 standalone 설정이다
  # (register-with-eureka=false, fetch-registry=false). 2개로 올리면 서로를 모르는
  # **독립 레지스트리 두 개**가 되어, 어느 파드에 등록됐는지에 따라 디스커버리가 갈린다.
  # 늘리려면 peer-aware 설정 + 안정적 DNS(StatefulSet)가 먼저다.
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: eureka-server
          # 이미지는 기존 eureka-server/Dockerfile로 빌드해 여러분의 레지스트리에 푸시한 뒤 교체하세요.
          # 이미지는 ops/19-build-images.sh 가 ops/Dockerfile.runtime 으로 만든다(CI 와 같은 경로 — 모듈별 Dockerfile 은 지웠다).
          image: REGISTRY_PLACEHOLDER/ecommerce-msa/eureka-server:1.0.0
          ports:
            - containerPort: 8761
          envFrom:
            - configMapRef:
                name: ecommerce-config
            - secretRef:
                name: ecommerce-secrets
          env:
            # 클라이언트 인증서를 **요청**한다(want — 없어도 연결은 된다: 프로브 · 대시보드 · 등록부 읽기). 등록부를 바꾸는 요청은
            # RegistryWriteGuard 가 그 인증서의 CN 으로 판정한다(EUREKA_WRITE_AUTH_MODE, ConfigMap). 클라이언트는 신원 인증서를
            # 공통 설정의 eureka.client.tls 로 낸다(B-86). need 로 올리지 않는다 — 판정이 쓰기만 막으면 되고, 프로브는 인증서가 없다.
            # 내는 인증서는 JVM 트러스트스토어(공유 truststore — 내부 CA)로 검증한다.
            - name: SERVER_SSL_CLIENT_AUTH
              value: "want"
            - name: SPRING_APPLICATION_NAME
              value: "discovery-service"
            # 서비스 JVM 이 사설 CA 를 신뢰하게 한다.
            # LOCAL_TRUST_STORE_PATH 는 server.ssl / eureka.client.tls 같은 **특정 설정**만 읽는다.
            # 반면 Eureka 클라이언트 등록(Jersey), Feign 호출, 액추에이터 아웃바운드는 전부
            # **JVM 기본 트러스트스토어**를 쓰므로, 사설 CA 로 발급한 환경에서는
            # 'PKIX path building failed' 로 서비스 등록 자체가 실패한다(k3s 검증에서 실측:
            # 파드 9/9 가 Running 인데 Eureka 등록은 0건이었다).
            # $(VAR) 치환은 같은 env 목록의 앞선 항목만 참조할 수 있어 비밀번호를 여기서 다시 선언한다.
            - name: LOCAL_KEY_STORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: LOCAL_KEY_STORE_PASSWORD
            # 🔒 스토어 비밀번호는 JAVA_TOOL_OPTIONS 에 넣지 않는다 — JVM 이 기동마다 그 변수를 통째로 "Picked up JAVA_TOOL_OPTIONS: …"
            #    로 stderr 에 찍어 파드 로그 · Loki 에 평문으로 남았다. 앱이 기동 첫 순간에 아래 변수를 javax.net.ssl.*Password 로
            #    옮긴다(common JvmSslPasswords · 게이트웨이 · config-server 는 main, B-83).
            - name: JAVAX_NET_SSL_TRUST_STORE_PASSWORD
              value: "$(LOCAL_KEY_STORE_PASSWORD)"
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -Djavax.net.ssl.trustStore=/app/resources/truststore.p12
                -Djavax.net.ssl.trustStoreType=PKCS12
            - name: LOCAL_KEY_STORE_PATH
              value: "/app/resources/keystore.p12"
            # 인증서 경로는 키스토어 하나가 아니라 **다섯 개가 한 세트**다(docs/18 §4 산출물 표).
            # 예전에는 키스토어 경로만 주입해, eureka.client.tls 의 file:${LOCAL_TRUST_STORE_PATH} 가
            # placeholder 그대로 남아 'KeyStore not exists: URL [file:${...}]' 로 기동이 죽었다
            # (k3s 검증에서 실측 — 둘 다 넣었던 gateway 만 살아났다).
            - name: LOCAL_TRUST_STORE_PATH
              value: "/app/resources/truststore.p12"
            - name: LOCAL_CACERT_PATH
              value: "/app/resources/ca.crt"
            - name: LOCAL_CRT_PATH
              value: "/app/resources/tls.crt"
            - name: LOCAL_KEY_PATH
              value: "/app/resources/tls.key"
          volumeMounts:
            - name: tls-keystore
              mountPath: /app/resources
              readOnly: true
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
          # eureka-server는 common 모듈의 actuator 설정을 상속받지 않아(빌드에 actuator 의존성이 없음)
          # HTTP 헬스 엔드포인트가 없습니다 — TCP 소켓으로 포트 리스닝만 확인합니다.
          startupProbe:
            tcpSocket:
              port: 8761
            # 5초 × 60 = 5분. 이 서비스들은 기동 중 Flyway 마이그레이션·Eureka 등록·Kafka
            # 컨슈머 배정을 모두 수행하며, 노드가 붐빌 때는 웹 컨텍스트 초기화만 40초가 걸린다.
            # 기존 150초 예산은 그런 순간에 **정상 기동을 죽여** CrashLoop 로 오인하게 만든다
            # (k3s 검증에서 exit 137 로 실측).
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8761
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: 8761
            periodSeconds: 10
      volumes:
        - name: tls-keystore
          secret:
            secretName: tls-keystore
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
  namespace: ecommerce
spec:
  selector:
    app: eureka-server
  ports:
    - port: 8761
      targetPort: 8761
