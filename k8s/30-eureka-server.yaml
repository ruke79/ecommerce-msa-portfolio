apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: ecommerce
  labels:
    app: eureka-server
  annotations:
    # 서버 인증서 = 신원(k8s/96 의 id-eureka-server)이 갱신되면 롤링 재시작 — keystore 는 기동할 때만 읽는다(B-68 · B-121).
    # [JA] サーバー証明書 = 身元(k8s/96 の id-eureka-server)が更新されたらローリング再起動 — keystore は起動時にしか読まない。
    secret.reloader.stakater.com/reload: "tls-id-eureka-server"
spec:
  # replicas 는 1 로 유지한다. 이 Eureka 는 standalone 설정이다
  # (register-with-eureka=false, fetch-registry=false). 2개로 올리면 서로를 모르는
  # **독립 레지스트리 두 개**가 되어, 어느 파드에 등록됐는지에 따라 디스커버리가 갈린다.
  # 늘리려면 peer-aware 설정 + 안정적 DNS(StatefulSet)가 먼저다.
  # [JA] replicas は 1 に保つ。この Eureka は standalone 設定である
  #      (register-with-eureka=false, fetch-registry=false)。2 つに上げると互いを知らない
  #      **独立したレジストリが 2 つ**になり、どのポッドに登録されたかによってディスカバリが分かれる。
  #      増やすなら peer-aware 設定 + 安定した DNS(StatefulSet)が先である。
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: eureka-server
          # 이미지는 기존 eureka-server/Dockerfile로 빌드해 여러분의 레지스트리에 푸시한 뒤 교체하세요.
          # 이미지는 ops/19-build-images.sh 가 ops/Dockerfile.runtime 으로 만든다(CI 와 같은 경로 — 모듈별 Dockerfile 은 지웠다).
          # [JA] イメージは既存の eureka-server/Dockerfile でビルドして各自のレジストリにプッシュしてから置き換えること。
          #      イメージは ops/19-build-images.sh が ops/Dockerfile.runtime で作る(CI と同じ経路 — モジュール別の Dockerfile は消した)。
          image: REGISTRY_PLACEHOLDER/ecommerce-msa/eureka-server:1.0.0
          ports:
            - containerPort: 8761
            # 관리 포트(actuator) — 프로브 · 지표 에이전트만. 앱 포트에는 /actuator 가 없다(B-119, docs/57 §25).
            # [JA] 管理ポート(actuator) — プローブ · 指標エージェントだけ。アプリのポートには /actuator がない。
            - name: management
              containerPort: 9180
          envFrom:
            - configMapRef:
                name: ecommerce-config
            - secretRef:
                name: ecommerce-secrets
          env:
            # actuator 를 앱 포트에서 떼어 관리 포트로(B-119) — 같은 네임스페이스의 다른 파드는 이 포트에 닿지 못한다(k8s/95).
            # TLS(server.ssl) · 보안 규칙은 앱 포트의 것을 그대로 물려받는다. [JA] actuator を管理ポートへ分ける。
            - name: MANAGEMENT_SERVER_PORT
              value: "9180"
            # 클라이언트 인증서를 **요청**한다(want — 없어도 연결은 된다: 프로브 · 대시보드 · 등록부 읽기). 등록부를 바꾸는 요청은
            # RegistryWriteGuard 가 그 인증서의 CN 으로 판정한다(EUREKA_WRITE_AUTH_MODE, ConfigMap). 클라이언트는 신원 인증서를
            # 공통 설정의 eureka.client.tls 로 낸다(B-86). need 로 올리지 않는다 — 판정이 쓰기만 막으면 되고, 프로브는 인증서가 없다.
            # 내는 인증서는 JVM 트러스트스토어(공유 truststore — 내부 CA)로 검증한다.
            # [JA] クライアント証明書を**要求**する(want — なくても接続はできる: プローブ · ダッシュボード · レジストリ読み取り)。レジストリを変えるリクエストは
            #      RegistryWriteGuard がその証明書の CN で判定する(EUREKA_WRITE_AUTH_MODE、ConfigMap)。クライアントは身元証明書を
            #      共通設定の eureka.client.tls で出す(B-86)。need には上げない — 判定は書き込みだけ塞げばよく、プローブは証明書を持たない。
            #      提示された証明書は JVM トラストストア(共有 truststore — 内部 CA)で検証する。
            - name: SERVER_SSL_CLIENT_AUTH
              value: "want"
            - name: SPRING_APPLICATION_NAME
              value: "discovery-service"
            # 이 서버 자신의 주소(eureka.server.my-url) — ConfigMap 의 EUREKA_CLIENT_SERVICEURL_DEFAULTZONE 끝에 '/' 를 붙인 것과
            # **글자 하나까지** 같아야 한다(Eureka 가 equals 로 비교하고, Spring Cloud 는 피어 주소 끝에 '/' 를 붙인다).
            # 🐛 2026-11-21 까지 없었다. 이 파드도 그 ConfigMap 을 받아 피어 목록이 자기 Service 주소가 됐는데, my-url 은 yml 의 localhost
            #    그대로라 자기를 걸러내지 못했다 — 모든 등록 · 하트비트를 인증서 없이 자기에게 복제해 쓰기 enforce 가 403(5분마다 ~100줄,
            #    운영 ERROR 의 9할, docs/99 §4). 2026-10-26 의 yml my-url 수정은 yml 의 defaultZone(localhost)과만 맞춰 k8s 에서는 효과가
            #    없었다. 시험 eureka-server PeerSelfReplicationTest(이 매니페스트 + ConfigMap + yml 을 묶어 피어 0 을 본다).
            # [JA] このサーバー自身の URL — ConfigMap の defaultZone に '/' を付けたものと一字一句同じにする。以前はなく、ピア一覧が
            #      自分の Service アドレスになって自分へ複製し、書き込み enforce で 403 だった。
            - name: EUREKA_SERVER_MYURL
              value: "https://eureka-server.ecommerce.svc.cluster.local:8761/eureka/"
            # 서비스 JVM 이 사설 CA 를 신뢰하게 한다.
            # LOCAL_TRUST_STORE_PATH 는 server.ssl / eureka.client.tls 같은 **특정 설정**만 읽는다.
            # 반면 Eureka 클라이언트 등록(Jersey), Feign 호출, 액추에이터 아웃바운드는 전부
            # **JVM 기본 트러스트스토어**를 쓰므로, 사설 CA 로 발급한 환경에서는
            # 'PKIX path building failed' 로 서비스 등록 자체가 실패한다(k3s 검증에서 실측:
            # 파드 9/9 가 Running 인데 Eureka 등록은 0건이었다).
            # $(VAR) 치환은 같은 env 목록의 앞선 항목만 참조할 수 있어 비밀번호를 여기서 다시 선언한다.
            # [JA] サービスの JVM が私設 CA を信頼するようにする。
            #      LOCAL_TRUST_STORE_PATH は server.ssl / eureka.client.tls のような**特定の設定**だけが読む。
            #      一方 Eureka クライアント登録(Jersey)、Feign 呼び出し、アクチュエータのアウトバウンドはすべて
            #      **JVM デフォルトのトラストストア**を使うので、私設 CA で発行した環境では
            #      'PKIX path building failed' でサービス登録自体が失敗する(k3s 検証で実測:
            #      ポッド 9/9 が Running なのに Eureka 登録は 0 件だった)。
            #      $(VAR) 置換は同じ env リストの前の項目しか参照できないので、パスワードをここで再宣言する。
            - name: LOCAL_KEY_STORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: LOCAL_KEY_STORE_PASSWORD
            # 🔒 스토어 비밀번호는 JAVA_TOOL_OPTIONS 에 넣지 않는다 — JVM 이 기동마다 그 변수를 통째로 "Picked up JAVA_TOOL_OPTIONS: …"
            #    로 stderr 에 찍어 파드 로그 · Loki 에 평문으로 남았다. 앱이 기동 첫 순간에 아래 변수를 javax.net.ssl.*Password 로
            #    옮긴다(common JvmSslPasswords · 게이트웨이 · config-server 는 main, B-83).
            # [JA] 🔒 ストアのパスワードは JAVA_TOOL_OPTIONS に入れない — JVM が起動のたびにその変数を丸ごと "Picked up JAVA_TOOL_OPTIONS: …"
            #         として stderr に出し、ポッドログ · Loki に平文で残った。アプリが起動の最初の瞬間に下の変数を javax.net.ssl.*Password に
            #         移す(common JvmSslPasswords · ゲートウェイ · config-server は main、B-83)。
            - name: JAVAX_NET_SSL_TRUST_STORE_PASSWORD
              value: "$(LOCAL_KEY_STORE_PASSWORD)"
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -Djavax.net.ssl.trustStore=/app/resources/truststore.p12
                -Djavax.net.ssl.trustStoreType=PKCS12
            - name: LOCAL_KEY_STORE_PATH
              value: "/app/resources/keystore.p12"
            # 서버 인증서는 eureka-server 의 신원(CN=eureka-server · 90일 — cert-manager 가 만료 30일 전 새로 발급, Reloader 가 재시작)이다.
            # 공유 tls-keystore(825일 · 모든 서비스 이름의 와일드카드)는 서버로 쓰지 않는다(docs/57 §27, B-121). 신원을 마운트했으니
            # 자기 Eureka 클라이언트(피어 복제)도 그 인증서를 낸다(B-86).
            # [JA] サーバー証明書は eureka-server の身元(CN=eureka-server · 90 日 — cert-manager が期限 30 日前に再発行し、Reloader が再起動)
            #      である。共有 tls-keystore(825 日 · 全サービス名のワイルドカード)はサーバーには使わない(docs/57 §27、B-121)。身元を
            #      マウントしたので、自分の Eureka クライアント(ピア複製)もその証明書を出す(B-86)。
            - name: SERVER_SSL_KEY_STORE
              value: "/app/identity/keystore.p12"
            - name: SERVER_SSL_KEY_STORE_TYPE
              value: "PKCS12"
            - name: SERVER_SSL_KEY_STORE_PASSWORD
              value: "$(LOCAL_KEY_STORE_PASSWORD)"
            - name: SERVER_SSL_KEY_PASSWORD
              value: "$(LOCAL_KEY_STORE_PASSWORD)"
            - name: EUREKA_CLIENT_TLS_ENABLED
              value: "true"
            # 인증서 경로는 키스토어 하나가 아니라 **다섯 개가 한 세트**다(docs/18 §4 산출물 표).
            # 예전에는 키스토어 경로만 주입해, eureka.client.tls 의 file:${LOCAL_TRUST_STORE_PATH} 가
            # placeholder 그대로 남아 'KeyStore not exists: URL [file:${...}]' 로 기동이 죽었다
            # (k3s 검증에서 실측 — 둘 다 넣었던 gateway 만 살아났다).
            # [JA] 証明書のパスはキーストア 1 つではなく **5 つで 1 セット**である(docs/18 §4 成果物の表)。
            #      以前はキーストアのパスだけを注入し、eureka.client.tls の file:${LOCAL_TRUST_STORE_PATH} が
            #      プレースホルダーのまま残って 'KeyStore not exists: URL [file:${...}]' で起動が落ちた
            #      (k3s 検証で実測 — 両方入れていた gateway だけが生き残った)。
            - name: LOCAL_TRUST_STORE_PATH
              value: "/app/resources/truststore.p12"
            - name: LOCAL_CACERT_PATH
              value: "/app/resources/ca.crt"
            - name: LOCAL_CRT_PATH
              value: "/app/resources/tls.crt"
            - name: LOCAL_KEY_PATH
              value: "/app/resources/tls.key"
          volumeMounts:
            # 🔴 JVM 충돌 기록(hs_err) — 파드가 사는 동안 남는다(컨테이너가 다시 떠도). 꺼내기: docs/83 §2.8 · B-97
            #    [JA] JVM のクラッシュ記録 — Pod が生きている間は残る(コンテナが再起動しても)。
            - name: jvm-crash
              mountPath: /var/log/jvm
            - name: tls-keystore
              mountPath: /app/resources
              readOnly: true
            - name: tls-id
              mountPath: /app/identity
              readOnly: true
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
          # eureka-server는 common 모듈의 actuator 설정을 상속받지 않아(빌드에 actuator 의존성이 없음)
          # HTTP 헬스 엔드포인트가 없습니다 — TCP 소켓으로 포트 리스닝만 확인합니다.
          # [JA] eureka-server は common モジュールの actuator 設定を継承しないので(ビルドに actuator 依存がない)
          #      HTTP ヘルスエンドポイントがない — TCP ソケットでポートのリッスンだけを確認する。
          startupProbe:
            tcpSocket:
              port: 8761
            # 5초 × 60 = 5분. 이 서비스들은 기동 중 Flyway 마이그레이션·Eureka 등록·Kafka
            # 컨슈머 배정을 모두 수행하며, 노드가 붐빌 때는 웹 컨텍스트 초기화만 40초가 걸린다.
            # 기존 150초 예산은 그런 순간에 **정상 기동을 죽여** CrashLoop 로 오인하게 만든다
            # (k3s 검증에서 exit 137 로 실측).
            # [JA] 5 秒 × 60 = 5 分。これらのサービスは起動中に Flyway マイグレーション・Eureka 登録・Kafka
            #      コンシューマ割り当てをすべて行い、ノードが混んでいるときは Web コンテキストの初期化だけで 40 秒かかる。
            #      既存の 150 秒の予算はそういう瞬間に**正常な起動を殺し**、CrashLoop と誤認させる
            #      (k3s 検証で exit 137 として実測)。
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8761
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: 8761
            periodSeconds: 10
      volumes:
        # 🔴 JVM 충돌 기록(ops/Dockerfile.runtime 의 -XX:ErrorFile) — 로그(Loki)로 보내지 않는다: 기록에 메모리 내용이 들어갈 수 있다
        # [JA] 🔴 JVM クラッシュ記録(ops/Dockerfile.runtime の -XX:ErrorFile) — ログ(Loki)には送らない: 記録にメモリ内容が入りうる
        - name: jvm-crash
          emptyDir:
            sizeLimit: 64Mi
        - name: tls-keystore
          secret:
            secretName: tls-keystore
        - name: tls-id
          secret:
            secretName: tls-id-eureka-server
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
  namespace: ecommerce
spec:
  selector:
    app: eureka-server
  ports:
    - port: 8761
      targetPort: 8761
