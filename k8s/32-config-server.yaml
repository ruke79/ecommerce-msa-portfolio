apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: ecommerce
  labels:
    app: config-server
  annotations:
    # 신원 인증서가 갱신되면(cert-manager — k8s/96) 롤링 재시작 — keystore 는 기동할 때만 읽는다.
    secret.reloader.stakater.com/reload: "tls-id-config-server"
spec:
  # config-server 는 상태가 없다(설정의 진실은 git 저장소다). eureka-server 와 달리 늘려도
  # 조용히 깨지지 않으므로 2로 올려도 된다. 1로 두는 이유는 단지 자원이다 —
  # Always Free 박스에서는 파드 하나가 아깝고, 이 서비스가 잠깐 없어도 클라이언트는
  # optional: 로 넘어간다(아래 SPRING_CONFIG_IMPORT 주석 참조).
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: config-server
          # 이미지는 ops/19-build-images.sh 가 ops/Dockerfile.runtime 으로 만든다(CI 와 같은 경로 — 모듈별 Dockerfile 은 지웠다).
          image: REGISTRY_PLACEHOLDER/ecommerce-msa/config-server:1.0.0
          ports:
            - containerPort: 8888
          envFrom:
            - configMapRef:
                name: ecommerce-config
            - secretRef:
                name: ecommerce-secrets
          env:
            # Eureka 등록 · 하트비트에 내는 클라이언트 인증서 = 이 서비스의 신원(/app/identity, CN=config-server). Eureka 는 등록부를
            # 바꾸는 요청을 그 CN 이 앱 이름과 같을 때만 받는다(EUREKA_WRITE_AUTH_MODE, docs/57 §16 "Eureka 쓰기", B-86).
            - name: EUREKA_CLIENT_TLS_ENABLED
              value: "true"
            # ⚠️ 이름이 없으면 Eureka 에 **UNKNOWN 으로 등록된다.** config-server 는 자기
            #    application.yml 어디에도 spring.application.name 을 선언하지 않아 실제로
            #    그랬다(`POST /eureka/apps/UNKNOWN` 으로 확인). 지금은 다른 서비스들이
            #    config-server 를 주소로 직접 찾으므로 드러나지 않지만,
            #    spring.cloud.config.discovery 로 바꾸는 순간 이름으로 찾지 못해 깨진다.
            - name: SPRING_APPLICATION_NAME
              value: "config-server"

            # ⚠️ **자기 자신을 import 하지 않게 덮어쓴다.** 공용 ConfigMap 의
            #    SPRING_CONFIG_IMPORT 는 `optional:configserver:https://config-server...:8888`
            #    이고 envFrom 으로 이 파드에도 들어온다. 그대로 두면 config-server 가 기동 중에
            #    자기 자신에게 설정을 물으러 간다 — 아직 Endpoints 에 없으니 실패하고,
            #    optional: 라 넘어가긴 하지만 매 기동마다 무의미한 왕복과 경고가 남는다.
            #    환경변수가 yml 보다 우선하므로 여기서 원래 값으로 되돌린다.
            - name: SPRING_CONFIG_IMPORT
              value: "optional:classpath:application-common.yml"

            # ── 설정 저장소 ────────────────────────────────────────────────
            # 채우기 전까지 config-server 는 **뜨지만 설정을 내주지는 못한다** — git 백엔드는
            # clone-on-start 가 꺼져 있어 첫 요청 때 클론하므로 기동은 성공한다.
            # 클라이언트는 전부 optional: 이라 그 실패를 로그로만 남기고 자기 번들 설정으로 돈다.
            #
            # ⚠️ 이름이 Spring 프로퍼티(SPRING_CLOUD_CONFIG_SERVER_GIT_URI)가 아니라
            #    CONFIG_GIT_URI 인 이유: 값은 application-local.yml 의 `${CONFIG_GIT_URI:...}`
            #    가 받는다. 하이픈이 든 프로퍼티의 환경변수 이름 규칙을 매번 기억하지 않기
            #    위해서다(가드레일 B-44 가 두 이름을 대조한다).
            - name: CONFIG_GIT_URI
              value: "REPLACE_ME_config_repo_url"

            # 저장소를 실제로 연결한 뒤 켤 것. 기동 시 클론하므로 URI·자격증명이 틀리면
            # **기동에서 바로** 실패한다 — 지금처럼 "파드는 Ready 인데 설정이 안 내려가는"
            # 조용한 실패보다 낫다.
            # - name: CONFIG_GIT_CLONE_ON_START
            #   value: "true"

            # 비공개 저장소라면. 이 둘은 하이픈이 없어 Spring 프로퍼티 이름을 그대로 써도
            # 매핑이 모호하지 않다. **반드시 Secret 으로** — value: 로 적으면 커밋된다.
            # - name: SPRING_CLOUD_CONFIG_SERVER_GIT_USERNAME
            #   valueFrom:
            #     secretKeyRef: { name: ecommerce-secrets, key: CONFIG_GIT_USERNAME }
            # - name: SPRING_CLOUD_CONFIG_SERVER_GIT_PASSWORD
            #   valueFrom:
            #     secretKeyRef: { name: ecommerce-secrets, key: CONFIG_GIT_PASSWORD }

            # 설정 저장소에 `{cipher}...` 로 비밀을 넣고 여기서 복호화하려면 필요하다.
            # 의존성 확인 완료: spring-security-crypto 가 들어와 있어 **대칭키 방식은 그대로
            # 동작한다.** 키스토어 기반 비대칭 방식은 spring-security-rsa 가 없어 추가가 필요하다.
            # - name: ENCRYPT_KEY
            #   valueFrom:
            #     secretKeyRef: { name: ecommerce-secrets, key: CONFIG_ENCRYPT_KEY }
            #
            # 🔒 HTTP 인증(ConfigServerSecurity, 2026-10-15): Secret 에 CONFIG_SERVER_PASSWORD 가 있으면 사용자 config 의 Basic 으로만,
            #    없으면 설정 · 복호화 API 를 모두 거절한다(프로브 · 지표만 연다). 예전에는 인증이 없어 저장소를 붙이는 날
            #    GET /{application}/{profile} 로 전 서비스의 설정이, ENCRYPT_KEY 를 켜면 /decrypt 로 {cipher} 값이 열렸다.
            #    저장소를 연결할 때: Secret 에 CONFIG_SERVER_PASSWORD(envFrom 으로 들어온다) + 클라이언트에
            #    SPRING_CLOUD_CONFIG_USERNAME=config · SPRING_CLOUD_CONFIG_PASSWORD.

            # Spring Cloud Bus(AMQP)는 2026-10-16 의존성에서 뺐다 — RabbitMQ 가 없어 이 매니페스트가
            # SPRING_CLOUD_BUS_ENABLED · MANAGEMENT_HEALTH_RABBIT_ENABLED 를 false 로 꺼 두기만 했다.
            # 설정 변경을 전 서비스에 방송하려면 브로커와 함께 다시 들인다.

            # ⚠️ config-server 는 common 모듈에 의존하지 않아 application-common.yml 이
            #    클래스패스에 없다(그래서 위 import 가 optional: 이다). 그 파일이 켜 주던
            #    health probes 가 여기서는 켜지지 않으므로 직접 켠다 — 없으면
            #    /actuator/health/liveness 가 404 라 아래 프로브가 전부 실패한다.
            #    (쿠버네티스에서는 Boot 가 자동으로 켜 주기도 하지만, 그 자동 판정에
            #     기동 가능 여부를 걸어 둘 이유가 없다.)
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"

            # ── TLS ────────────────────────────────────────────────────────
            # ⚠️ 공용 ConfigMap 이 클라이언트에게 **https://** config-server:8888 로 오라고
            #    말한다. 그런데 config-server 의 application-local.yml 에는 server.ssl 블록이
            #    아예 없어 평문 HTTP 로 뜬다 — 그대로 두면 모든 클라이언트가 TLS 핸드셰이크에서
            #    실패한다. 다른 서비스들은 yml 에 블록이 있고 경로만 주입받지만, 여기서는
            #    블록 자체가 없으므로 환경변수로 만든다(Spring relaxed binding). 네 변수는 가드 B-91 이 지킨다.
            - name: LOCAL_KEY_STORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: LOCAL_KEY_STORE_PASSWORD
            - name: LOCAL_KEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: LOCAL_KEY_PASSWORD
            - name: SERVER_SSL_KEY_STORE
              value: "/app/resources/keystore.p12"
            - name: SERVER_SSL_KEY_STORE_TYPE
              value: "PKCS12"
            - name: SERVER_SSL_KEY_STORE_PASSWORD
              value: "$(LOCAL_KEY_STORE_PASSWORD)"
            - name: SERVER_SSL_KEY_PASSWORD
              value: "$(LOCAL_KEY_PASSWORD)"

            # 사설 CA 를 JVM 기본 트러스트스토어로 신뢰하게 한다 — Eureka 등록(Jersey)과
            # 액추에이터 아웃바운드는 server.ssl 이 아니라 이쪽을 쓴다(30-eureka-server.yaml 주석).
            # 🔒 스토어 비밀번호는 JAVA_TOOL_OPTIONS 에 넣지 않는다 — JVM 이 기동마다 그 변수를 통째로 "Picked up JAVA_TOOL_OPTIONS: …"
            #    로 stderr 에 찍어 파드 로그 · Loki 에 평문으로 남았다. 앱이 기동 첫 순간에 아래 변수를 javax.net.ssl.*Password 로
            #    옮긴다(common JvmSslPasswords · 게이트웨이 · config-server 는 main, B-83).
            - name: JAVAX_NET_SSL_TRUST_STORE_PASSWORD
              value: "$(LOCAL_KEY_STORE_PASSWORD)"
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -Djavax.net.ssl.trustStore=/app/resources/truststore.p12
                -Djavax.net.ssl.trustStoreType=PKCS12
            - name: LOCAL_KEY_STORE_PATH
              value: "/app/resources/keystore.p12"
            - name: LOCAL_TRUST_STORE_PATH
              value: "/app/resources/truststore.p12"
            - name: LOCAL_CACERT_PATH
              value: "/app/resources/ca.crt"
            - name: LOCAL_CRT_PATH
              value: "/app/resources/tls.crt"
            - name: LOCAL_KEY_PATH
              value: "/app/resources/tls.key"

            # 인증서 SAN 이 커버하는 이름으로 Eureka 에 등록한다(48-delivery-service.yaml 주석).
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "false"
            - name: EUREKA_INSTANCE_HOSTNAME
              value: "config-server.ecommerce.svc.cluster.local"
          volumeMounts:
            # 🔴 JVM 충돌 기록(hs_err) — 파드가 사는 동안 남는다(컨테이너가 다시 떠도). 꺼내기: docs/83 §2.8 · B-97
            #    [JA] JVM のクラッシュ記録 — Pod が生きている間は残る(コンテナが再起動しても)。
            - name: jvm-crash
              mountPath: /var/log/jvm
            - name: tls-keystore
              mountPath: /app/resources
              readOnly: true
            # 이 서비스의 신원(CN=config-server) — Eureka 에 등록할 때만 낸다. 발급: ops/38(cert-manager 면 k8s/96 · ops/39)
            - name: tls-id
              mountPath: /app/identity
              readOnly: true
          # 네 값이 모두 있어야 한다. external·oci 오버레이가 JSON6902 replace 로
          # 이 경로들을 덮어쓰므로, 하나라도 없으면 kustomize 빌드가 실패한다.
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8888
              scheme: HTTPS
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8888
              scheme: HTTPS
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8888
              scheme: HTTPS
            periodSeconds: 10
      volumes:
        # 🔴 JVM 충돌 기록(ops/Dockerfile.runtime 의 -XX:ErrorFile) — 로그(Loki)로 보내지 않는다: 기록에 메모리 내용이 들어갈 수 있다
        - name: jvm-crash
          emptyDir:
            sizeLimit: 64Mi
        - name: tls-keystore
          secret:
            secretName: tls-keystore
        - name: tls-id
          secret:
            secretName: tls-id-config-server
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: ecommerce
spec:
  selector:
    app: config-server
  ports:
    - port: 8888
      targetPort: 8888
