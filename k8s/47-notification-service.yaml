apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: ecommerce
  labels:
    app: notification-service
  annotations:
    # 신원 인증서가 갱신되면(cert-manager — k8s/96) 롤링 재시작 — 자바는 keystore 를 기동할 때만 읽는다. Reloader 가 없으면 아무 일도 없다.
    secret.reloader.stakater.com/reload: "tls-id-notification-service"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: notification-service
          # docker build --build-arg SERVICE_DIR=notification-service --build-arg SPRING_PROFILES_ACTIVE=local \
          #   -t <registry>/ecommerce-msa/notification-service:1.0.0 -f notification-service/Dockerfile .
          image: REGISTRY_PLACEHOLDER/ecommerce-msa/notification-service:1.0.0
          ports:
            - containerPort: 8188
          envFrom:
            - configMapRef:
                name: ecommerce-config
            - secretRef:
                name: ecommerce-secrets
          env:
            # Eureka 등록 · 하트비트에 내는 클라이언트 인증서 = 이 서비스의 신원(/app/identity, CN=서비스 이름). Eureka 는 등록부를 바꾸는
            # 요청을 그 CN 이 앱 이름과 같을 때만 받는다(EUREKA_WRITE_AUTH_MODE, docs/57 §16 "Eureka 쓰기"). JVM 키스토어는 Eureka
            # 클라이언트가 쓰지 않는다 — 설정은 common application-common.yml 의 eureka.client.tls(B-86).
            - name: EUREKA_CLIENT_TLS_ENABLED
              value: "true"
            - name: SPRING_APPLICATION_NAME
              value: "notification-service"
            # 분산 추적 → 이 노드에서 도는 관측 스택의 OTel Collector(docker-compose-observability.yml, :4318)
            # (docs/51 §4d, docs/63). 설정 기본값 localhost:4318 은 파드 안에서는 파드 자신이라 추적이 어디에도
            # 가지 않는다. 노드 IP 는 downward API 로 받는다 — 매니페스트에 IP 를 적지 않는다.
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: "http://$(HOST_IP):4318/v1/traces"
            # 인증서 SAN 이 커버하는 이름으로 Eureka 에 등록한다.
            # 기본값(prefer-ip-address: true)대로면 파드 IP 로 등록되는데, 파드 IP 는 인증서
            # SAN 에 넣을 수 없으므로(동적) 게이트웨이의 TLS 검증이 'No subject alternative
            # names matching IP address ...' 로 전부 거부한다 — 스테이징 리허설(ops/12)에서
            # 실측한 실패다. 서비스 DNS 는 와일드카드 SAN(*.ecommerce.svc.cluster.local)이
            # 커버하고, k8s Service 가 파드로 부하분산해 준다.
            #
            # ⚠️ 트레이드오프(HPA 로 레플리카가 2 이상이 될 때):
            #   모든 레플리카가 **같은 주소**로 등록되므로 Eureka 의 클라이언트 사이드
            #   로드밸런싱은 실질적으로 무력화되고, 분배는 k8s Service(kube-proxy)가 맡는다.
            #   기능적으로는 정상이지만(요청은 고르게 분산된다) Eureka 대시보드에서
            #   인스턴스별 구분이 흐려진다. 파드별 신원이 꼭 필요하면 선택지는 둘이다:
            #     ① StatefulSet + 헤드리스 Service 로 파드별 안정 DNS 를 부여하고
            #        그 이름들을 SAN 에 포함시킨다.
            #     ② 서비스 메시(mTLS 를 사이드카에 위임)로 옮긴다.
            #   현재 규모(maxReplicas 3)에서는 ①의 복잡도가 이득보다 크다고 판단했다.
            # SMS 발송기. 기본은 logging(실제 발송 없음) — 설정이 덜 된 채 배포됐을 때
            # 모르는 사이 요금이 나가는 것보다 아무것도 안 나가는 편이 안전하다(docs/24).
            - name: SMS_PROVIDER
              value: "logging"
            # 인증번호 해시에 섞는 값. 없으면 6자리 코드가 100만 개짜리 표로 즉시 역산된다.
            - name: SMS_CODE_PEPPER
              valueFrom:
                secretKeyRef: { name: ecommerce-secrets, key: SMS_CODE_PEPPER }
            # 메일 발송기. SMS 와 같은 이유로 기본은 logging(실제 발송 없음)이다 — 다만 근거는
            # 요금이 아니라 평판이다. 설정이 덜 된 채 배포돼 테스트 주소로 메일이 나가면 그
            # 하드 바운스가 발신 도메인에 쌓이고, 한 번 스팸으로 분류되면 되돌리는 데 몇 주가
            # 걸린다(docs/29). smtp 로 바꾸려면 아래 세 값이 모두 있어야 한다.
            - name: MAIL_PROVIDER
              value: "logging"
            # ⚠️ smtp 로 켤 때만 채운다. 비어 있으면 MailConfig 가 기동을 막는다 —
            #    From 이 비면 JavaMail 이 SMTP 계정 주소로 대체하는데, 그러면 SPF/DKIM 정렬이
            #    깨져 정상 메일이 스팸으로 분류된다.
            - name: MAIL_FROM
              value: ""
            - name: MAIL_FROM_NAME
              value: ""
            # SMTP 접속 정보. MAIL_PROVIDER=smtp 일 때만 쓰인다(user-service 에서 옮겨 왔다).
            # 비어 있어도 기동은 된다 — application-local.yml 이 빈 기본값을 갖고 있고,
            # 값이 없으면 JavaMailSender 빈이 만들어지지 않아 logging 발송기로 남는다.
            - name: MAIL_HOST
              valueFrom:
                secretKeyRef: { name: ecommerce-secrets, key: MAIL_HOST, optional: true }
            - name: MAIL_PORT
              valueFrom:
                secretKeyRef: { name: ecommerce-secrets, key: MAIL_PORT, optional: true }
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef: { name: ecommerce-secrets, key: MAIL_USERNAME, optional: true }
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef: { name: ecommerce-secrets, key: MAIL_PASSWORD, optional: true }
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "false"
            - name: EUREKA_INSTANCE_HOSTNAME
              value: "notification-service.ecommerce.svc.cluster.local"
            # 서비스 JVM 이 사설 CA 를 신뢰하게 한다.
            # LOCAL_TRUST_STORE_PATH 는 server.ssl / eureka.client.tls 같은 **특정 설정**만 읽는다.
            # 반면 Eureka 클라이언트 등록(Jersey), Feign 호출, 액추에이터 아웃바운드는 전부
            # **JVM 기본 트러스트스토어**를 쓰므로, 사설 CA 로 발급한 환경에서는
            # 'PKIX path building failed' 로 서비스 등록 자체가 실패한다(k3s 검증에서 실측:
            # 파드 9/9 가 Running 인데 Eureka 등록은 0건이었다).
            # $(VAR) 치환은 같은 env 목록의 앞선 항목만 참조할 수 있어 비밀번호를 여기서 다시 선언한다.
            - name: LOCAL_KEY_STORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: LOCAL_KEY_STORE_PASSWORD
            # 🔒 스토어 비밀번호는 JAVA_TOOL_OPTIONS 에 넣지 않는다 — JVM 이 기동마다 그 변수를 통째로 "Picked up JAVA_TOOL_OPTIONS: …"
            #    로 stderr 에 찍어 파드 로그 · Loki 에 평문으로 남았다. 앱이 기동 첫 순간에 아래 변수를 javax.net.ssl.*Password 로
            #    옮긴다(common JvmSslPasswords · 게이트웨이 · config-server 는 main, B-83).
            - name: JAVAX_NET_SSL_TRUST_STORE_PASSWORD
              value: "$(LOCAL_KEY_STORE_PASSWORD)"
            - name: JAVAX_NET_SSL_KEY_STORE_PASSWORD
              value: "$(LOCAL_KEY_STORE_PASSWORD)"
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -Djavax.net.ssl.trustStore=/app/resources/truststore.p12
                -Djavax.net.ssl.trustStoreType=PKCS12
                -Djavax.net.ssl.keyStore=/app/identity/keystore.p12
                -Djavax.net.ssl.keyStoreType=PKCS12
            # 서버 쪽 — 부르는 서비스에게 클라이언트 인증서를 요청한다(want: 없어도 연결은 된다 — 프로브·게이트웨이). docs/57 §16
            - name: SERVER_SSL_CLIENT_AUTH
              value: "want"
            - name: LOCAL_KEY_STORE_PATH
              value: "/app/resources/keystore.p12"
            # 인증서 경로는 키스토어 하나가 아니라 **다섯 개가 한 세트**다(docs/18 §4 산출물 표).
            # 예전에는 키스토어 경로만 주입해, eureka.client.tls 의 file:${LOCAL_TRUST_STORE_PATH} 가
            # placeholder 그대로 남아 'KeyStore not exists: URL [file:${...}]' 로 기동이 죽었다
            # (k3s 검증에서 실측 — 둘 다 넣었던 gateway 만 살아났다).
            - name: LOCAL_TRUST_STORE_PATH
              value: "/app/resources/truststore.p12"
            - name: LOCAL_CACERT_PATH
              value: "/app/resources/ca.crt"
            - name: LOCAL_CRT_PATH
              value: "/app/resources/tls.crt"
            - name: LOCAL_KEY_PATH
              value: "/app/resources/tls.key"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://$(POSTGRES_HOST):$(POSTGRES_PORT)/notificationdb?sslmode=require"
            - name: SPRING_DATASOURCE_USERNAME
              value: "product"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: LOCAL_DB_PASSWORD
            - name: SPRING_DATASOURCE_PROPERTIES_SSL
              value: "false"
          volumeMounts:
            - name: tls-keystore
              mountPath: /app/resources
              readOnly: true
            # 서비스 자신의 신원(CN=notification-service) — 다른 서비스를 부를 때 내는 클라이언트 인증서(JVM 기본 keystore, 위 JAVA_TOOL_OPTIONS).
            # 서버 인증서·Redis·Kafka 는 위 공유 tls-keystore 그대로. 발급: ops/38 (docs/57 §16)
            - name: tls-id
              mountPath: /app/identity
              readOnly: true
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8188
              scheme: HTTPS
            # 5초 × 60 = 5분. 이 서비스들은 기동 중 Flyway 마이그레이션·Eureka 등록·Kafka
            # 컨슈머 배정을 모두 수행하며, 노드가 붐빌 때는 웹 컨텍스트 초기화만 40초가 걸린다.
            # 기존 150초 예산은 그런 순간에 **정상 기동을 죽여** CrashLoop 로 오인하게 만든다
            # (k3s 검증에서 exit 137 로 실측).
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8188
              scheme: HTTPS
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8188
              scheme: HTTPS
            periodSeconds: 10
      volumes:
        - name: tls-keystore
          secret:
            secretName: tls-keystore
        - name: tls-id
          secret:
            secretName: tls-id-notification-service
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: ecommerce
spec:
  selector:
    app: notification-service
  ports:
    - port: 8188
      targetPort: 8188
