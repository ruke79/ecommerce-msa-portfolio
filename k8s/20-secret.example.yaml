# ⚠️ 예시/템플릿 파일입니다. 이 파일을 그대로 적용하지 마세요.
#
#   cp k8s/20-secret.example.yaml k8s/20-secret.yaml
#   # 아래 REPLACE_ME 값을 실제 값으로 채운 뒤
#   kubectl apply -f k8s/20-secret.yaml
#
# k8s/20-secret.yaml 은 .gitignore에 추가해 실수로 커밋되지 않도록 하세요.
# (stringData는 적용 시 자동으로 base64 인코딩되어 저장됩니다.)
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce
type: Opaque
stringData:
  # ---- 게이트웨이 JWT 서명 키 (gateway-server, user-service가 동일한 값을 공유해야 함) ----
  #
  # 만드는 법 — 둘은 **서로 다른 값**이어야 한다:
  #     openssl rand -hex 32
  #
  # ⚠️ Base64 로 만들지 말 것. 코드는 이 문자열을 **디코딩하지 않고 UTF-8 바이트 그대로**
  #    키로 쓴다(`new SecretKeySpec(jwtSecret.getBytes(UTF_8), HS256)`). HS256 은 256비트
  #    이상을 요구하므로 **32바이트(ASCII 32자) 이상**이어야 하고, 짧으면 기동 시
  #    WeakKeyException 으로 죽는다. hex 64자면 64바이트라 넉넉하고 특수문자도 없다.
  #
  # ⚠️ 이 자리의 플레이스홀더는 **일부러 짧다.** 예전 값("REPLACE_ME_with_a_long_random_
  #    string", 36자)은 32자를 넘어서 **그대로 두면 그냥 동작했다** — 저장소에 공개된 키로
  #    토큰을 서명하게 된다. 지금은 채우지 않으면 기동 자체가 실패한다.
  JWT_SECRET_KEY: "REPLACE_ME"
  # 인증번호(6자리) 해시에 섞는 값. 이게 없거나 짧으면 100만 개짜리 표로 즉시 역산되어
  # 해시로 저장한 의미가 사라진다 (docs/24). SHA-256(pepper + code) 로 쓰이며 길이 제약은
  # 없지만 엔트로피가 전부다 — JWT 키와 같은 방법으로 만들되 **값은 다르게** 한다.
  #     openssl rand -hex 32
  SMS_CODE_PEPPER: "REPLACE_ME"
  # 2FA(TOTP) 비밀을 DB 에 암호화해 두는 키(docs/70). **base64 32바이트**:
  #     openssl rand -base64 32
  # 비워 두면 JWT_SECRET_KEY 에서 파생한 키로 암호화한다(동작은 한다). 그 상태에서 JWT_SECRET_KEY 를 교체하면 2FA 를 켠 사용자가
  # 전부 잠긴다 — JWT 키를 교체하기 **전에** 이 값을 넣고 한 번 배포할 것(기동 백필이 새 키로 다시 잠근다). 한 번 넣은 뒤에는 바꾸지 않는다.
  TOTP_ENCRYPTION_KEY: ""
  # 우체국 배송조회 서비스키(공공데이터포털). 없으면 배송 추적이 갱신되지 않는다.
  # 발급: https://www.data.go.kr — 없으면 빈 값으로 두고 SIMULATED 택배사로 개발한다(docs/25).
  DELIVERY_KOREAPOST_SERVICE_KEY: "REPLACE_ME_or_leave_empty"

  # ---- Postgres (서비스별 동일 계정/비밀번호를 쓰는 기존 구조를 유지) ----
  # 각 서비스 Deployment는 이 값과 POSTGRES_HOST(ConfigMap)를 조합해 SPRING_DATASOURCE_URL을 구성합니다.
  LOCAL_DB_PASSWORD: "REPLACE_ME_postgres_password"

  # ---- mTLS 키스토어 (PKCS12) 비밀번호 ----
  # 실제 인증서 파일 자체는 Secret이 아니라 30-tls-keystore Secret(파일 기반)으로 별도 생성합니다.
  # (아래 README 참고)
  LOCAL_KEY_STORE_PASSWORD: "REPLACE_ME_keystore_password"
  LOCAL_KEY_PASSWORD: "REPLACE_ME_key_password"

  # ---- Kafka mTLS 키스토어 비밀번호 ----
  KAFKA_SSL_TRUST_STORE_PASSWORD: "REPLACE_ME_kafka_truststore_password"
  KAFKA_SSL_KEY_STORE_PASSWORD: "REPLACE_ME_kafka_keystore_password"

  # ---- 소셜 로그인 (선택 — 없으면 해당 버튼이 표시되지 않는다) ----
  #
  # 프로바이더 콘솔에서 앱을 만들고 redirect URI 를 정확히 이렇게 등록한다:
  #   https://<도메인>/user-service/login/oauth2/code/google   (github·facebook·kakao·line 동일)
  # 발급처: Google Cloud Console(OAuth 클라이언트) · GitHub Settings→Developer settings
  #        →OAuth Apps · Meta for Developers(Facebook 로그인) · Kakao Developers(카카오 로그인 —
  #        ID 는 REST API 키, 시크릿은 [보안] Client Secret) · LINE Developers(LINE 로그인 채널 —
  #        채널 ID·채널 시크릿, 이메일 주소 권한 신청 필요). docs/33 §7 참조.
  # OAUTH2_GOOGLE_CLIENT_ID: ""
  # OAUTH2_GOOGLE_CLIENT_SECRET: ""
  # OAUTH2_GITHUB_CLIENT_ID: ""
  # OAUTH2_GITHUB_CLIENT_SECRET: ""
  # OAUTH2_FACEBOOK_CLIENT_ID: ""
  # OAUTH2_FACEBOOK_CLIENT_SECRET: ""
  # OAUTH2_KAKAO_CLIENT_ID: ""
  # OAUTH2_KAKAO_CLIENT_SECRET: ""
  # OAUTH2_LINE_CLIENT_ID: ""
  # OAUTH2_LINE_CLIENT_SECRET: ""

  # ---- AWS S3 (user-service 프로필 이미지 · catalog-service 상품 이미지) ----
  # ⚠️ 이 값들이 없으면 두 서비스는 'Could not resolve placeholder AMAZON_ACCESS_KEY' 로
  # **기동조차 하지 못한다**(k3s 검증에서 실측). S3 를 쓰지 않더라도 더미 값이라도 필요하다.
  # IRSA(IAM Roles for Service Accounts)로 옮기면 키 자체를 없앨 수 있다 — 권장 경로.
  AMAZON_ACCESS_KEY: "REPLACE_ME_aws_access_key"
  AMAZON_SECRET_KEY: "REPLACE_ME_aws_secret_key"
  AMAZON_BUCKET_NAME: "REPLACE_ME_bucket"
  AMAZON_REGION: "ap-northeast-2"

  # ---- Elasticsearch (catalog-service) ----
  LOCAL_ELASTICSEARCH_USERNAME: "REPLACE_ME_es_username"
  LOCAL_ELASTICSEARCH_PASSWORD: "REPLACE_ME_es_password"

  # ---- MongoDB (chat-service) ----
  # SPRING_DATA_MONGODB_CLIENT 은 커스텀 프로퍼티(spring.data.mongodb.client)를 그대로 오버라이드합니다.
  SPRING_DATA_MONGODB_CLIENT: "mongodb://admin:REPLACE_ME_mongo_password@mongodb.mongodb.svc.cluster.local:27017/chat?ssl=false"
  SPRING_DATA_MONGODB_PASSWORD: "REPLACE_ME_mongo_password"

  # ---- SMTP (notification-service 가 모든 메일을 발송한다 — docs/29) ----
  # user-service 에서 옮겨 왔다. 메일을 실제로 보내는 쪽이 접속 정보를 갖는 것이 맞다.
  # MAIL_PROVIDER=smtp 로 켤 때만 필요하다(k8s/47 참조).
  #
  # ⚠️ MAIL_PROVIDER=smtp 로 켠다면 아래 넷을 **반드시 채운다.** 안 채우면
  #    notification-service 가 기동에서 막힌다(MailConfig → Placeholders). 예전에는
  #    그냥 통과했고, "REPLACE_ME_smtp_host" 로 DNS 조회가 실패하며 가입 확인 메일이
  #    25초 만에 재시도 상한을 태우고 조용히 버려졌다. 증상은 "가입은 됐는데 메일이
  #    안 온다" 하나뿐이었다.
  #
  # Gmail 을 쓴다면: MAIL_HOST=smtp.gmail.com, MAIL_PORT=587,
  #   MAIL_USERNAME 은 Gmail 주소, MAIL_PASSWORD 는 **앱 비밀번호**(일반 비밀번호는 거부된다).
  #   그리고 MAIL_FROM(k8s-overlays/local/patch-mail.yaml)은 MAIL_USERNAME 과 같아야 한다 —
  #   Gmail 은 계정과 다른 발신자를 550 으로 거절한다.
  MAIL_HOST: "REPLACE_ME_smtp_host"
  MAIL_PORT: "587"
  MAIL_USERNAME: "REPLACE_ME_smtp_username"
  MAIL_PASSWORD: "REPLACE_ME_smtp_app_password"

  # ---- PayPal (프론트) — ⛔ 여기 넣지 마세요 ----
  #
  # 예전에는 이 자리에 REACT_APP_PAYPAL_CLIENT_ID 가 있었습니다. **아무도 읽지 않는
  # 값이었습니다.** REACT_APP_* 는 CRA 가 `npm run build` 때 문자열 리터럴로 치환해
  # 번들에 박습니다. 프론트엔드 이미지는 nginx 가 정적 파일을 서빙할 뿐이라, 파드에
  # 환경변수를 넣어도 그걸 읽을 프로세스가 없습니다.
  #
  # 그런데 이 파일에 있으면 "채웠으니 됐겠지" 하게 됩니다 — 실제로 그렇게 믿고 배포한
  # 뒤 결제 화면에서만 이렇게 터졌습니다:
  #
  #     SDK Validation error: 'Expected client-id to be passed'
  #
  # 값은 **빌드할 때** 넘깁니다(CLIENT_ID 자체는 공개 값이라 번들에 박혀도 됩니다):
  #
  #     REACT_APP_PAYPAL_CLIENT_ID=<client id> \
  #       ./ops/19-build-images.sh --registry ghcr.io/<owner> --push
  #
  # ops/19 가 비어 있으면 경고하고, ConfigurationGuardrailTest B-51 이 이 키가
  # 매니페스트로 되돌아오는 것을 막습니다.

  # ---- PayPal 결제 검증 (order-service, docs/35) ----
  # 🔴 이쪽은 **진짜 시크릿**입니다. 서버가 PayPal Orders API 로 결제를 확인할 때 씁니다.
  #    없으면 order-service 가 기동하지 않습니다(의도된 fail closed).
  #    Developer Dashboard → 앱 → Credentials 에서 발급합니다.
  # ── Stripe ──────────────────────────────────────────────────────────────
  #
  # 🔑 test/live 스위치는 없다. 키 자체가 sk_test_ / sk_live_ 로 말하고, order-service
  #    기동 로그가 어느 쪽인지 찍는다. 스위치를 따로 두면 키와 어긋난 값이 거짓말이 된다.
  #
  # 웹훅 비밀은 **대시보드에서 엔드포인트를 만들 때** 나오는 whsec_… 다.
  # 이 값이 없으면 인증 없이 열린 웹훅 URL 을 아무나 호출할 수 있다 — order-service 는
  # stripe.enabled=true 인데 이 값이 비어 있으면 기동을 막는다.
  # ── 포트원(구 아임포트) ─────────────────────────────────────────────────
  # 관리자 콘솔 → 결제 연동 → 식별코드·API Keys 에서 가져온다.
  # ⚠️ imp_secret 은 한 번만 보여 준다. 웹훅 서명이 없는 대신 이 키로 API 를 다시 조회해
  #    결제를 확인하므로, 이 값이 새면 결제 내역을 조회당할 수 있다.
  PORTONE_API_KEY: "REPLACE_ME_portone_api_key"
  PORTONE_API_SECRET: "REPLACE_ME_portone_api_secret"
  # V2 계정(PORTONE_VERSION=v2)이면 위 둘 대신 아래 둘. API Secret 은 콘솔 → 결제연동 →
  # API Keys 에서 발급(한 번만 보여 준다), 웹훅 시크릿(whsec_…)은 웹훅 엔드포인트를 만들 때 나온다.
  PORTONE_V2_API_SECRET: "REPLACE_ME_portone_v2_api_secret"
  PORTONE_V2_WEBHOOK_SECRET: "REPLACE_ME_portone_v2_webhook_secret"

  STRIPE_SECRET_KEY: "REPLACE_ME_stripe_secret_key"
  STRIPE_WEBHOOK_SECRET: "REPLACE_ME_stripe_webhook_secret"

  PAYPAL_CLIENT_ID: "REPLACE_ME_paypal_client_id"
  PAYPAL_CLIENT_SECRET: "REPLACE_ME_paypal_client_secret"

  # ══════════════════════════════════════════════════════════════════════
  #  아래는 인프라를 클러스터 밖 관리형 서비스로 뺄 때만 필요합니다
  #  (k8s-overlays/external, docs/32). 클러스터 안 인프라를 쓰면 비워 두세요.
  # ══════════════════════════════════════════════════════════════════════

  # ---- 관리형 Redis (Upstash 등) ----
  # 이 값이 있으면 모든 서비스가 이걸 씁니다. 없으면 LOCAL_DB_PASSWORD 로 폴백합니다
  # (클러스터 안 Redis 는 DB 와 같은 비밀번호를 쓰는 기존 구조).
  # ⚠️ 관리형 Redis 의 비밀번호는 DB 비밀번호와 다르므로 **반드시** 채워야 합니다.
  # 클러스터 안 Redis 도 DB 와 분리하는 것이 맞다 — ops/36-rotate-redis-password.sh 가 이 키와 redis-auth 를 끊김 없이
  # 함께 바꾼다(값은 출력하지 않는다, docs/57 §12). 한 번 분리하면 DB 비밀번호를 바꿀 때 Redis 를 맞출 필요가 없다.
  # SPRING_DATA_REDIS_PASSWORD: "REPLACE_ME_managed_redis_password"

  # ---- 관리형 Kafka (Confluent Cloud / Redpanda / Aiven) ----
  # k8s-overlays/external 의 KAFKA_SECURITY_PROTOCOL 을 SASL_SSL 로 바꿀 때만 필요합니다.
  # 콘솔이 JAAS 한 줄을 통째로 주면 KAFKA_SASL_JAAS_CONFIG 쪽을 쓰세요(우선순위가 높습니다).
  # KAFKA_SASL_USERNAME: "REPLACE_ME_api_key"
  # KAFKA_SASL_PASSWORD: "REPLACE_ME_api_secret"
  # KAFKA_SASL_JAAS_CONFIG: "REPLACE_ME_full_jaas_line"
  #
  # ⚠️ SASL_SSL 로 바꾸면 위쪽의 KAFKA_SSL_*_PASSWORD 는 쓰이지 않습니다.
  #    스토어 **경로**(ConfigMap)도 반드시 비워야 합니다 — 사설 CA 트러스트스토어가 남아 있으면
  #    공개 CA 로 발급된 관리형 브로커 인증서 검증에 실패합니다(docs/32 §4).

  # ---- 관리형 MongoDB (Atlas) ----
  # 위쪽 SPRING_DATA_MONGODB_CLIENT 을 Atlas 접속 문자열로 바꾸면 됩니다. 예:
  #   mongodb+srv://USER:PASSWORD@cluster0.xxxxx.mongodb.net/chat?retryWrites=true&w=majority
  # mongodb+srv 는 TLS 가 기본이며, 인증서 경로(ConfigMap 의 SPRING_DATA_MONGODB_CACERT 등)를
  # 비워야 JVM 기본 신뢰 저장소로 검증합니다(docs/32 §4).
