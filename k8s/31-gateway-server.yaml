apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-server
  namespace: ecommerce
  labels:
    app: gateway-server
  annotations:
    # 신원 인증서가 갱신되면(cert-manager — k8s/96) 롤링 재시작 — keystore 는 기동할 때만 읽는다.
    secret.reloader.stakater.com/reload: "tls-id-gateway-server"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway-server
  template:
    metadata:
      labels:
        app: gateway-server
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: gateway-server
          # 이미지는 ops/19-build-images.sh 가 ops/Dockerfile.runtime 으로 만든다(CI 와 같은 경로 — 모듈별 Dockerfile 은 지웠다).
          image: REGISTRY_PLACEHOLDER/ecommerce-msa/gateway-server:1.0.0
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ecommerce-config
            - secretRef:
                name: ecommerce-secrets
          env:
            # Eureka 등록 · 하트비트에 내는 클라이언트 인증서 = 이 서비스의 신원(/app/identity, CN=서비스 이름). Eureka 는 등록부를 바꾸는
            # 요청을 그 CN 이 앱 이름과 같을 때만 받는다(EUREKA_WRITE_AUTH_MODE, docs/57 §16 "Eureka 쓰기"). JVM 키스토어는 Eureka
            # 클라이언트가 쓰지 않는다 — 설정은 common application-common.yml 의 eureka.client.tls(B-86).
            - name: EUREKA_CLIENT_TLS_ENABLED
              value: "true"
            - name: SPRING_APPLICATION_NAME
              value: "gateway-server"
            # 분산 추적 → 이 노드에서 도는 관측 스택의 OTel Collector(docker-compose-observability.yml, :4318)
            # (docs/51 §4d, docs/63). 설정 기본값 localhost:4318 은 파드 안에서는 파드 자신이라 추적이 어디에도
            # 가지 않는다. 노드 IP 는 downward API 로 받는다 — 매니페스트에 IP 를 적지 않는다.
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: "http://$(HOST_IP):4318/v1/traces"
            # 인증서 SAN 이 커버하는 이름으로 Eureka 에 등록한다.
            # 기본값(prefer-ip-address: true)대로면 파드 IP 로 등록되는데, 파드 IP 는 인증서
            # SAN 에 넣을 수 없으므로(동적) 게이트웨이의 TLS 검증이 'No subject alternative
            # names matching IP address ...' 로 전부 거부한다 — 스테이징 리허설(ops/12)에서
            # 실측한 실패다. 서비스 DNS 는 와일드카드 SAN(*.ecommerce.svc.cluster.local)이
            # 커버하고, k8s Service 가 파드로 부하분산해 준다.
            #
            # ⚠️ 트레이드오프(HPA 로 레플리카가 2 이상이 될 때):
            #   모든 레플리카가 **같은 주소**로 등록되므로 Eureka 의 클라이언트 사이드
            #   로드밸런싱은 실질적으로 무력화되고, 분배는 k8s Service(kube-proxy)가 맡는다.
            #   기능적으로는 정상이지만(요청은 고르게 분산된다) Eureka 대시보드에서
            #   인스턴스별 구분이 흐려진다. 파드별 신원이 꼭 필요하면 선택지는 둘이다:
            #     ① StatefulSet + 헤드리스 Service 로 파드별 안정 DNS 를 부여하고
            #        그 이름들을 SAN 에 포함시킨다.
            #     ② 서비스 메시(mTLS 를 사이드카에 위임)로 옮긴다.
            #   현재 규모(maxReplicas 3)에서는 ①의 복잡도가 이득보다 크다고 판단했다.
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "false"
            - name: EUREKA_INSTANCE_HOSTNAME
              value: "gateway-server.ecommerce.svc.cluster.local"
            # 서비스 JVM 이 사설 CA 를 신뢰하게 한다.
            # LOCAL_TRUST_STORE_PATH 는 server.ssl / eureka.client.tls 같은 **특정 설정**만 읽는다.
            # 반면 Eureka 클라이언트 등록(Jersey), Feign 호출, 액추에이터 아웃바운드는 전부
            # **JVM 기본 트러스트스토어**를 쓰므로, 사설 CA 로 발급한 환경에서는
            # 'PKIX path building failed' 로 서비스 등록 자체가 실패한다(k3s 검증에서 실측:
            # 파드 9/9 가 Running 인데 Eureka 등록은 0건이었다).
            # $(VAR) 치환은 같은 env 목록의 앞선 항목만 참조할 수 있어 비밀번호를 여기서 다시 선언한다.
            - name: LOCAL_KEY_STORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: LOCAL_KEY_STORE_PASSWORD
            # 🔒 스토어 비밀번호는 JAVA_TOOL_OPTIONS 에 넣지 않는다 — JVM 이 기동마다 그 변수를 통째로 "Picked up JAVA_TOOL_OPTIONS: …"
            #    로 stderr 에 찍어 파드 로그 · Loki 에 평문으로 남았다. 앱이 기동 첫 순간에 아래 변수를 javax.net.ssl.*Password 로
            #    옮긴다(common JvmSslPasswords · 게이트웨이 · config-server 는 main, B-83).
            - name: JAVAX_NET_SSL_TRUST_STORE_PASSWORD
              value: "$(LOCAL_KEY_STORE_PASSWORD)"
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -Djavax.net.ssl.trustStore=/app/resources/truststore.p12
                -Djavax.net.ssl.trustStoreType=PKCS12
            - name: LOCAL_KEY_STORE_PATH
              value: "/app/resources/keystore.p12"
            # 인증서 경로는 키스토어 하나가 아니라 **다섯 개가 한 세트**다(docs/18 §4 산출물 표).
            # 예전에는 키스토어 경로만 주입해, eureka.client.tls 의 file:${LOCAL_TRUST_STORE_PATH} 가
            # placeholder 그대로 남아 'KeyStore not exists: URL [file:${...}]' 로 기동이 죽었다
            # (k3s 검증에서 실측 — 둘 다 넣었던 gateway 만 살아났다).
            - name: LOCAL_CACERT_PATH
              value: "/app/resources/ca.crt"
            - name: LOCAL_CRT_PATH
              value: "/app/resources/tls.crt"
            - name: LOCAL_KEY_PATH
              value: "/app/resources/tls.key"
            - name: LOCAL_TRUST_STORE_PATH
              value: "/app/resources/truststore.p12"
            # 🔒 백엔드로 넘길 때 내는 게이트웨이 자기 인증서(CN=gateway-server). 받는 쪽은 신원 헤더를 이 인증서로 온 요청에서만
            # 믿는다(docs/57 §16, INTERNAL_AUTH_IDENTITY_MODE). JVM 기본 keystore 가 아니라 게이트웨이 HttpClient 설정이다 —
            # Netty 클라이언트는 JVM keystore 를 읽지 않는다(application-local.yml httpclient.ssl.key-store).
            - name: GATEWAY_CLIENT_KEY_STORE
              value: "file:/app/identity/keystore.p12"
          volumeMounts:
            # 🔴 JVM 충돌 기록(hs_err) — 파드가 사는 동안 남는다(컨테이너가 다시 떠도). 꺼내기: docs/83 §2.8 · B-97
            #    [JA] JVM のクラッシュ記録 — Pod が生きている間は残る(コンテナが再起動しても)。
            - name: jvm-crash
              mountPath: /var/log/jvm
            - name: tls-keystore
              mountPath: /app/resources
              readOnly: true
            - name: tls-id
              mountPath: /app/identity
              readOnly: true
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8000
              scheme: HTTPS
            # 5초 × 60 = 5분. 이 서비스들은 기동 중 Flyway 마이그레이션·Eureka 등록·Kafka
            # 컨슈머 배정을 모두 수행하며, 노드가 붐빌 때는 웹 컨텍스트 초기화만 40초가 걸린다.
            # 기존 150초 예산은 그런 순간에 **정상 기동을 죽여** CrashLoop 로 오인하게 만든다
            # (k3s 검증에서 exit 137 로 실측).
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8000
              scheme: HTTPS
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8000
              scheme: HTTPS
            periodSeconds: 10
      volumes:
        # 🔴 JVM 충돌 기록(ops/Dockerfile.runtime 의 -XX:ErrorFile) — 로그(Loki)로 보내지 않는다: 기록에 메모리 내용이 들어갈 수 있다
        - name: jvm-crash
          emptyDir:
            sizeLimit: 64Mi
        - name: tls-keystore
          secret:
            secretName: tls-keystore
        - name: tls-id
          secret:
            secretName: tls-id-gateway-server
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-server
  namespace: ecommerce
spec:
  selector:
    app: gateway-server
  # 클러스터 안에서만 닿는다 — 바깥 트래픽은 Cloudflare 터널(k8s-overlays/prod/cloudflared.yaml)이
  # 이 Service 로 보낸다. 게이트웨이는 스스로 HTTPS(mTLS)를 종료하므로 앞단 TLS 종료는 없다.
  #
  # 🐛 예전에는 `type: LoadBalancer` 였다. 운영 k3s 는 `--disable servicelb`(ops/23)라 외부 IP 는 붙지 않지만,
  #    LoadBalancer 는 nodePort(30000~32767)를 함께 받아 **모든 노드의 그 포트가 게이트웨이로 열렸다** — 터널 · 클라우드
  #    방화벽 한 겹만 남은 셈이고, 같은 VCN · 노드에서는 그대로 닿았다. 노트북에서 바로 붙으려면
  #    `kubectl -n ecommerce port-forward svc/gateway-server 8000:8000`(ops/28 의 스모크도 이 방식).
  #    LoadBalancer → ClusterIP 는 `kubectl apply` 가 서버가 준 nodePort 를 지워 그대로 바뀐다(k3s v1.30 실측).
  # 🔒 B-85: 매니페스트의 Service 는 LoadBalancer · NodePort 가 아니다.
  # [JA] クラスター内だけで届く。以前の LoadBalancer は servicelb 無効でも nodePort を受け、全ノードのそのポートが開いていた(B-85)。
  type: ClusterIP
  ports:
    - name: https
      port: 8000
      targetPort: 8000
