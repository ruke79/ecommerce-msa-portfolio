apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-server
  namespace: ecommerce
  labels:
    app: gateway-server
  annotations:
    # 신원 인증서가 갱신되면(cert-manager — k8s/96) 롤링 재시작 — keystore 는 기동할 때만 읽는다.
    secret.reloader.stakater.com/reload: "tls-id-gateway-server"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway-server
  template:
    metadata:
      labels:
        app: gateway-server
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: gateway-server
          # docker build --build-arg SERVICE_DIR=gateway-server --build-arg SPRING_PROFILES_ACTIVE=local \
          #   -t <registry>/ecommerce-msa/gateway-server:1.0.0 -f gateway-server/Dockerfile .
          image: REGISTRY_PLACEHOLDER/ecommerce-msa/gateway-server:1.0.0
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ecommerce-config
            - secretRef:
                name: ecommerce-secrets
          env:
            - name: SPRING_APPLICATION_NAME
              value: "gateway-server"
            # 분산 추적 → 이 노드에서 도는 관측 스택의 OTel Collector(docker-compose-observability.yml, :4318)
            # (docs/51 §4d, docs/63). 설정 기본값 localhost:4318 은 파드 안에서는 파드 자신이라 추적이 어디에도
            # 가지 않는다. 노드 IP 는 downward API 로 받는다 — 매니페스트에 IP 를 적지 않는다.
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: "http://$(HOST_IP):4318/v1/traces"
            # 인증서 SAN 이 커버하는 이름으로 Eureka 에 등록한다.
            # 기본값(prefer-ip-address: true)대로면 파드 IP 로 등록되는데, 파드 IP 는 인증서
            # SAN 에 넣을 수 없으므로(동적) 게이트웨이의 TLS 검증이 'No subject alternative
            # names matching IP address ...' 로 전부 거부한다 — 스테이징 리허설(ops/12)에서
            # 실측한 실패다. 서비스 DNS 는 와일드카드 SAN(*.ecommerce.svc.cluster.local)이
            # 커버하고, k8s Service 가 파드로 부하분산해 준다.
            #
            # ⚠️ 트레이드오프(HPA 로 레플리카가 2 이상이 될 때):
            #   모든 레플리카가 **같은 주소**로 등록되므로 Eureka 의 클라이언트 사이드
            #   로드밸런싱은 실질적으로 무력화되고, 분배는 k8s Service(kube-proxy)가 맡는다.
            #   기능적으로는 정상이지만(요청은 고르게 분산된다) Eureka 대시보드에서
            #   인스턴스별 구분이 흐려진다. 파드별 신원이 꼭 필요하면 선택지는 둘이다:
            #     ① StatefulSet + 헤드리스 Service 로 파드별 안정 DNS 를 부여하고
            #        그 이름들을 SAN 에 포함시킨다.
            #     ② 서비스 메시(mTLS 를 사이드카에 위임)로 옮긴다.
            #   현재 규모(maxReplicas 3)에서는 ①의 복잡도가 이득보다 크다고 판단했다.
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "false"
            - name: EUREKA_INSTANCE_HOSTNAME
              value: "gateway-server.ecommerce.svc.cluster.local"
            # 서비스 JVM 이 사설 CA 를 신뢰하게 한다.
            # LOCAL_TRUST_STORE_PATH 는 server.ssl / eureka.client.tls 같은 **특정 설정**만 읽는다.
            # 반면 Eureka 클라이언트 등록(Jersey), Feign 호출, 액추에이터 아웃바운드는 전부
            # **JVM 기본 트러스트스토어**를 쓰므로, 사설 CA 로 발급한 환경에서는
            # 'PKIX path building failed' 로 서비스 등록 자체가 실패한다(k3s 검증에서 실측:
            # 파드 9/9 가 Running 인데 Eureka 등록은 0건이었다).
            # $(VAR) 치환은 같은 env 목록의 앞선 항목만 참조할 수 있어 비밀번호를 여기서 다시 선언한다.
            - name: LOCAL_KEY_STORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: LOCAL_KEY_STORE_PASSWORD
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -Djavax.net.ssl.trustStore=/app/resources/truststore.p12
                -Djavax.net.ssl.trustStorePassword=$(LOCAL_KEY_STORE_PASSWORD)
                -Djavax.net.ssl.trustStoreType=PKCS12
            - name: LOCAL_KEY_STORE_PATH
              value: "/app/resources/keystore.p12"
            # 인증서 경로는 키스토어 하나가 아니라 **다섯 개가 한 세트**다(docs/18 §4 산출물 표).
            # 예전에는 키스토어 경로만 주입해, eureka.client.tls 의 file:${LOCAL_TRUST_STORE_PATH} 가
            # placeholder 그대로 남아 'KeyStore not exists: URL [file:${...}]' 로 기동이 죽었다
            # (k3s 검증에서 실측 — 둘 다 넣었던 gateway 만 살아났다).
            - name: LOCAL_CACERT_PATH
              value: "/app/resources/ca.crt"
            - name: LOCAL_CRT_PATH
              value: "/app/resources/tls.crt"
            - name: LOCAL_KEY_PATH
              value: "/app/resources/tls.key"
            - name: LOCAL_TRUST_STORE_PATH
              value: "/app/resources/truststore.p12"
            # 🔒 백엔드로 넘길 때 내는 게이트웨이 자기 인증서(CN=gateway-server). 받는 쪽은 신원 헤더를 이 인증서로 온 요청에서만
            # 믿는다(docs/57 §16, INTERNAL_AUTH_IDENTITY_MODE). JVM 기본 keystore 가 아니라 게이트웨이 HttpClient 설정이다 —
            # Netty 클라이언트는 JVM keystore 를 읽지 않는다(application-local.yml httpclient.ssl.key-store).
            - name: GATEWAY_CLIENT_KEY_STORE
              value: "file:/app/identity/keystore.p12"
          volumeMounts:
            - name: tls-keystore
              mountPath: /app/resources
              readOnly: true
            - name: tls-id
              mountPath: /app/identity
              readOnly: true
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8000
              scheme: HTTPS
            # 5초 × 60 = 5분. 이 서비스들은 기동 중 Flyway 마이그레이션·Eureka 등록·Kafka
            # 컨슈머 배정을 모두 수행하며, 노드가 붐빌 때는 웹 컨텍스트 초기화만 40초가 걸린다.
            # 기존 150초 예산은 그런 순간에 **정상 기동을 죽여** CrashLoop 로 오인하게 만든다
            # (k3s 검증에서 exit 137 로 실측).
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8000
              scheme: HTTPS
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8000
              scheme: HTTPS
            periodSeconds: 10
      volumes:
        - name: tls-keystore
          secret:
            secretName: tls-keystore
        - name: tls-id
          secret:
            secretName: tls-id-gateway-server
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-server
  namespace: ecommerce
spec:
  selector:
    app: gateway-server
  # 게이트웨이는 스스로 HTTPS(mTLS)를 종료하므로, 앞단에서 별도 TLS 종료 없이
  # k3s 내장 ServiceLB(Klipper)로 바로 외부 노출합니다. 커스텀 도메인 + 공인 인증서를
  # 붙이려면 Traefik IngressRoute의 TLS passthrough를 별도로 구성하세요(README 참고).
  type: LoadBalancer
  ports:
    - name: https
      port: 8000
      targetPort: 8000
