# config-server — 내부 API 를 부르지 않는다. 이 신원은 Eureka 에 자기를 등록할 때만 낸다(docs/57 §16 "Eureka 쓰기").
# [JA] config-server — 内部 API を呼ばない。この身元は Eureka に自分を登録するときだけ出す(docs/57 §16「Eureka 書き込み」)。
