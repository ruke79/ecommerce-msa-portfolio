# 서비스별 신원 인증서를 cert-manager 가 발급·갱신한다 (docs/57 §18).
#
# ⚠️ kustomization.yaml 에 넣지 않았다 — cert-manager(CRD)가 먼저 있어야 적용된다. **ops/39-cert-manager.sh** 로만 적용한다
#    (설치 → CA 등록 → 이 파일 → Ready 확인).
#
# 무엇을 만드나: 서비스마다 Secret tls-id-<서비스> — ops/38 이 손으로 만들던 것과 **같은 이름·같은 키**다(tls.crt·tls.key·
# ca.crt·keystore.p12). 그래서 매니페스트(k8s/40~49)는 바뀌지 않는다. 발급자만 바뀐다.
#
#   · 수명 90일, 만료 30일 전에 새로 발급(키도 새로 — rotationPolicy: Always)
#   · keystore.p12 비밀번호는 서비스들이 이미 쓰는 값(ecommerce-secrets 의 LOCAL_KEY_STORE_PASSWORD)
#   · 자바는 keystore 를 기동할 때만 읽는다 — Secret 이 바뀌면 Reloader 가 그 Deployment 를 롤링 재시작한다
#     (각 Deployment 의 secret.reloader.stakater.com/reload 주석)
#
# CA 개인키는 cert-manager 네임스페이스의 Secret internal-ca 에만 둔다(ClusterIssuer 의 규칙) — 앱 네임스페이스(ecommerce)에서
# Secret 을 읽을 수 있는 것이 생겨도 CA 키는 거기 없다.
# [JA] サービス別の身元証明書を cert-manager が発行・更新する(docs/57 §18)。
#      
#      ⚠️ kustomization.yaml には入れていない — cert-manager(CRD)が先にないと適用できない。**ops/39-cert-manager.sh** でのみ適用する
#         (インストール → CA 登録 → このファイル → Ready 確認)。
#      
#      何を作るか: サービスごとに Secret tls-id-<サービス> — ops/38 が手で作っていたものと**同じ名前・同じキー**である(tls.crt・tls.key・
#      ca.crt・keystore.p12)。だからマニフェスト(k8s/40~49)は変わらない。発行者だけが変わる。
#      
#        · 寿命 90 日、期限切れ 30 日前に再発行(鍵も新しく — rotationPolicy: Always)
#        · keystore.p12 のパスワードはサービスが既に使っている値(ecommerce-secrets の LOCAL_KEY_STORE_PASSWORD)
#        · Java は keystore を起動時にしか読まない — Secret が変わると Reloader がその Deployment をローリング再起動する
#          (各 Deployment の secret.reloader.stakater.com/reload アノテーション)
#      
#      CA 秘密鍵は cert-manager ネームスペースの Secret internal-ca にだけ置く(ClusterIssuer の規則) — アプリのネームスペース(ecommerce)で
#      Secret を読めるものができても CA 鍵はそこにない。
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: internal-ca
spec:
  ca:
    secretName: internal-ca
---
# 게이트웨이 — 백엔드로 넘길 때 내는 클라이언트 인증서(신원 헤더를 믿는 근거, docs/57 §16). 서버 인증서는 공유 tls-keystore 그대로.
# [JA] ゲートウェイ — バックエンドへ渡すときに出すクライアント証明書(身元ヘッダーを信じる根拠、docs/57 §16)。サーバー証明書は共有の tls-keystore のまま。
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: id-gateway-server
  namespace: ecommerce
spec:
  secretName: tls-id-gateway-server
  commonName: gateway-server
  subject:
    organizations: [ecommerce-msa]
  dnsNames:
    - gateway-server
    - gateway-server.ecommerce.svc.cluster.local
  usages: [client auth, server auth, digital signature, key encipherment]
  duration: 2160h      # 90일 ／ [JA] 90 日
  renewBefore: 720h    # 만료 30일 전 ／ [JA] 期限切れ 30 日前
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
  keystores:
    pkcs12:
      create: true
      profile: Modern2023          # AES-256/PBKDF2 — 자바 17 이 읽는다 ／ [JA] AES-256/PBKDF2 — Java 17 が読める
      passwordSecretRef:
        name: ecommerce-secrets
        key: LOCAL_KEY_STORE_PASSWORD
  issuerRef:
    name: internal-ca
    kind: ClusterIssuer
---
