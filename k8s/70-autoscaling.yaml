# notification-service 는 수평 확장이 안전하다.
#  · Kafka 컨슈머 그룹이 하나라 한 메시지는 한 파드만 받는다 (알림 중복 생성 없음)
#  · SMS 발송은 FOR UPDATE SKIP LOCKED 로 선점한다 (같은 문자가 두 통 가지 않는다)
# chat-service 는 반대로 브로드캐스트가 필요하다 — 그쪽은 Redis 팬아웃으로 모든 파드에 퍼뜨린다(아래 chat-service, docs/21 §2).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: notification-service
  namespace: ecommerce
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: notification-service }
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: notification-service
  namespace: ecommerce
spec:
  maxUnavailable: 1
  selector: { matchLabels: { app: notification-service } }
---
# delivery-service 는 수평 확장이 안전하다.
#  · Kafka 컨슈머 그룹이 하나라 결제 이벤트를 한 파드만 받는다 (배송 중복 생성 없음)
#  · 추적 폴링은 FOR UPDATE SKIP LOCKED 로 선점한다 — 잠금이 없으면 레플리카 둘이 같은
#    송장을 조회해 **택배사 API 쿼터를 두 배로 태운다**(docs/25 §5)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: delivery-service
  namespace: ecommerce
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: delivery-service }
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: delivery-service
  namespace: ecommerce
spec:
  maxUnavailable: 1
  selector: { matchLabels: { app: delivery-service } }
---
# chat-service — 2026-11-01 부터 늘릴 수 있다(docs/21 §2). 예전에는 인메모리 STOMP 브로커 때문에 1개 고정(B-34)이었다.
#  · 저장은 Kafka 컨슈머 그룹 하나에서 메시지당 한 번, 구독자에게는 Redis 채널로 모든 파드에(StompFanout · B-107)
#  · 상담 presence · 답변 알림 60초 억제도 Redis(파드마다의 메모리가 아니다)
# 최소 1 — SockJS 의 WebSocket 밖 폴백(xhr)은 같은 파드로 가야 해서, 부하가 없을 때는 하나로 둔다(k8s/46 주석).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chat-service
  namespace: ecommerce
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: chat-service }
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: chat-service
  namespace: ecommerce
spec:
  maxUnavailable: 1
  selector: { matchLabels: { app: chat-service } }
