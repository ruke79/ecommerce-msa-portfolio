# PostgreSQL 스탠바이 — 스트리밍 복제 · 수동 승격 (2026-11-23 11:2x UTC 운영 적용 — ops/65 prepare · apply: 데이터 노드 · LSN 일치 · 5,315MB · 쓰기 거절 · 디스크에 비밀번호 없음 · 앱 영향 없음)
# [JA] PostgreSQL スタンバイ — ストリーミング複製 · 手動昇格(2026-11-23 本番適用 — ops/65)
#
# 왜: 운영 PG 는 노드 한 대(Ampere)의 local-path 에만 있다 — 그 디스크가 죽으면 마지막 백업(매일 03:00 UTC)까지만 남는다(RPO 24시간).
#     2026-11-23 같은 VCN 에 붙인 데이터 노드(A1 arm64 · 라벨 · 테인트 ecommerce.io/data — ops/45 prepare --role data --isolate)에 물리 복제본을
#     두면 RPO 가 수 초가 된다. 앱은 승격 전까지 primary 만 본다 — 이 파일은 앱을 건드리지 않는다.
# [JA] 本番 PG は 1 ノードの local-path だけ — RPO 24 時間。同じ VCN のデータノードに物理複製を置いて数秒に。昇格までアプリは primary だけを見る。
#
# 손으로 하지 않는다 — ops/65-pg-standby.sh 가 아래 ① ~ ⑤ 를 한다(check · prepare · apply · promote · remove). 이미 한 단계는 다시 하지 않고
# (Secret · 계정 · 슬롯 · 설정 · 적용 · 승격마다 먼저 본다), 어긋난 상태면 바꾸기 전에 멈추고, 동시에 하나만 돈다(flock). 아래 명령은 그 스크립트가 하는 일의 기록이다.
# [JA] 手でやらない — ops/65-pg-standby.sh が ① 〜 ⑤ をする。済んだ段階は二度としない · 食い違いは止まる · 同時に一つだけ。
#
# 2026-11-23 운영 확인(읽기만): PG 16.15 · wal_level=replica · max_wal_senders=10 · hot_standby=on — primary 재시작이 필요 없다. pg_hba 에
# `host replication all 10.42.0.0/16 scram-sha-256` 이 이미 있다(데이터 노드 파드 10.42.3.0/24 포함). postgres 네임스페이스 정책은 같은
# 네임스페이스끼리 허용 — 그래서 스탠바이도 postgres 네임스페이스. 없던 것: 복제 계정 · 슬롯, max_slot_wal_keep_size=-1(무제한).
#
# ── ① primary 쪽 준비(운영 노드 · 재시작 없음 — 설정은 재적재만) ──────────────────────
#
#   umask 077; openssl rand -base64 24 | tr -d '\n' > /tmp/rp            # 비밀번호 — 화면 · 명령줄에 남기지 않는다
#   kubectl -n postgres create secret generic pg-replication --from-file=password=/tmp/rp
#   printf "CREATE ROLE replicator WITH REPLICATION LOGIN PASSWORD '%s';\n" "$(cat /tmp/rp)" \
#     | kubectl -n postgres exec -i deploy/postgres -c postgres -- psql -U postgres -v ON_ERROR_STOP=1 -q   # 표준 입력 — ps 에 보이지 않게
#   rm -f /tmp/rp
#   kubectl -n postgres exec -i deploy/postgres -c postgres -- psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
#   SELECT pg_create_physical_replication_slot('standby_oci2');
#   ALTER SYSTEM SET max_slot_wal_keep_size = '10GB';   -- 스탠바이가 오래 끊기면 슬롯을 버린다(primary 디스크 보호, 여유 33G) — 그때는 다시 받는다
#   SELECT pg_reload_conf();
#   SQL
#
# ── ② 적용 · 첫 받기 — kustomization 밖, 이 파일만 ─────────────────────────────────
#
#   kubectl apply -f k8s/91-postgres-standby.yaml
#   kubectl -n postgres logs -f deploy/postgres-standby -c basebackup      # 처음 한 번 — 약 5.3GB, 같은 VCN 이라 몇 분
#   kubectl -n postgres get pod -l app=postgres-standby -o wide            # NODE 가 데이터 노드
#
# ── ③ 확인 · 지켜볼 것 ─────────────────────────────────────────────────────────────
#
#   primary:  select application_name, state, sync_state, write_lag, replay_lag from pg_stat_replication;   → standby-oci2 · streaming · async
#             select slot_name, active, pg_size_pretty(pg_wal_lsn_diff(pg_current_wal_lsn(), restart_lsn)) from pg_replication_slots;
#   스탠바이: select pg_is_in_recovery(), pg_last_xact_replay_timestamp();   (kubectl -n postgres exec deploy/postgres-standby -c postgres -- psql -U postgres -c …)
#   슬롯이 붙잡은 WAL 이 10GB 에 다가가면 스탠바이가 끊긴 것이다 — 경보 규칙은 아직 없다. 백업 CronJob 은 그대로 primary 를 본다.
#
# ── ④ 승격(손으로 — primary 를 잃었을 때만) ───────────────────────────────────────
#
#   kubectl -n postgres exec deploy/postgres-standby -c postgres -- psql -U postgres -c "select pg_promote()"
#   kubectl -n postgres scale deploy/postgres --replicas=0          # 옛 primary 가 돌아와도 쓰기를 받지 않게 먼저
#   kubectl -n postgres patch svc postgres -p '{"spec":{"selector":{"app":"postgres-standby"}}}'
#   옛 primary 는 되살리지 않는다(갈라진 이력 — 다시 스탠바이로 쓰려면 비우고 새로 받는다). 이 Service 변경은 90-dev-infra 를 다시
#   apply 하면 되돌아간다 — 승격 뒤에는 그 파일을 고치기 전까지 apply 하지 않는다.
# [JA] 昇格は手動。先に旧 primary を 0 にし、Service のセレクターを standby へ。旧 primary は生き返らせない。90-dev-infra の再 apply で戻るので注意。
#
# ── ⑤ 되돌리기(스탠바이를 뺄 때) — 슬롯을 꼭 지운다 ────────────────────────────────
#
#   kubectl delete -f k8s/91-postgres-standby.yaml          # Deployment · PVC(데이터 노드의 사본)
#   kubectl -n postgres exec deploy/postgres -c postgres -- psql -U postgres -c "select pg_drop_replication_slot('standby_oci2')"
#   슬롯을 남기면 primary 가 그 뒤의 WAL 을 max_slot_wal_keep_size(10GB)까지 쌓는다. 계정 replicator · Secret pg-replication 은 남겨도 해가 없다.
# [JA] 外すときはスロットも必ず消す — 残すと primary が WAL を 10GB まで溜める。
#
# ── 지켜야 할 것 ──────────────────────────────────────────────────────────────────
#
#   · 라벨은 app=postgres-standby — `postgres` Service 의 셀렉터(app=postgres)와 겹치면 앱의 쓰기가 읽기 전용 스탠바이로 가서 실패한다.
#   · 이미지는 primary 와 같은 메이저(16) — 물리 복제는 메이저 · 아키텍처가 같아야 한다(데이터 노드도 arm64).
#   · 비밀번호는 디스크에 쓰지 않는다 — pg_basebackup -R 은 접속 문자열을 비밀번호째 postgresql.auto.conf 에 적는다. passfile(메모리 볼륨)을 쓴다.
#   · 승격은 손으로 — 자동 승격은 컨트롤 플레인이 셋(서버 3 멤버)이 된 뒤에 판단한다.
#
# 감시: ops/65 monitor-install — 운영 노드 1분 타이머가 node-exporter textfile(pg_standby.prom)로, 경보 그룹 postgres-standby(지표 낡음 · 스트리밍 끊김 ·
#       지연 · 슬롯 WAL 절반 · 슬롯 유실 — promtool 시험 observability/tests/pg-standby-rules.test.yml).
# 시험: PostgresStandbyManifestTest(라벨 · 배치 · 인증서 볼륨 · 비밀번호 · 슬롯 이름 · 이미지 · kustomization 밖)
---
# 스탠바이의 PGDATA. local-path 는 WaitForFirstConsumer — 파드가 뜬 노드(데이터 노드)의 디스크에 만든다. 그 노드의
# /var/lib/rancher/k3s/storage 는 데이터 볼륨(/mnt/data)에 바인드 마운트돼 있다(2026-11-23 노드 준비 때).
# ⚠️ 지우면 스탠바이를 처음부터 다시 받는다(primary 에 basebackup 부하 한 번). 운영 데이터 5.3GB(2026-11-23) — 크기는 local-path 가 강제하지 않는다.
# [JA] スタンバイの PGDATA。local-path は WaitForFirstConsumer — Pod が起きたノード(データノード)のディスクに作る。そのノードの
# [JA] /var/lib/rancher/k3s/storage はデータボリューム(/mnt/data)にバインドマウントしてある(2026-11-23 のノード準備時)。
# [JA] ⚠️ 消すとスタンバイを最初から取り直す(primary に basebackup の負荷が一度)。本番データ 5.3GB(2026-11-23) — 大きさは local-path が強制しない。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-standby-data
  namespace: postgres
  labels: { ecommerce.io/infra: postgres-standby }
spec:
  accessModes: [ ReadWriteOnce ]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-standby
  namespace: postgres
  labels: { ecommerce.io/infra: postgres-standby }
spec:
  replicas: 1
  # primary 와 같은 이유 — 두 postgres 가 같은 PGDATA 를 동시에 열면 손상된다.
  # [JA] primary と同じ理由 — 二つの postgres が同じ PGDATA を同時に開くと壊れる。
  strategy: { type: Recreate }
  selector: { matchLabels: { app: postgres-standby } }
  template:
    metadata:
      labels: { app: postgres-standby }
    spec:
      # 데이터 노드에만(ops/45 prepare --role data --isolate 가 단 라벨 · 테인트). 앱 파드는 그 테인트로 막혀 있다.
      # [JA] データノードだけに(ops/45 prepare --role data --isolate が付けたラベル · テイント)。アプリの Pod はそのテイントで止められている。
      nodeSelector: { ecommerce.io/data: "true" }
      tolerations:
        - { key: ecommerce.io/data, operator: Equal, value: "true", effect: NoSchedule }
      initContainers:
        # ① 인증서 · passfile — 파드마다 메모리 볼륨에. primary 의 postgresql.conf(basebackup 으로 그대로 온다)가
        #    ssl_cert_file = '/var/lib/postgresql/tls/…' 를 가리킨다(B-93 — PGDATA 밖이라 파드마다 채운다).
        # [JA] 証明書と passfile を Pod ごとにメモリボリュームへ。primary の postgresql.conf がそのまま来るので証明書パスも同じ。
        - name: copy-secrets
          image: mirror.gcr.io/postgres:16-alpine
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              cp /pg-tls/tls.crt /pg-tls/tls.key /var/lib/postgresql/tls/
              chown postgres:postgres /var/lib/postgresql/tls/tls.crt /var/lib/postgresql/tls/tls.key
              chmod 600 /var/lib/postgresql/tls/tls.key
              # 물리 복제 접속의 데이터베이스 칸은 replication — 이름이 아니라 그 낱말에 맞춘다
              # [JA] 物理複製の接続のデータベース欄は replication — 名前ではなくその語に合わせる
              umask 077
              printf '%s:5432:replication:replicator:%s\n' "postgres.postgres.svc.cluster.local" "$(cat /pg-replication/password)" \
                > /var/lib/postgresql/run/pgpass
              chown postgres:postgres /var/lib/postgresql/run/pgpass
          volumeMounts:
            - { name: pg-tls, mountPath: /pg-tls, readOnly: true }
            - { name: pg-replication, mountPath: /pg-replication, readOnly: true }
            - { name: pg-tls-run, mountPath: /var/lib/postgresql/tls }
            - { name: pg-run, mountPath: /var/lib/postgresql/run }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
        # ② 처음 한 번 — PGDATA 가 비어 있을 때만 primary 에서 통째로 받는다. 이미 받았으면(PG_VERSION) 아무것도 하지 않는다.
        #    비어 있지도 않고 PG 데이터도 아니면 멈춘다(지우지 않는다 — 사람이 본다).
        # [JA] 初回だけ — PGDATA が空のときだけ primary から丸ごと受け取る。受け取り済みなら何もしない。空でも PG でもなければ止まる。
        - name: basebackup
          image: mirror.gcr.io/postgres:16-alpine
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              D=/var/lib/postgresql/data
              if [ -s "$D/PG_VERSION" ]; then
                echo "이미 받은 데이터(PG $(cat "$D/PG_VERSION")) — 건너뛴다"
                exit 0
              fi
              if [ -n "$(ls -A "$D" 2>/dev/null)" ]; then
                echo "PGDATA 가 비어 있지 않은데 PG_VERSION 이 없다 — 멈춘다(지우지 않는다): $(ls -A "$D" | head -5 | tr '\n' ' ')" >&2
                exit 1
              fi
              chown postgres:postgres "$D"
              chmod 700 "$D"
              echo "primary 에서 받기 시작 — 슬롯 $SLOT"
              # -R 은 쓰지 않는다(비밀번호가 postgresql.auto.conf 에 남는다) — 접속 설정은 본 컨테이너의 -c 로
              # [JA] -R は使わない(パスワードが postgresql.auto.conf に残る) — 接続設定は本体コンテナの -c で
              su-exec postgres pg_basebackup -h postgres.postgres.svc.cluster.local -p 5432 -U replicator \
                -D "$D" -X stream -S "$SLOT" --checkpoint=fast -v
              su-exec postgres touch "$D/standby.signal"
              echo "받기 끝 — standby.signal 을 놓았다"
          env:
            - { name: SLOT, value: standby_oci2 }
            - { name: PGPASSFILE, value: /var/lib/postgresql/run/pgpass }
            - { name: PGSSLMODE, value: require }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: pg-run, mountPath: /var/lib/postgresql/run, readOnly: true }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
      containers:
        - name: postgres
          image: mirror.gcr.io/postgres:16-alpine
          # 접속 설정은 명령줄로 — 파일에 남지 않고, passfile 경로를 바꾸면 다음 기동에 그대로 먹는다. 승격 뒤에는(standby.signal 없음) 쓰이지 않는다.
          # [JA] 接続設定はコマンドラインで — ファイルに残らない。昇格後は使われない。
          args:
            - postgres
            - -c
            - "primary_conninfo=host=postgres.postgres.svc.cluster.local port=5432 user=replicator passfile=/var/lib/postgresql/run/pgpass sslmode=require application_name=standby-oci2"
            - -c
            - primary_slot_name=standby_oci2
          ports: [ { containerPort: 5432 } ]
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: pg-tls-run, mountPath: /var/lib/postgresql/tls, readOnly: true }
            - { name: pg-run, mountPath: /var/lib/postgresql/run, readOnly: true }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "postgres"] }
            periodSeconds: 5
          # primary 와 같은 크기 — 승격하면 같은 일을 한다
          # [JA] primary と同じ大きさ — 昇格すれば同じ仕事をする
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: pg-standby-data } }
        - { name: pg-tls, secret: { secretName: pg-tls } }
        - { name: pg-replication, secret: { secretName: pg-replication } }
        - { name: pg-tls-run, emptyDir: { medium: Memory, sizeLimit: 1Mi } }
        - { name: pg-run, emptyDir: { medium: Memory, sizeLimit: 1Mi } }
